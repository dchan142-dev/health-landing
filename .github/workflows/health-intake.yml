name: Health intake checks

on:
  pull_request:
    paths:
      - "intake/**"
      - "server/**"
      - "api/**"
      - "scripts/**"
      - "tests/**"
      - "package*.json"
      - "vercel.json"
      - ".github/workflows/health-intake.yml"
  push:
    branches: ["feat/client-health-intake"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
