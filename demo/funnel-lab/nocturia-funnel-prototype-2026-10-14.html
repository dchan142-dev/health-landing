<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Health Decoder · 夜尿源頭解碼全屏互動原型 (Zero-Scroll 9:16 Prototype)</title>
  <style>
    :root {
      --bg-dark: #070d17;
      --card-glass: rgba(13, 23, 42, 0.88);
      --card-border: rgba(255, 255, 255, 0.14);
      --teal: #14b8a6;
      --teal-bright: #2dd4bf;
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.16);
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #020617;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    /* 頂部開發者快速測試列（僅桌面或頂部極窄條顯示，方便 Duncan 一鍵跳頁與載入短片） */
    .dev-bar {
      width: 100%;
      max-width: 430px;
      height: 36px;
      background: #0f172a;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 12px;
      z-index: 100;
      flex-shrink: 0;
    }
    .dev-bar select, .dev-bar button, .dev-bar label {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 11px;
      cursor: pointer;
    }
    .dev-bar input[type="file"] {
      display: none;
    }

    /* 9:16 單屏全屏手機容器（100% 鎖定單屏，零上下滾動） */
    .phone-viewport {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: calc(100dvh - 36px);
      max-height: 900px;
      background: var(--bg-dark);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 20px 60px rgba(0,0,0,0.75);
    }
    @media (min-width: 500px) {
      .phone-viewport {
        border-radius: 28px;
        border: 3px solid #1e293b;
        height: min(calc(100dvh - 48px), 850px);
      }
      .dev-bar {
        border-radius: 12px;
        margin-bottom: 6px;
        border: 1px solid rgba(255,255,255,0.15);
      }
    }

    /* 背景全屏影片舞台（佔全屏，上半 54% 為 Duncan 頭像構圖安全區） */
    .video-stage {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: radial-gradient(circle at 50% 24%, #134e4a 0%, #0f172a 52%, #020617 100%);
      overflow: hidden;
    }
    .video-stage video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .video-stage.has-video video {
      display: block;
    }
    /* 當未載入真實 MOV 時的構圖安全區視覺模擬 */
    .framing-guide {
      position: absolute;
      top: 44px;
      left: 14px;
      right: 14px;
      height: 44%;
      border: 1.5px dashed rgba(45, 212, 191, 0.35);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      text-align: center;
      background: linear-gradient(180deg, rgba(15,23,42,0.25) 0%, rgba(15,23,42,0.55) 100%);
      pointer-events: none;
    }
    .video-stage.has-video .framing-guide {
      display: none;
    }
    .avatar-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0d9488, #0284c7);
      border: 2.5px solid #5eead4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
      box-shadow: 0 0 24px rgba(20, 184, 166, 0.45);
      position: relative;
    }
    .sound-wave {
      display: flex;
      gap: 4px;
      align-items: center;
      height: 18px;
      margin-top: 4px;
    }
    .sound-wave span {
      width: 3.5px;
      background: var(--teal-bright);
      border-radius: 3px;
      animation: wave 1.1s infinite ease-in-out;
    }
    .sound-wave span:nth-child(1) { height: 8px; animation-delay: 0s; }
    .sound-wave span:nth-child(2) { height: 16px; animation-delay: 0.2s; }
    .sound-wave span:nth-child(3) { height: 11px; animation-delay: 0.4s; }
    .sound-wave span:nth-child(4) { height: 18px; animation-delay: 0.1s; }
    .sound-wave span:nth-child(5) { height: 9px; animation-delay: 0.3s; }
    @keyframes wave {
      0%, 100% { transform: scaleY(0.55); opacity: 0.6; }
      50% { transform: scaleY(1.15); opacity: 1; }
    }
    .clip-badge {
      font-size: 12px;
      color: #5eead4;
      background: rgba(13, 148, 136, 0.22);
      border: 1px solid rgba(94, 234, 212, 0.4);
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 4px;
    }
    .framing-note {
      font-size: 12px;
      color: var(--text-sub);
      max-width: 90%;
      line-height: 1.35;
    }

    /* 頂部常駐控制列（進度條 ＋ 返回 ＋ CC 字幕開關 ＋ 語音朗讀） */
    .top-hud {
      position: relative;
      z-index: 10;
      padding: 8px 12px 4px;
      background: linear-gradient(180deg, rgba(2,6,23,0.85) 0%, rgba(2,6,23,0) 100%);
    }
    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255,255,255,0.18);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #14b8a6, #38bdf8);
      width: 10%;
      transition: width 0.28s ease;
    }
    .hud-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .hud-btn {
      background: rgba(15, 23, 42, 0.78);
      color: #f8fafc;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .hud-btn.active {
      background: rgba(20, 184, 166, 0.28);
      border-color: #2dd4bf;
      color: #5eead4;
    }

    /* 可開關隱藏字幕區（CC Subtitle Box，浮現於畫面中段偏上，不遮擋底部按鈕） */
    .cc-box {
      position: relative;
      z-index: 10;
      margin: auto 12px 6px;
      background: rgba(2, 6, 23, 0.84);
      border: 1px solid rgba(94, 234, 212, 0.35);
      border-radius: 14px;
      padding: 9px 12px;
      font-size: 14.5px;
      line-height: 1.42;
      color: #fef08a;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .cc-box.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      height: 0;
      padding: 0;
      margin: 0 12px;
      border: none;
      overflow: hidden;
    }
    .cc-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: #2dd4bf;
      margin-right: 6px;
    }

    /* 下半屏單屏操作面板（Glassmorphism Action Deck，不超過單屏，零上下滾動） */
    .action-deck {
      position: relative;
      z-index: 10;
      background: var(--card-glass);
      border-top: 1px solid var(--card-border);
      border-radius: 22px 22px 0 0;
      padding: 14px 14px 16px;
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      gap: 9px;
      max-height: 64%;
      justify-content: flex-end;
    }
    .step-kicker {
      font-size: 12px;
      font-weight: 700;
      color: var(--teal-bright);
      letter-spacing: 0.03em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .screen-title {
      font-size: 18.5px;
      font-weight: 800;
      line-height: 1.28;
      color: #ffffff;
    }
    .disclaimer-pill {
      font-size: 12px;
      line-height: 1.35;
      color: #fde68a;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.38);
      border-radius: 10px;
      padding: 6px 9px;
    }

    /* 大字高對比選項按鈕 */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .opt-btn {
      width: 100%;
      text-align: left;
      background: rgba(30, 41, 59, 0.88);
      color: #f8fafc;
      border: 1.5px solid rgba(255,255,255,0.16);
      border-radius: 13px;
      padding: 11px 13px;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
    }
    .opt-btn:hover, .opt-btn:active {
      border-color: var(--teal-bright);
      background: rgba(15, 118, 110, 0.28);
    }
    .opt-btn.selected {
      background: rgba(20, 184, 166, 0.25);
      border-color: #2dd4bf;
      color: #ffffff;
      box-shadow: 0 0 0 1px #2dd4bf;
    }
    .opt-btn.danger-opt {
      border-color: rgba(239, 68, 68, 0.45);
      color: #fecaca;
    }

    /* 主行動大掣 */
    .primary-cta {
      width: 100%;
      background: linear-gradient(135deg, #14b8a6 0%, #0284c7 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 13px 16px;
      font-size: 17px;
      font-weight: 800;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(20, 184, 166, 0.35);
    }
    .primary-cta:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }
    .secondary-cta {
      width: 100%;
      background: rgba(30, 41, 59, 0.9);
      color: #e2e8f0;
      border: 1.5px solid rgba(255,255,255,0.22);
      border-radius: 13px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }

    /* 緊湊 3x3 答案覆核格（單屏零 Scroll） */
    .review-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .review-cell {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 10px;
      padding: 6px 7px;
      cursor: pointer;
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .review-cell:hover {
      border-color: var(--teal-bright);
    }
    .review-q {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    .review-q span {
      color: var(--teal-bright);
      font-weight: 700;
    }
    .review-a {
      font-size: 12.5px;
      font-weight: 700;
      color: #f8fafc;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 緊湊表單輸入 */
    .compact-inputs {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 6px;
    }
    .input-field {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255,255,255,0.24);
      border-radius: 10px;
      padding: 9px 10px;
      color: #fff;
      font-size: 14px;
    }

    /* 單屏小卡片組件（用於報告關鍵詞、單品卡、HMCS 5 步） */
    .mini-cards {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .mini-card {
      background: rgba(30, 41, 59, 0.82);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 11px;
      padding: 8px 10px;
      font-size: 13.5px;
      line-height: 1.32;
    }
    .mini-card strong {
      color: var(--teal-bright);
    }
    .product-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(45, 212, 191, 0.35);
      border-radius: 12px;
      padding: 8px 10px;
    }
    .product-row img {
      width: 46px;
      height: 46px;
      border-radius: 8px;
      object-fit: cover;
      background: #fff;
      flex-shrink: 0;
    }
    .product-info {
      flex: 1;
    }
    .product-info h4 {
      font-size: 14px;
      color: #fff;
    }
    .product-info p {
      font-size: 12px;
      color: var(--text-sub);
    }
    .chip-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .chip-btn {
      flex: 1;
      min-width: 30%;
      background: rgba(30, 41, 59, 0.85);
      border: 1.5px solid rgba(255,255,255,0.18);
      color: #f8fafc;
      padding: 8px 6px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }
    .chip-btn.selected {
      background: rgba(20, 184, 166, 0.28);
      border-color: #2dd4bf;
      color: #5eead4;
    }

    /* Stripe 模擬跳轉覆蓋層 */
    .stripe-modal {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: rgba(2, 6, 23, 0.94);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 14px;
    }
    .stripe-modal.show {
      display: flex;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(45, 212, 191, 0.25);
      border-top-color: #2dd4bf;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- 頂部開發測試工具列（方便 Duncan 快速跳頁及載入本機 01-16 短片） -->
  <div class="dev-bar">
    <span>🛠️ 原型預視：</span>
    <select id="quickJump" onchange="jumpToScreen(this.value)">
      <option value="0">0. 入口全屏短片</option>
      <option value="1">1. Q1 起夜次數</option>
      <option value="2">2. Q2 最想改善困擾</option>
      <option value="3">3. Q3 尿意先定醒先</option>
      <option value="4">4. Q4 夜間尿量感覺</option>
      <option value="5">5. Q5 排尿順暢與紅旗</option>
      <option value="6">6. Q6 睡前飲水習慣</option>
      <option value="7">7. 第6題暫時評估過場</option>
      <option value="8">8. Q7 日間身體訊號</option>
      <option value="9">9. Q8 長期用藥門閥</option>
      <option value="10">10. Q9 年齡與傾向</option>
      <option value="11">11. 付款前答案覆核與重填</option>
      <option value="12">12. 留資料＋Stripe $19.9</option>
      <option value="13">13. 報告卡 1/3：唯一成因解碼</option>
      <option value="14">14. 報告卡 2/3：日常微習慣</option>
      <option value="15">15. 報告卡 3/3：三大成交出口</option>
      <option value="16">16. 出口①：Eshop 單品網</option>
      <option value="17">17. 出口②：HMCS 5步流程</option>
      <option value="18">18. 出口②：HMCS 責任聲明與預約</option>
      <option value="19">19. 出口③：WhatsApp/FB 群組</option>
    </select>
    <label for="videoLoader" title="可一次過選取本機 01-welcome.MOV 等短片">📂 載入短片</label>
    <input type="file" id="videoLoader" accept="video/*" multiple onchange="loadLocalVideos(this.files)" />
  </div>

  <!-- 9:16 單屏全屏互動容器（Zero Scroll） -->
  <div class="phone-viewport">
    <!-- 背景全屏影片舞台 -->
    <div class="video-stage" id="videoStage">
      <video id="bgVideo" playsinline webkit-playsinline controlslist="nodownload"></video>
      <div class="framing-guide">
        <div class="clip-badge" id="clipBadge">🎬 鏡頭位：01-welcome.MOV</div>
        <div class="avatar-circle">Duncan</div>
        <div class="sound-wave"><span></span><span></span><span></span><span></span><span></span></div>
        <p class="framing-note" id="framingNote" style="margin-top:6px;">
          【9:16 拍片構圖安全區】<br/>上半屏 55% 為 Duncan 頭像至心口區，下半屏 45% 留給按鈕浮層（零上下滾動）
        </p>
      </div>
    </div>

    <!-- 頂部常駐控制列 -->
    <div class="top-hud">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="hud-controls">
        <button class="hud-btn" id="backBtn" onclick="goBack()">⬅ 上一頁</button>
        <div style="display:flex; gap:6px;">
          <button class="hud-btn" id="ttsBtn" onclick="speakCurrentScript()">🔊 聽語音</button>
          <button class="hud-btn active" id="ccToggleBtn" onclick="toggleCC()">CC 字幕：開</button>
        </div>
      </div>
    </div>

    <!-- 可開關隱藏字幕浮層（CC） -->
    <div class="cc-box" id="ccBox">
      <span class="cc-tag">[口播字幕]</span>
      <span id="ccText">載入中...</span>
    </div>

    <!-- 下半屏單屏操作區（文字極簡，只作操作引導與重要聲明） -->
    <div class="action-deck" id="actionDeck"></div>

    <!-- Stripe 自動回跳模擬層 -->
    <div class="stripe-modal" id="stripeModal">
      <div class="spinner"></div>
      <h3 style="font-size:20px;">Stripe 安全收款確認中（HK$19.9）</h3>
      <p style="font-size:14px; color:#cbd5e1; line-height:1.5;">
        正在核對一次性付款並鎖定你嘅問卷答案...<br/>
        <strong style="color:#5eead4;">確認完成後將自動跳回頁面並交付專屬報告</strong>
      </p>
    </div>
  </div>

  <script>
    // 狀態管理
    const state = {
      screen: 0,
      ccOpen: true,
      paidLocked: false,
      editingFromReview: false,
      localVideos: {},
      answers: {
        q1: "2 至 3 次",
        q2: "醒咗眼光光好難瞓返",
        q3: "明顯係尿急谷醒我",
        q4: "同日頭差唔多，甚至仲多",
        q5: "以上都冇，排尿順暢",
        q6: "已特登戒水，瞓前只濕下口",
        q7: "傍晚對鞋緊咗／除襪有明顯襪印",
        q8: "冇食任何長期西藥",
        q9: "60–69 歲｜想先自己調理"
      },
      user: {
        name: "陳先生 (測試)",
        phone: "9123 4567",
        email: "demo@health-decoder.com"
      },
      hmcsConsent: false,
      hmcsLoc: "奧海城門市",
      hmcsTime: "平日日間"
    };

    // 五大單一成因資料庫（每次只按客戶回答判定並交付「唯一 1 個成因」，絕不顯示其餘四型干擾客人）
    const SINGLE_CAUSE_DB = {
      edema: {
        title: "下肢水腫平躺回流型",
        clipWhy: "10-report-why.MOV",

    // 點選問卷答案
    function selectAnswer(key, val, currentScreen) {
      state.answers[key] = val;
      if (key === "q5" && val.includes("🚨")) {
        state.screen = 99;
        renderScreen();
        return;
      }
      if (state.editingFromReview) {
        state.editingFromReview = false;
        state.screen = 11;
        renderScreen();
        return;
      }
      state.screen = currentScreen + 1;
      renderScreen();
    }

    function editQuestionFromReview(targetScreen) {
      state.editingFromReview = true;
      state.screen = targetScreen;
      renderScreen();
    }

    function goNext(target) {
      state.screen = target;
      renderScreen();
    }

    function goBack() {
      if (state.paidLocked && state.screen <= 13) return;
      if (state.editingFromReview) {
        state.editingFromReview = false;
        state.screen = 11;
        renderScreen();
        return;
      }
      if (state.screen === 16 || state.screen === 17 || state.screen === 19) {
        state.screen = 15;
        renderScreen();
        return;
      }
      if (state.screen > 0) {
        state.screen -= 1;
        renderScreen();
      }
    }

    function jumpToScreen(val) {
      state.screen = parseInt(val, 10);
      renderScreen();
    }

    function toggleCC() {
      state.ccOpen = !state.ccOpen;
      const box = document.getElementById("ccBox");
      const btn = document.getElementById("ccToggleBtn");
      if (state.ccOpen) {
        box.classList.remove("hidden");
        btn.classList.add("active");
        btn.textContent = "CC 字幕：開";
      } else {
        box.classList.add("hidden");
        btn.classList.remove("active");
        btn.textContent = "CC 字幕：關";
      }
    }

        `• 客戶稱呼：${state.user.name}\n` +
        `• WhatsApp：${state.user.phone}\n` +
        `• 唯一判定成因：${cause.title}\n` +
        `• 預約門市與時段：${state.hmcsLoc}（${state.hmcsTime}）\n` +
        `• 已確認同意：5步真實流程（首次檢測不即時成交）及 Coaching 責任邊界聲明`
      );
    }

    // 支援載入本機 01–16 短片即時配對播放
    function loadLocalVideos(files) {
      for (const f of files) {
        const key = f.name.toLowerCase().replace(/\.(mov|mp4|webm)$/, "");
        state.localVideos[key] = URL.createObjectURL(f);
      }
      alert(`已載入 ${files.length} 條本機短片！畫面將自動配對播放。`);
      renderScreen();
    }

    function setVideoClip(clipName, noteText) {
      document.getElementById("clipBadge").textContent = `🎬 鏡頭位：${clipName}`;
      document.getElementById("framingNote").innerHTML = `${noteText}<br/><small style="opacity:0.8">（可點頂部「📂 載入短片」放入本機 MOV 實測，或點「🔊 聽語音」試聽口播）</small>`;
      const baseKey = clipName.toLowerCase().replace(/\.(mov|mp4|webm)$/, "");
      const videoEl = document.getElementById("bgVideo");
      const stageEl = document.getElementById("videoStage");
      if (state.localVideos[baseKey]) {
        stageEl.classList.add("has-video");
        if (videoEl.src !== state.localVideos[baseKey]) {
          videoEl.src = state.localVideos[baseKey];
        }
        videoEl.play().catch(() => {});
      } else {
        stageEl.classList.remove("has-video");
        videoEl.pause();
      }
    }

    // 廣東話 TTS 模擬口播朗讀（無片時亦可聽節奏）
    function speakCurrentScript() {
      if (!("speechSynthesis" in window)) {
        alert("此瀏覽器不支援語音合成預覽");
        return;
      }
      window.speechSynthesis.cancel();
      const text = document.getElementById("ccText").textContent.replace(/[「」]/g, "");
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "zh-HK";
      utter.rate = 1.02;
      window.speechSynthesis.speak(utter);
    }

    // 初始化
    renderScreen();
  </script>
</body>
</html>
