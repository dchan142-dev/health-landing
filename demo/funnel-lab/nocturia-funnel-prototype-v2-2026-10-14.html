<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Health Decoder · 夜尿源頭解碼互動問卷與個人報告 (Conversational Prototype v2)</title>
  <style>
    /* ==========================================================================
       Health Decoder 暖白大字親和設計規範 (專為 50–75+ 歲感性長者優化)
       高對比 · 暖白護眼底色 · 超大字級 · 提問與回應分屏 · 支援自然捲動不裁切
       ========================================================================== */
    :root {
      --bg-warm: #FAF8F5;
      --surface: #FFFFFF;
      --surface-soft: #F1F5F9;
      --primary-navy: #0F172A;
      --text-main: #1E293B;
      --text-muted: #475569;
      --text-sub: #64748B;
      --teal: #0D9488;
      --teal-dark: #0F766E;
      --teal-light: #CCFBF1;
      --teal-soft: #F0FDFA;
      --teal-text: #115E59;
      --amber: #D97706;
      --amber-bg: #FFFBEB;
      --amber-border: #FDE68A;
      --amber-text: #92400E;
      --danger: #DC2626;
      --danger-bg: #FEF2F2;
      --danger-border: #FECACA;
      --border: #CBD5E1;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 26px;
      --shadow-card: 0 10px 30px rgba(15, 23, 42, 0.07);
      --shadow-btn: 0 6px 18px rgba(13, 148, 136, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100dvh;
      background-color: var(--bg-warm);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-size: 20px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* 頂部品牌導航與進度條 */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 90;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid #E2E8F0;
      backdrop-filter: blur(8px);
      padding: 10px 16px 12px;
    }
    .header-inner {
      max-width: 540px;
      margin: 0 auto;
    }
    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 8px;
    }
    .brand-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary-navy);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-title span {
      color: var(--teal);
    }
    .nav-tools {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tool-pill {
      background: var(--surface-soft);
      color: var(--primary-navy);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .tool-pill.active {
      background: var(--teal-light);
      color: var(--teal-text);
      border-color: var(--teal);
    }
    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #0D9488, #14B8A6);
      width: 10%;
      transition: width 0.35s ease;
    }

    /* 主容器：手機一屏舒適展示，長內容可自然順暢上下捲動，絕不切字 */
    .main-stage {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 14px 16px 48px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 真人視像對話窗 (Better-than-VideoAsk Conversational Stage) */
    .video-talk-card {
      background: #0F172A;
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      border: 2px solid #CBD5E1;
      position: relative;
      transition: all 0.3s ease;
    }
    .video-talk-header {
      background: rgba(15, 23, 42, 0.92);
      color: #F8FAFC;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 700;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .speaker-badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 8px #10B981;
    }
    .video-frame-wrap {
      position: relative;
      width: 100%;
      height: 250px;
      background: radial-gradient(circle at 50% 30%, #115E59 0%, #0F172A 75%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .video-talk-card.compact .video-frame-wrap {
      height: 190px;
    }
    .video-frame-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .video-frame-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .video-fallback-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      background: linear-gradient(180deg, rgba(15,23,42,0.3) 0%, rgba(15,23,42,0.82) 100%);
      color: #FFFFFF;
    }
    .play-big-btn {
      background: #0D9488;
      color: #FFFFFF;
      border: 2px solid #99F6E4;
      border-radius: 999px;
      padding: 10px 22px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.45);
      margin-bottom: 8px;
    }
    .play-big-btn:hover {
      background: #0F766E;
    }

    /* 可開關大字字幕框（擺放於視像窗底部，不遮擋問題與選項） */
    .cc-bar {
      background: #1E293B;
      color: #FEF08A;
      padding: 12px 16px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.5;
      border-top: 1px solid rgba(255,255,255,0.12);
    }
    .cc-bar.hidden {
      display: none;
    }
    .cc-label {
      color: #5EEAD4;
      font-size: 14px;
      font-weight: 800;
      margin-right: 6px;
    }

    /* 暖白大字主內容卡 */
    .content-card {
      background: var(--surface);
      border: 1.5px solid #E2E8F0;
      border-radius: var(--radius-xl);
      padding: 22px 18px 24px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      background: var(--teal-light);
      color: var(--teal-text);
      font-size: 15px;
      font-weight: 800;
      padding: 5px 14px;
      border-radius: 999px;
    }

    .q-heading {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.35;
      color: var(--primary-navy);
    }

    .q-hint {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: -6px;
    }

    /* 大字高對比選項掣（高度 >= 62px，長者極易點擊） */
    .options-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .choice-btn {
      width: 100%;
      min-height: 64px;
      text-align: left;
      background: #FFFFFF;
      color: var(--primary-navy);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.15s ease;
    }
    .choice-btn:hover {
      border-color: var(--teal);
      background: var(--teal-soft);
    }
    .choice-btn.selected {
      background: var(--teal-soft);
      border-color: var(--teal);
      color: var(--primary-navy);
      box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.2);
    }
    .choice-btn.none-choice {
      background: var(--surface-soft);
      border-style: dashed;
      color: #334155;
    }
    .choice-btn.none-choice.selected {
      background: #E2E8F0;
      border-style: solid;
      border-color: #475569;
      color: var(--primary-navy);
    }
    .choice-btn.danger-choice {
      background: var(--danger-bg);
      border-color: var(--danger-border);
      color: #991B1B;
    }

    .check-indicator {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 2px solid #94A3B8;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 900;
      color: #FFFFFF;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .choice-btn.radio-mode .check-indicator {
      border-radius: 50%;
    }
    .choice-btn.selected .check-indicator {
      background: var(--teal);
      border-color: var(--teal);
    }

    /* 主行動大掣 */
    .btn-main {
      width: 100%;
      min-height: 64px;
      background: var(--teal);
      color: #FFFFFF;
      border: none;
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.3;
      cursor: pointer;
      box-shadow: var(--shadow-btn);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
    }
    .btn-main:hover {
      background: var(--teal-dark);
    }
    .btn-main:disabled {
      background: #94A3B8;
      box-shadow: none;
      cursor: not-allowed;
    }

    .btn-sub {
      width: 100%;
      min-height: 56px;
      background: var(--surface-soft);
      color: var(--text-main);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 12px 18px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .btn-sub:hover {
      background: #E2E8F0;
    }

    /* 選後獨立「回應與進度頁」專用樣式 */
    .selected-recap-box {
      background: var(--surface-soft);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      font-size: 18px;
    }
    .selected-recap-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .duncan-reply-bubble {
      background: var(--teal-soft);
      border: 2px solid var(--teal);
      border-radius: var(--radius-lg);
      padding: 20px 18px;
      font-size: 21px;
      line-height: 1.6;
      color: var(--primary-navy);
      font-weight: 600;
    }
    .clue-dots-box {
      background: #FFFBEB;
      border: 1.5px solid #FDE68A;
      border-radius: var(--radius-md);
      padding: 14px 16px;
    }
    .clue-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 700;
      color: #78350F;
      margin-top: 6px;
    }

    /* 聲明與提示框 */
    .notice-amber {
      background: var(--amber-bg);
      border-left: 5px solid var(--amber);
      border-radius: 12px;
      padding: 16px;
      font-size: 18px;
      line-height: 1.55;
      color: var(--amber-text);
      font-weight: 600;
    }
    .notice-danger {
      background: var(--danger-bg);
      border-left: 5px solid var(--danger);
      border-radius: 12px;
      padding: 16px;
      font-size: 18px;
      line-height: 1.55;
      color: #991B1B;
      font-weight: 700;
    }

    /* 答案覆核清單（清晰大字、絕不裁切） */
    .review-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .review-item {
      background: var(--bg-warm);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .review-item-left {
      flex: 1;
    }
    .review-item-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .review-item-val {
      font-size: 19px;
      font-weight: 800;
      color: var(--primary-navy);
      margin-top: 2px;
    }
    .btn-edit-small {
      background: #FFFFFF;
      color: var(--teal-text);
      border: 1.5px solid var(--teal);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 留資料大字表單 */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary-navy);
    }
    .big-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 20px;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: #FFFFFF;
      color: var(--primary-navy);
      font-weight: 600;
    }
    .big-input:focus {
      outline: none;
      border-color: var(--teal);
    }

    /* 成因百分比長條圖（原版 Block C 設計） */
    .ratio-wrap {
      margin-bottom: 12px;
    }
    .ratio-head {
      display: flex;
      justify-content: space-between;
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 5px;
      color: var(--primary-navy);
    }
    .ratio-track {
      width: 100%;
      height: 14px;
      background: #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
    }
    .ratio-fill {
      height: 100%;
      border-radius: 999px;
    }

    /* 產品卡與詳情彈窗 */
    .prod-card {
      background: #FFFFFF;
      border: 2px solid #E2E8F0;
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
    }
    .prod-top {
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .prod-top img {
      width: 84px;
      height: 84px;
      object-fit: contain;
      border-radius: 12px;
      border: 1px solid #E2E8F0;
      background: #FFFFFF;
      padding: 4px;
      flex-shrink: 0;
    }
    .prod-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--primary-navy);
    }
    .prod-price {
      font-size: 20px;
      font-weight: 800;
      color: var(--teal-text);
      margin-top: 4px;
    }

    /* Modal 彈窗 */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(15, 23, 42, 0.72);
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.show {
      display: flex;
    }
    .modal-box {
      background: #FFFFFF;
      width: 100%;
      max-width: 520px;
      max-height: 86vh;
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 48px rgba(0,0,0,0.4);
    }
    .modal-head {
      padding: 16px 20px;
      background: var(--primary-navy);
      color: #FFFFFF;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      font-weight: 800;
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      font-size: 18px;
      line-height: 1.65;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <!-- 頂部常駐品牌與控制列 -->
  <header class="top-header">
    <div class="header-inner">
      <div class="brand-row">
        <div class="brand-title">🔬 Health Decoder <span>夜尿解碼</span></div>
        <div class="nav-tools">
          <button class="tool-pill" id="btnBackTop" onclick="handleBack()">⬅ 上一步</button>
          <button class="tool-pill active" id="btnCCTop" onclick="toggleCC()">字幕：開</button>
          <select class="tool-pill" id="devJumpSelect" onchange="devJump(this.value)" title="快速預視跳頁">
            <option value="welcome">預視：入口頁</option>
            <option value="q1">Q1 起夜頻率與醒來感覺</option>
            <option value="q2">Q2 夜間單次出水量</option>
            <option value="q3">Q3 排尿動作與出口【可多選】</option>
            <option value="q4">Q4 下肢水腫與肌力【可多選】</option>
            <option value="q5">Q5 代謝口乾與腸胃【可多選】</option>
            <option value="q6">Q6 睡眠結構與鼻鼾【可多選】</option>
            <option value="preview6">第6題後：暫時評估預覽</option>
            <option value="q7">Q7 現行西藥審查【可多選】</option>
            <option value="q8">Q8 優先改善目標與年齡</option>
            <option value="review">交付前：答案覆核與重填頁</option>
            <option value="checkout">留 Contact ＋ $19.9 解鎖頁</option>
            <option value="report1">報告 1：成因比例與唯一主成因</option>
            <option value="report2">報告 2：主成因機轉與工程比喻</option>
            <option value="report3">報告 3：微習慣與源頭修復</option>
            <option value="tier1_hmcs">第一層：HMCS 5步流程與預約</option>
            <option value="tier2_products">第二層：居家調理方案專區（產品）</option>
            <option value="tier3_group">第三層：FB / WhatsApp 養粉專區</option>
          </select>
        </div>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>
  </header>

  <!-- 主舞台 -->
  <main class="main-stage" id="mainStage"></main>

  <!-- 產品詳情 / Stripe 模擬彈窗 -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="closeModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-head">
        <span id="modalTitle">詳情</span>
        <button class="tool-pill" onclick="closeModal()">✕ 關閉</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. 真實影片資源庫（自動連去已部署喺 health-decoder.com 嘅 MP4 + Drive 雲端預覽 + 原版 Vimeo）
    // =========================================================================
    const VIDEO_CLIPS = {
      "01-welcome": {
        mp4: "https://health-decoder.com/demo/nocturia-video/clips/01-welcome.mp4",
        altMp4: "https://health-decoder.com/demo/nocturia-video/01-welcome.mp4",
        driveId: "1vLgY2koDsfrVf_88ygWsksNFelIbtZ8b",
        label: "Duncan 歡迎短片",
        cc: "你好，我係 Duncan。夜晚成日起身去廁所，最辛苦往往係瞓唔返，第二朝成個人散晒。我用幾個簡單問題同你傾下，幫你睇下邊啲身體線索最值得留意。唔使識醫學，揀最貼近你平時感覺嘅答案就得。"
      },
      "02-frequency": {
        mp4: "https://health-decoder.com/demo/nocturia-video/clips/02-frequency.mp4",
        altMp4: "https://health-decoder.com/demo/nocturia-video/02-frequency.mp4",
        driveId: "1NjEgNdvJ0TAn4FOc8xvIwK3qdRO_f0cw",
        label: "第 1 題：起夜次數與醒來感覺",
        cc: "先諗返平時一晚，你大概起身去幾多次廁所？係俾滿滿嘅尿意憋醒，定係人醒咗先順便去？揀最接近你嘅情況就可以。"
      },
      "04-volume": {
        mp4: "https://health-decoder.com/demo/nocturia-video/clips/04-volume.mp4",
        altMp4: "https://health-decoder.com/demo/nocturia-video/04-volume.mp4",
        driveId: "1BO-whFTuBTH5tLavdOb8EZJ-4JZ7SV3Y",
        label: "第 2 題：夜間每次出水量",
        cc: "夜晚每次去廁所，同日頭平時一次比較，大概差唔多甚至仲多，定係明顯得少少？未量過唔緊要，講你平時嘅感覺就得。"

    // =========================================================================
    // 5. 原版三級臨床仲裁計分引擎（計算 5 大成因比例 + 選出唯一主導成因）
    // =========================================================================
    function computeDiagnosis() {
      let scores = { 1: 1, 2: 1, 3: 1, 4: 1, 5: 1 };
      let hasHardcore = { 1: false, 2: false, 3: false, 4: false, 5: false };

      // Q1 + Q2
      if (state.answers.q1 === "D1_A") scores[1] += 3;
      if (state.answers.q1 === "D1_C") scores[1] += 4;
      if (state.answers.q1 === "D1_B") { scores[2] += 3; hasHardcore[2] = true; }
      if (state.answers.q1 === "D1_D") { scores[5] += 3; hasHardcore[5] = true; }

      if (state.answers.q2 === "DRINK_LESS_STILL_WAKE") { scores[1] += 3; scores[3] += 2; }
      if (state.answers.q2 === "DRINK_SOUP_WATER") { scores[1] += 2; scores[4] += 2; }
      if (state.answers.q2 === "WAKE_LATE_NIGHT") { scores[5] += 2; scores[2] += 1; }

      // Q3 (Dim 2)
      (state.answers.q3 || []).forEach(v => {
        if (v === "D2_A") { scores[2] += 4; hasHardcore[2] = true; }
        if (v === "D2_B") scores[2] += 3;
        if (v === "D2_C") scores[2] += 3;
      });

      // Q4 (Dim 3)
      (state.answers.q4 || []).forEach(v => {
        if (v === "D3_A") { scores[1] += 4; hasHardcore[1] = true; }
        if (v === "D3_B") { scores[1] += 3; hasHardcore[1] = true; }
        if (v === "D3_C") { scores[3] += 4; hasHardcore[3] = true; }
        if (v === "D3_D") scores[3] += 3;
      });

      // Q5 (Dim 4)
      (state.answers.q5 || []).forEach(v => {
        if (v === "D4_A") { scores[4] += 4; hasHardcore[4] = true; }
        if (v === "D4_B") scores[4] += 3;
        if (v === "D4_C") scores[4] += 3;
      });

      // Q6 (Dim 5)
      (state.answers.q6 || []).forEach(v => {
        if (v === "D5_A") { scores[5] += 4; hasHardcore[5] = true; }
        if (v === "D5_B") scores[5] += 3;
        if (v === "D5_C") scores[5] += 2;
      });

      // Q7 (Dim 6 西藥加權)
      const meds = state.answers.q7 || [];
      const isWarfarin = meds.includes("MED_WARFARIN");
      if (meds.includes("MED_BP")) scores[1] = Math.round(scores[1] * 1.25);
      if (meds.includes("MED_DIURETIC_SGLT2")) {
        scores[1] = Math.round(scores[1] * 1.2);
        scores[4] = Math.round(scores[4] * 1.2);
      }
      if (meds.includes("MED_DIABETES_GEN")) scores[4] = Math.round(scores[4] * 1.25);
      if (meds.includes("MED_STATIN")) scores[3] = Math.round(scores[3] * 1.2);

      // 計算百分比
      const total = Object.values(scores).reduce((a, b) => a + b, 0) || 1;
      let ratios = {};
      let sumPct = 0;
      for (let c = 1; c <= 4; c++) {
        ratios[c] = Math.round((scores[c] / total) * 100);
        sumPct += ratios[c];
      }
      ratios[5] = Math.max(0, 100 - sumPct);

      // 仲裁最高分主導成因（如有同分，按臨床優先級 [1, 4, 2, 3, 5] 決出唯一主成因）
      const priorityOrder = [1, 4, 2, 3, 5];
      let maxVal = Math.max(...Object.values(scores));
      let candidates = priorityOrder.filter(cid => scores[cid] === maxVal);
      let winningCause = candidates[0] || 1;
      let isTie = candidates.length > 1;

      return {
        winningCause,
        causeData: CAUSES_DATA[winningCause],
        ratios,
        isWarfarin,
        isTie,
        candidates
      };
    }

            <!-- 第三層分流出口：選不對產品又唔想買住，叫佢去 FB / WhatsApp 專區養粉 -->
            <div style="border-top:2px dashed var(--border); padding-top:18px; margin-top:8px; text-align:center;">

      // -----------------------------------------------------------------------
      // 第三層承接（選不對產品又唔想買住先進入）：FB / WhatsApp 專區養粉頁 (tier3_group)

          ${renderVideoTalkBox("01-welcome", "如果你今日未決定約見或者買產品住，千祈唔使有壓力！你頭先份個人報告已經發咗去你個 WhatsApp 同 Email 備份。我邀請你免費加入我哋嘅 WhatsApp 或者 Facebook 健康專區，每星期睇我直播拆解健康真相，幾時準備好都可以隨時搵我！", true)}

    // =========================================================================
    // 8. 互動事件處理器
    // =========================================================================
    function pickSingle(qId, val) {
      state.answers[qId] = val;
      render();
    }

    function toggleMulti(qId, val, isNone) {
      let cur = Array.isArray(state.answers[qId]) ? [...state.answers[qId]] : [];
      if (isNone) {
        // 揀「🚫 以上皆無」時自動清除其他選項
        cur = ["NONE"];
      } else {
        cur = cur.filter(x => x !== "NONE");
        if (cur.includes(val)) {
          cur = cur.filter(x => x !== val);
        } else {
          cur.push(val);
        }
      }
      state.answers[qId] = cur;
      render();
    }

    function confirmQuestionStep(qId) {
      // 檢查 Q3 是否有勾選紅旗急症
      if (qId === "q3" && Array.isArray(state.answers.q3) && state.answers.q3.includes("RED_FLAG")) {
        state.view = "redflag";
        render();
        return;
      }
      // 如果係由「答案覆核頁」跳返嚟改答案，改完即刻返去覆核頁
      if (state.editingFromReview) {
        state.editingFromReview = false;
        state.view = "review";
        render();
        return;
      }
      // 否則進入獨立一屏嘅「選後回應與進度頁」
      state.view = "reply_" + qId;
      render();
    }

    function clearRedFlagAndBack() {
      state.answers.q3 = ["NONE"];
      state.view = "q3";
      render();
    }

    function editFromReview(qId) {
      state.editingFromReview = true;
      state.view = qId;
      render();
    }

    function getHumanAnswerLabels(qId) {
      const q = QUIZ_STEPS[qId];
      const ans = state.answers[qId];
      if (!q) return "";
      if (q.mode === "single") {
        const found = q.options.find(o => o.val === ans);
        return found ? found.label : "未選擇";
      } else {
        const arr = Array.isArray(ans) ? ans : [];
        if (arr.length === 0) return "未選擇";
        return arr.map(v => {
          const f = q.options.find(o => o.val === v);
          return f ? f.label : v;
        }).join("；");
      }
    }

    function goView(target) {
      state.view = target;
      render();
    }

    function handleBack() {
      const v = state.view;
      if (state.editingFromReview) {
        state.editingFromReview = false;
        state.view = "review";
        render();
        return;
      }
      if (v.startsWith("reply_q")) {
        state.view = v.replace("reply_", "");
        render();
        return;
      }
      const backOrder = {
        q1: "welcome",
        q2: "reply_q1",
        q3: "reply_q2",
        q4: "reply_q3",
        q5: "reply_q4",
        q6: "reply_q5",
        preview6: "reply_q6",
        q7: "preview6",
        q8: "reply_q7",
        review: "reply_q8",
        checkout: "review",
        report2: "report1",
        report3: "report2",
        tier1_hmcs: "report3",
        tier2_products: "tier1_hmcs",
        tier3_group: "tier2_products"
      };
      if (backOrder[v]) {
        state.view = backOrder[v];
        render();
      }
    }

    function devJump(target) {
      state.view = target;
      render();
    }

    function toggleCC() {
      state.ccOpen = !state.ccOpen;
      const btn = document.getElementById("btnCCTop");
      btn.textContent = state.ccOpen ? "字幕：開" : "字幕：關";
      btn.classList.toggle("active", state.ccOpen);
      const box = document.getElementById("ccBarBox");
      if (box) box.classList.toggle("hidden", !state.ccOpen);
    }

    function simulateStripeCheckout() {
      if (!state.profile.name.trim() || !state.profile.phone.trim()) {
        alert("請先填寫你嘅稱呼及 WhatsApp 聯絡電話，以便接收報告備份！");
        return;
      }
      const modal = document.getElementById("modalBackdrop");
      document.getElementById("modalTitle").textContent = "💳 Stripe 安全收款確認中";
      document.getElementById("modalBody").innerHTML = `
        <div style="text-align:center; padding:20px 10px;">
          <div style="font-size:44px; margin-bottom:12px;">🔒</div>
          <h3 style="font-size:22px; color:var(--primary-navy); margin-bottom:8px;">正在確認 HK$19.9 一次性付款...</h3>
          <p style="font-size:18px; color:var(--text-muted);">
            已鎖定 <strong>${state.profile.name}（${state.profile.phone}）</strong> 嘅問卷答案與聯絡資料。<br/>
            正在由 Stripe 自動跳回頁面並生成你嘅專屬報告...
          </p>
        </div>
      `;
      modal.classList.add("show");
      setTimeout(() => {
        modal.classList.remove("show");
        state.paidLocked = true;
        state.view = "report1";
        render();
      }, 1200);
    }

    function openProductModal(prodId) {
      const p = PRODUCTS_DB[prodId];
      if (!p) return;
      document.getElementById("modalTitle").textContent = p.name;
      document.getElementById("modalBody").innerHTML = `
        <div style="text-align:center; margin-bottom:16px;">
          <img src="${p.img}" alt="${p.name}" style="width:160px; height:160px; object-fit:contain; border:1px solid #E2E8F0; border-radius:16px; padding:8px;" onerror="this.src='https://placehold.co/160x160/F0FDFA/0D9488?text=Product'" />
        </div>
        <div style="font-size:20px; font-weight:800; color:var(--teal-text); margin-bottom:8px;">
          單品售價：HK$${p.price} <small style="color:var(--text-sub); text-decoration:line-through;">原價 HK$${p.origPrice}</small>
        </div>
        <div style="font-size:16px; color:var(--text-muted); margin-bottom:12px;">規格與產地：${p.spec}</div>
        <p style="font-size:18px; line-height:1.65; margin-bottom:16px;">${p.detail}</p>
        <div class="notice-amber" style="font-size:16.5px; margin-bottom:16px;">
          💡 如想了解此產品與你整體方案嘅配搭及配套優惠，歡迎預約 HMCS 線下 1 對 1 評估服務。
        </div>
        <button type="button" class="btn-main" onclick="closeModal()">明白，關閉詳情</button>
      `;
      document.getElementById("modalBackdrop").classList.add("show");
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("show");
    }

    function submitHmcsRequest() {
      const diag = computeDiagnosis();
      document.getElementById("modalTitle").textContent = "✅ 線下訪談及檢測申請已提交";
      document.getElementById("modalBody").innerHTML = `
        <div style="font-size:19px; line-height:1.65;">
          <p style="margin-bottom:12px;"><strong>多謝你，${state.profile.name}！</strong>我哋已經收到你嘅 HMCS 線下服務預約意向：</p>
          <div style="background:var(--bg-warm); border:1.5px solid var(--border); border-radius:14px; padding:14px; margin-bottom:14px;">
            • <strong>優先處理主導成因：</strong>${diag.causeData.name}<br/>
            • <strong>預約門市：</strong>${state.hmcs.loc}<br/>
            • <strong>偏好時段：</strong>${state.hmcs.time}<br/>
            • <strong>聯絡 WhatsApp：</strong>${state.profile.phone}
          </div>
          <p style="font-size:17.5px; color:var(--text-muted); margin-bottom:16px;">
            📌 <strong>下一步：</strong>Duncan 團隊會透過 WhatsApp 與你核對具體日期與時間。記得首次見面只做詳細訪談及科學儀器數據收集（微電流／身體成份／骨密度），絕不即場硬銷！
          </p>
          <button type="button" class="btn-main" onclick="closeModal()">好，留意 WhatsApp 通知</button>
        </div>
      `;
      document.getElementById("modalBackdrop").classList.add("show");
    }

    // 啟動渲染
    render();
  </script>
