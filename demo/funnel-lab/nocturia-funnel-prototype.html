<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Health Decoder · 夜尿源頭解碼互動問卷與個人評估</title>
  <style>
    /* =========================================================================
       Health Decoder 原創單屏互動設計規範 (Zero-Scroll · 暖白玉 ✕ 深海青瓷)
       專為 50–75+ 歲香港長者設計：高對比、大字清晰、持久化視像窗零閃爍零跳動
       ========================================================================= */
    :root {
      --bg-canvas: #F7F4EE;
      --bg-stage: #FFFFFF;
      --bg-subtle: #F1EFEA;
      --bg-video: #0B3134;
      --ink-main: #16222A;
      --ink-secondary: #475569;
      --ink-muted: #64748B;
      --teal-primary: #0F5C5E;
      --teal-hover: #0B4648;
      --teal-soft: #E6F4F3;
      --teal-border: #8CD1CE;
      --amber-accent: #B45309;
      --amber-soft: #FEF3C7;
      --amber-border: #F59E0B;
      --danger-main: #B91C1C;
      --danger-soft: #FEE2E2;
      --border-line: #DCE2E5;
      --radius-lg: 14px;
      --radius-xl: 20px;
      --shadow-stage: 0 8px 24px rgba(22, 34, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-canvas);
      color: var(--ink-main);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* 頂部極簡導航列 (固定 44px 高) */
    .top-bar {
      height: 44px;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .brand-mark {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink-main);
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    .brand-mark span {
      color: var(--teal-primary);
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .mini-pill {
      background: #FFFFFF;
      color: var(--ink-main);
      border: 1px solid var(--border-line);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .mini-pill.active {
      background: var(--teal-soft);
      color: var(--teal-primary);
      border-color: var(--teal-primary);
    }

    /* 主舞台：桌面左右雙欄並排，手機上下緊湊單屏 (絕不超出 100dvh) */
    .app-shell {
      flex: 1;
      width: 100%;
      max-width: 1040px;
      height: calc(100dvh - 44px);
      margin: 0 auto;
      padding: 4px 12px 12px;
      display: grid;
      grid-template-columns: 330px 1fr;
      gap: 14px;
      overflow: hidden;
    }

    /* 左欄／上區：持久化真人視像同伴窗 (Persistent Video Companion) */
    .video-pane {
      background: var(--bg-video);
      border-radius: var(--radius-xl);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: var(--shadow-stage);
      border: 1px solid rgba(15, 92, 94, 0.25);
    }
    .video-top-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }
    .speaker-pill {
      background: rgba(11, 49, 52, 0.85);
      color: #F8FAFC;
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(6px);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2DD4BF;
      box-shadow: 0 0 8px #2DD4BF;
    }
    .video-canvas {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 0;
      background: radial-gradient(circle at 50% 35%, #165B5E 0%, #092224 85%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .video-canvas video {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      object-position: center center;
      display: block;
      background: transparent;
    }
    /* 視像底層預覽面板（當瀏覽器阻擋自動播放或離線預覽時顯示，點擊即播） */
    .video-poster-card {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      background: radial-gradient(circle at 50% 35%, rgba(22,91,94,0.88) 0%, rgba(9,34,36,0.94) 85%);
      color: #F8FAFC;
      cursor: pointer;
      transition: opacity 0.25s ease;
    }
    .video-poster-card.playing {
      opacity: 0;
      pointer-events: none;
    }
    .poster-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #14B8A6, #0F5C5E);
      border: 2.5px solid #99F6E4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #FFFFFF;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      margin-bottom: 8px;
    }
    .poster-title {
      font-size: 15px;
      font-weight: 800;
      color: #CCFBF1;
      margin-bottom: 4px;
    }
    .poster-sub {
      font-size: 12.5px;
      color: #CBD5E1;
      max-width: 240px;
      line-height: 1.35;
    }

    /* 隱藏字幕浮層 (預設關閉，按「字幕」才顯示於影片底部，不佔下方卡片高度) */
    .subtitle-drawer {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 44px;
      z-index: 6;
      background: rgba(9, 30, 32, 0.92);
      color: #FEF3C7;
      border: 1px solid rgba(140, 209, 206, 0.45);
      border-radius: 12px;
      padding: 8px 11px;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      backdrop-filter: blur(6px);
      display: none;
    }
    .subtitle-drawer.show {
      display: block;
    }
    .video-controls-bar {
      height: 40px;
      background: #082325;
      border-top: 1px solid rgba(255,255,255,0.12);
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 6;
    }
    .v-ctrl-btn {
      background: rgba(255,255,255,0.1);
      color: #F1F5F9;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .v-ctrl-btn.on {
      background: #14B8A6;
      color: #042F2E;
      border-color: #5EEAD4;
    }

    /* 右欄／下區：單屏互動卡片舞台 (Interactive Stage Card) */
    .stage-card {
      background: var(--bg-stage);
      border: 1.5px solid var(--border-line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-stage);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    /* 舞台頂部：進度條與三顆線索燈 */
    .stage-top {
      flex-shrink: 0;
      margin-bottom: 6px;
    }
    .stage-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      gap: 8px;
    }
    .step-pill {
      display: inline-flex;
      align-items: center;
      background: var(--teal-soft);
      color: var(--teal-primary);
      font-size: 13px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 999px;
    }
    .clue-lights {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-muted);
    }
    .clue-dot {
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-line);
      color: var(--ink-muted);
    }
    .clue-dot.lit {
      background: var(--amber-soft);
      border-color: var(--amber-border);
      color: var(--amber-accent);
    }
    .progress-rail {
      width: 100%;
      height: 6px;
      background: var(--bg-subtle);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--teal-primary), #189A96);
      width: 12%;
      transition: width 0.25s ease;
    }

    /* 舞台中央：問題與選項／原位回應區 (Flex 自適應，頂部對齊不裁字) */
    .stage-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 7px;
      overflow: hidden;
    }
    .stage-title {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.28;
      color: var(--ink-main);
      letter-spacing: -0.01em;
    }
    .stage-sub {
      font-size: 15px;
      font-weight: 600;
      color: var(--ink-secondary);
      line-height: 1.38;
      margin-top: -2px;
    }

    /* 單選按鈕列表 (最多 5 項，高度緊湊好撳) */
    .single-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .opt-pill {
      width: 100%;
      min-height: 44px;
      background: #FFFFFF;
      color: var(--ink-main);
      border: 2px solid var(--border-line);
      border-radius: 13px;
      padding: 8px 14px;
      font-size: 17.5px;
      font-weight: 700;
      line-height: 1.25;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .opt-pill:hover {
      border-color: var(--teal-primary);
      background: var(--teal-soft);
    }
    .opt-pill.selected {
      background: var(--teal-soft);
      border-color: var(--teal-primary);
      color: var(--teal-primary);
    }
    .opt-pill.none-style {
      background: var(--bg-subtle);
      border-style: dashed;
      color: var(--ink-secondary);
    }
    .opt-pill.danger-style {
      background: var(--danger-soft);
      border-color: #FCA5A5;
      color: var(--danger-main);
    }

    /* 多選雙欄膠囊網格 (2-Column Grid，令 6-8 個選項喺手機單屏只佔 3-4 行！) */
    .multi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .multi-cell {
      min-height: 44px;
      background: #FFFFFF;
      color: var(--ink-main);
      border: 2px solid var(--border-line);
      border-radius: 12px;
      padding: 7px 9px;
      font-size: 15.5px;
      font-weight: 700;
      line-height: 1.22;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.15s ease;
    }
    .multi-cell.selected {
      background: var(--teal-soft);
      border-color: var(--teal-primary);
      color: var(--teal-primary);
    }
    .multi-cell.none-cell {
      background: var(--bg-subtle);
      border-style: dashed;
    }
    .multi-cell.none-cell.selected {
      background: #E2E8F0;
      border-style: solid;
      border-color: var(--ink-secondary);
      color: var(--ink-main);
    }
    .tick-box {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid #94A3B8;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      color: #FFFFFF;
      flex-shrink: 0;
    }
    .multi-cell.selected .tick-box,
    .opt-pill.selected .tick-box {
      background: var(--teal-primary);
      border-color: var(--teal-primary);
    }

    /* 揀完選項後「原位收起選項、原位展開回應」組件 */
    .collapsed-answer-bar {
      background: var(--bg-subtle);
      border: 1.5px solid var(--border-line);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 15.5px;
      font-weight: 700;
      color: var(--ink-main);
    }
    .reselect-btn {
      background: #FFFFFF;
      color: var(--teal-primary);
      border: 1.5px solid var(--teal-primary);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }
    .feedback-card {
      background: var(--teal-soft);
      border: 2px solid var(--teal-border);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      font-size: 16.5px;
      line-height: 1.48;
      color: var(--ink-main);
      font-weight: 600;
    }
    .feedback-card strong {
      color: var(--teal-primary);
    }

    /* 圓角小標籤 (Tag) 覆核網格 —— 一屏睇晒全部已選答案，點擊即改 */
    .tag-review-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .tag-review-item {
      background: var(--bg-subtle);
      border: 1.5px solid var(--border-line);
      border-radius: 10px;
      padding: 6px 9px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .tag-review-item:hover {
      border-color: var(--teal-primary);
      background: var(--teal-soft);
    }
    .tag-review-k {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-muted);
      display: flex;
      justify-content: space-between;
    }
    .tag-review-k span {
      color: var(--teal-primary);
    }
    .tag-review-v {
      font-size: 14px;
      font-weight: 800;
      color: var(--ink-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 大字主行動按鈕與次要按鈕 */
    .stage-footer {
      flex-shrink: 0;
      padding-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .cta-primary {
      width: 100%;
      min-height: 48px;
      background: var(--teal-primary);
      color: #FFFFFF;
      border: none;
      border-radius: 13px;
      padding: 10px 16px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(15, 92, 94, 0.22);
    }
    .cta-primary:hover {
      background: var(--teal-hover);
    }
    .cta-primary:disabled {
      background: #94A3B8;
      box-shadow: none;
      cursor: not-allowed;
    }
    .cta-secondary {
      width: 100%;
      min-height: 38px;
      background: var(--bg-subtle);
      color: var(--ink-secondary);
      border: 1.5px solid var(--border-line);
      border-radius: 11px;
      padding: 6px 12px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .note-strip {
      background: var(--amber-soft);
      border: 1px solid var(--amber-border);
      color: var(--amber-accent);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
    }

    /* 成因百分比條 */
    .bar-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .bar-item {
      background: var(--bg-subtle);
      border-radius: 9px;
      padding: 5px 9px;
      border: 1px solid var(--border-line);
    }
    .bar-item.winner {
      background: var(--teal-soft);
      border: 2px solid var(--teal-primary);
    }
    .bar-head {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 2px;
    }
    .bar-track {
      height: 7px;
      background: #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
    }

    /* 表單輸入列 */
    .form-compact {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .inp-box {
      width: 100%;
      padding: 9px 12px;
      font-size: 15.5px;
      font-weight: 600;
      border: 1.5px solid var(--border-line);
      border-radius: 10px;
      color: var(--ink-main);
      background: #FFFFFF;
    }

    /* 緊湊步驟列表 (用於 HMCS 5 步及微習慣) */
    .compact-steps {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .compact-step-row {
      background: var(--bg-subtle);
      border: 1px solid var(--border-line);
      border-radius: 9px;
      padding: 6px 9px;
      font-size: 13.5px;
      line-height: 1.32;
      font-weight: 600;
    }
    .compact-step-row strong {
      color: var(--teal-primary);
    }

    /* 單品橫卡 */
    .sku-row {
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--bg-subtle);
      border: 1.5px solid var(--border-line);
      border-radius: 11px;
      padding: 6px 9px;
    }
    .sku-row img {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: contain;
      background: #FFFFFF;
      border: 1px solid var(--border-line);
      flex-shrink: 0;
    }

    /* 手機直向單屏適配 (< 820px)：上片下卡，嚴格鎖定 100dvh 零捲動 */
    @media (max-width: 820px) {
      .top-bar {
        height: 34px;
        padding: 0 8px;
      }
      .brand-mark {
        font-size: 13px;
        gap: 4px;
      }
      .mini-pill {
        padding: 3px 8px;
        font-size: 11.5px;
      }
      #quickJumpSel {
        max-width: 128px;
      }
      .clue-lights {
        display: none;
      }
      .app-shell {
        display: flex;
        flex-direction: column;
        height: calc(100dvh - 34px);
        gap: 5px;
        padding: 2px 8px 5px;
      }
      .video-pane {
        flex: 1 1 0%;
        min-height: 132px;
      }
      .video-top-tag {
        top: 6px;
        left: 6px;
        right: 6px;
      }
      .speaker-pill {
        padding: 2px 7px;
        font-size: 10.5px;
        max-width: 122px;
        white-space: nowrap;
      }
      .speaker-pill #clipLabel {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pulse-dot {
        flex-shrink: 0;
      }
      .video-poster-card {
        padding: 16px 10px 24px;
      }
      .poster-avatar {
        width: 32px;
        height: 32px;
        font-size: 14px;
        margin-bottom: 2px;
      }
      .poster-title {
        font-size: 12.5px;
        margin-bottom: 1px;
      }
      .poster-sub {
        font-size: 10.5px;
      }
      .video-controls-bar {
        position: absolute;
        left: 6px;
        right: 6px;
        bottom: 6px;
        height: auto;
        background: transparent;
        border-top: none;
        padding: 0;
        pointer-events: none;
      }
      .video-controls-bar .v-ctrl-btn,
      .video-top-tag .v-ctrl-btn {
        pointer-events: auto;
        background: rgba(8, 35, 37, 0.84);
        backdrop-filter: blur(4px);
        padding: 3px 8px;
        font-size: 11px;
      }
      .subtitle-drawer {
        bottom: 32px;
        font-size: 12px;
        padding: 5px 8px;
      }
      .stage-card {
        flex: 0 0 auto;
        height: auto;
        max-height: 79%;
        padding: 8px 11px;
        justify-content: flex-start;
        gap: 4px;
      }
      .stage-top {
        margin-bottom: 2px;
      }
      .stage-meta-row {

    function loadClipWithFallback(file) {
      const candidates = [
        MEDIA_ABS + file,
        MEDIA_REL1 + file,
        MEDIA_REL2 + file
      ];
      let idx = 0;
      function tryNext() {
        if (idx >= candidates.length) return;
        videoEl.src = candidates[idx++];
        videoEl.load();
        const p = videoEl.play();
        if (p && typeof p.then === "function") {
          p.then(() => {
            posterEl.classList.add("playing");
          }).catch(() => {});
        }
      }
      videoEl.onerror = () => {
        if (idx < candidates.length) tryNext();
      };
      tryNext();
    }

    function evaluateCauses() {
      const st = window.state;
      let sc = { 1: 1, 2: 1, 3: 1, 4: 1, 5: 1 };
      if (st.answers.q1 === "2-3次" || st.answers.q1 === "4次或以上") sc[1] += 2;
      if (st.answers.q2 === "尿急叫醒") { sc[1] += 2; sc[2] += 1; }
      if (st.answers.q2 === "醒先順便去") sc[5] += 5;

      if (st.answers.q3 === "差唔多或較多" || st.answers.q3 === "大量清尿") sc[1] += 3;
      if (st.answers.q3 === "明顯少好多") sc[2] += 4;

      (st.answers.q4 || []).forEach(x => {
        if (x === "已戒水仍起夜") { sc[1] += 3; sc[3] += 2; }
        if (x === "睇手機難入睡") sc[5] += 2;
      });

      (st.answers.q5 || []).forEach(x => {
        if (x === "傍晚腳腫襪印") sc[1] += 5;
        if (x === "雙腿無力久坐") sc[3] += 5;
        if (x === "尿流細要等" || x === "排唔清或尿急") sc[2] += 4;
        if (x === "口乾多飲胃脹") sc[4] += 5;
        if (x === "打鼻鼾淺眠") sc[5] += 4;
      });

      const meds = st.answers.q7 || [];
      const isWarfarin = meds.includes("薄血藥");
      if (meds.includes("降血壓藥") || meds.includes("去水丸/排糖藥")) sc[1] += 2;
      if (meds.includes("降血糖藥")) sc[4] += 2;
      if (meds.includes("降膽固醇藥")) sc[3] += 2;

      const total = Object.values(sc).reduce((a, b) => a + b, 0) || 1;
      let ratios = {};
      let acc = 0;
      for (let i = 1; i <= 4; i++) {
        ratios[i] = Math.round((sc[i] / total) * 100);
        acc += ratios[i];
      }
      ratios[5] = Math.max(0, 100 - acc);

      // 臨床優先順序 [1, 4, 2, 3, 5] 選出唯一主導成因
      const priority = [1, 4, 2, 3, 5];
      const maxScore = Math.max(...Object.values(sc));
      const winnerId = priority.find(id => sc[id] === maxScore) || 1;

      return {
        winnerId,
        winner: CAUSES[winnerId],
        ratios,
        isWarfarin
      };
    }

    window.toggleMultiOption = function(qid, val, isNone, isDanger) {
      if (window.state.paidLocked) return;
      let cur = [...(window.state.answers[qid] || [])];
      const q = QUESTIONS[qid];
      const noneVals = q.opts.filter(o => o.isNone).map(o => o.val);

      if (isNone) {
        cur = [val];
      } else {
        cur = cur.filter(v => !noneVals.includes(v));
        if (cur.includes(val)) {
          cur = cur.filter(v => v !== val);
        } else {
          cur.push(val);
        }
      }
      window.state.answers[qid] = cur;
      renderStage();
    };

    window.confirmMultiQuestion = function(qid) {
      const arr = window.state.answers[qid] || [];
      if (arr.length === 0) return;
      if (qid === "q6" && (arr.includes("血尿尿痛發燒") || arr.includes("想排但排唔到"))) {
        window.state.step = "safety_stop";
        window.state.showingFeedback = false;
        renderStage();
        return;
      }
      window.state.showingFeedback = true;
      renderStage();
    };

    window.reopenOptions = function() {
      window.state.showingFeedback = false;
      renderStage();
    };

    window.advanceFromQuestion = function(qid) {
      window.state.showingFeedback = false;
      if (window.state.editingFromReview) {
        window.state.editingFromReview = false;
        window.state.step = "review";
        renderStage();
        return;
      }
      const nextMap = {
        q1: "q2", q2: "q3", q3: "q4", q4: "q5", q5: "q6",
        q6: "preview6", q7: "q8", q8: "review"
      };
      window.state.step = nextMap[qid] || "review";
      renderStage();
    };

    window.editFromReview = function(qid) {
      if (window.state.paidLocked) return;
      window.state.editingFromReview = true;
      window.state.showingFeedback = false;
      window.state.step = qid;
      renderStage();
    };

    window.goStep = function(target) {
      window.state.showingFeedback = false;
      window.state.step = target;
      renderStage();
    };

    window.jumpStep = function(target) {
      if (["report1", "report2", "hmcs1", "hmcs2", "products", "group"].includes(target)) {
        window.state.paidLocked = true;
      } else {
        window.state.paidLocked = false;
      }
      window.state.showingFeedback = false;
      window.state.step = target;
      renderStage();
    };

    window.stepBack = function() {
      if (window.state.showingFeedback) {
        window.state.showingFeedback = false;
        renderStage();
        return;
      }
      const prevMap = {
        q1: "welcome", q2: "q1", q3: "q2", q4: "q3", q5: "q4", q6: "q5",
        safety_stop: "q6", preview6: "q6", q7: "preview6", q8: "q7",
        review: "q8", checkout: "review",
        report2: "report1", hmcs1: "report2", hmcs2: "hmcs1",
        products: "hmcs1", group: "products"
      };
      const p = prevMap[window.state.step];
      if (p && !(window.state.paidLocked && ["review", "q8", "checkout"].includes(p))) {
        window.state.step = p;
        renderStage();
      }
    };

    window.processStripeUnlock = function() {
      const btn = document.getElementById("payBtn");
      if (btn) {
        btn.disabled = true;
        btn.textContent = "⏳ Stripe 安全結算中，正在自動返回報告...";
      }
      setTimeout(() => {
        window.state.paidLocked = true;
        window.state.step = "report1";
        renderStage();
      }, 650);
    };

    window.submitHmcsBooking = function() {
      const st = window.state;
      const ev = evaluateCauses();
      alert(
        "✅ 已收到你嘅 HMCS 線下訪談及檢測預約申請！\n\n" +
        "• 預約人：" + st.user.name + " (" + st.user.phone + ")\n" +
        "• 首選門市：" + st.hmcs.loc + " (" + st.hmcs.time + ")\n" +
        "• 優先主因：" + ev.winner.name + "\n\n" +
        "健康管理團隊會透過 WhatsApp 與你落實具體時間（首次見面只做詳細訪談與檢測數據收集，絕不即時成交）。"
      );
    };

    // 初始化渲染
    renderStage();
  </script>
</body>
</html>
