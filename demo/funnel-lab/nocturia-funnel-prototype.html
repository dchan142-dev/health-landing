<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Health Decoder · 夜尿源頭解碼</title>
  <style>
    :root {
      --teal: #0F5C5E;
      --teal-dark: #093F40;
      --teal-light: #E6F4F3;
      --teal-border: #7CC5C2;
      --ink: #111827;
      --ink-sub: #374151;
      --ink-muted: #6B7280;
      --card-bg: rgba(255, 253, 249, 0.96);
      --subtle-bg: #F3F1EC;
      --amber-bg: #FEF3C7;
      --amber-border: #F59E0B;
      --amber-ink: #92400E;
      --danger: #B91C1C;
      --danger-bg: #FEE2E2;
      --border: #D6DCE0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #07191B;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    /* 9:16 全屏舞台容器 (手機滿版，桌面置中 9:16 直向視窗) */
    .stage-916 {
      position: relative;
      width: 100%;
      height: 100dvh;
      max-width: 460px;
      background: #092224;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }
    @media (min-width: 520px) {
      .stage-916 {
        height: min(96dvh, 880px);
        border-radius: 28px;
        border: 2px solid rgba(255, 255, 255, 0.15);
      }
    }

    /* =========================================================================
       Layer 0：底層全屏 9:16 影片層 (正常播放 或 柔焦 Blur 背景)
       ========================================================================= */
    .video-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: radial-gradient(circle at 50% 28%, #175A5D 0%, #071D1F 85%);
      overflow: hidden;
    }
    .video-layer video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
      transition: filter 0.35s ease, transform 0.35s ease;
    }
    /* 當進入無需睇片嘅確定頁／報告／購物／預約頁，底層影片自動靜音並 Blur 作背景 */
    .video-layer.blurred video {
      filter: blur(18px) brightness(0.38);
      transform: scale(1.06);
    }
    .video-layer::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(6,22,24,0.45) 0%, rgba(6,22,24,0.05) 28%, rgba(6,22,24,0.45) 58%, rgba(6,22,24,0.82) 100%);
      pointer-events: none;
    }

    /* 首次未自動播放時嘅輕量點擊提示 (一旦播放即永久隱藏，絕不遮面) */
    .tap-play-pill {
      position: absolute;
      top: 22%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
      background: rgba(15, 92, 94, 0.88);
      color: #FFFFFF;
      border: 2px solid #99F6E4;
      border-radius: 999px;
      padding: 10px 20px;
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      white-space: nowrap;
    }
    .tap-play-pill.hide {
      display: none !important;
    }

    /* =========================================================================
       Layer 1 Top：頂部極簡浮動導航列
       ========================================================================= */
    .hud-top {
      position: relative;
      z-index: 10;
      padding: 10px 12px 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .hud-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .hud-left, .hud-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hud-btn {
      background: rgba(10, 32, 35, 0.78);
      color: #F8FAFC;
      border: 1px solid rgba(255, 255, 255, 0.24);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .hud-btn.on {
      background: #14B8A6;
      color: #042F2E;
      border-color: #99F6E4;
    }
    .hud-select {
      max-width: 118px;
      padding: 4px 8px;
      font-size: 12.5px;
      opacity: 0.85;
    }
    .prog-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      overflow: hidden;
    }
    .prog-fill {
      height: 100%;
      background: #2DD4BF;
      width: 10%;
      transition: width 0.25s ease;
    }

    /* 隱藏式字幕浮層 (預設關閉) */
    .cc-float {
      position: relative;
      z-index: 10;
      margin: 0 12px;
      background: rgba(8, 28, 30, 0.9);
      color: #FEF3C7;
      border: 1px solid rgba(153, 246, 228, 0.4);
      border-radius: 14px;
      padding: 8px 12px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
      display: none;
    }
    .cc-float.show {
      display: block;
    }

    /* =========================================================================
       Layer 1 Bottom：上層互動卡片 (有片時浮於下半屏；Blur 時展開大屏)
       ========================================================================= */
    .overlay-sheet {
      position: relative;
      z-index: 10;
      margin-top: auto;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border-radius: 24px 24px 0 0;
      border-top: 2px solid rgba(255, 255, 255, 0.8);
      padding: 16px 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      max-height: 60%;
      box-shadow: 0 -10px 34px rgba(0, 0, 0, 0.35);
      transition: max-height 0.3s ease;
      overflow: hidden;
    }
    /* 全屏大卡模式 (底層影片 Blur，不預留露臉位，字體與空間最大化) */
    .overlay-sheet.full-sheet {
      max-height: 89%;
      border-radius: 22px 22px 0 0;
      padding: 16px 16px 18px;
    }

    .sheet-step-tag {
      display: inline-flex;
      align-self: flex-start;
      background: var(--teal-light);
      color: var(--teal);
      font-size: 14px;
      font-weight: 800;
      padding: 3px 11px;
      border-radius: 999px;
    }

    .sheet-body {
      display: flex;
      flex-direction: column;
      gap: 9px;
      min-height: 0;
      overflow: hidden;
    }

    /* 長者清晰大字標題與內文 */
    .card-title {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.26;
      color: var(--ink);
      letter-spacing: -0.01em;
    }
    .card-desc {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.42;
      color: var(--ink-sub);
    }

    /* 單選大掣列表 */
    .opt-stack {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .opt-btn {
      width: 100%;
      min-height: 46px;
      background: #FFFFFF;
      color: var(--ink);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 8px 14px;
      font-size: 18.5px;
      font-weight: 800;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .opt-btn.selected {
      background: var(--teal-light);
      border-color: var(--teal);
      color: var(--teal);
    }
    .opt-btn.muted-opt {
      background: var(--subtle-bg);
      color: var(--ink-sub);
      border-style: dashed;
    }

    /* 多選雙欄大字網格 */
    .grid-2col {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 7px;
    }
    .grid-btn {
      min-height: 46px;
      background: #FFFFFF;
      color: var(--ink);
      border: 2px solid var(--border);
      border-radius: 13px;
      padding: 7px 10px;
      font-size: 16.5px;
      font-weight: 800;
      line-height: 1.22;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }
    .grid-btn.selected {
      background: var(--teal-light);
      border-color: var(--teal);
      color: var(--teal);
    }
    .grid-btn.muted-opt {
      background: var(--subtle-bg);
      border-style: dashed;
    }
    .check-dot {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid #9CA3AF;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      color: #FFFFFF;
      flex-shrink: 0;
    }
    .selected .check-dot {
      background: var(--teal);
      border-color: var(--teal);
    }

    /* 揀完選項後「原位收起＋回應」大字框 */
    .chosen-bar {
      background: var(--subtle-bg);
      border: 1.5px solid var(--border);
      border-radius: 13px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 17.5px;
      font-weight: 800;
      color: var(--ink);
    }
    .reselect-pill {
      background: #FFFFFF;
      color: var(--teal);
      border: 1.5px solid var(--teal);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 14.5px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }
    .reply-box {
      background: var(--teal-light);
      border: 2px solid var(--teal-border);
      border-radius: 15px;
      padding: 12px 14px;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.44;
      color: var(--ink);
    }

    /* 答案確定頁 2x4 標籤網格 (嚴格防爆框 minmax(0,1fr)) */
    .confirm-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 7px;
    }
    .confirm-tag {
      background: #FFFFFF;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      text-align: left;
      cursor: pointer;
      min-width: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .confirm-tag-top {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .confirm-tag-top span {
      color: var(--teal);
      font-weight: 800;
    }
    .confirm-tag-val {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 成因比例橫條 (大字清晰) */
    .ratio-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .ratio-row {
      background: #FFFFFF;
      border: 1.5px solid var(--border);
      border-radius: 11px;
      padding: 6px 10px;
    }
    .ratio-row.top-winner {
      background: var(--teal-light);
      border: 2px solid var(--teal);
    }
    .ratio-head {
      display: flex;
      justify-content: space-between;
      font-size: 15.5px;
      font-weight: 800;
      margin-bottom: 3px;
    }
    .ratio-bar-bg {
      height: 7px;
      background: #E5E7EB;
      border-radius: 999px;
      overflow: hidden;
    }
    .ratio-bar-fill {
      height: 100%;
      border-radius: 999px;
    }

    /* 微習慣與產品卡片 */
    .info-card-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .info-card-item {
      background: #FFFFFF;
      border: 1.5px solid var(--border);
      border-radius: 13px;
      padding: 9px 12px;
      font-size: 16.5px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--ink);
    }
    .prod-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #FFFFFF;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 8px 11px;
      text-decoration: none;
      color: var(--ink);
    }
    .prod-card img {
      width: 48px;
      height: 48px;
      border-radius: 9px;
      object-fit: contain;
      background: #F9FAFB;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .prod-buy-badge {
      background: var(--teal-light);
      color: var(--teal);
      border: 1.5px solid var(--teal);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* 預約門市／時段 3 欄對齊網格 */
    .slot-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }
    .slot-pill {
      min-height: 44px;
      background: #FFFFFF;
      color: var(--ink);
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      padding: 6px 4px;
    }
    .slot-pill.active {
      background: var(--teal-light);
      border-color: var(--teal);
      color: var(--teal);
    }

    /* 輸入框 */
    .inp-field {
      width: 100%;
      padding: 11px 13px;
      font-size: 17.5px;
      font-weight: 700;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: #FFFFFF;
      color: var(--ink);
    }

    .warn-strip {
      background: var(--amber-bg);
      border: 1.5px solid var(--amber-border);
      color: var(--amber-ink);
      border-radius: 12px;
      padding: 8px 11px;
      font-size: 14.5px;
      font-weight: 800;
      line-height: 1.35;
    }

    /* 底部大字按鈕區 */
    .sheet-footer {
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex-shrink: 0;
    }
    .btn-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-main {
      width: 100%;
      min-height: 50px;
      background: var(--teal);
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 6px 16px rgba(15, 92, 94, 0.25);
    }
    .btn-main:disabled {
      background: #9CA3AF;
      box-shadow: none;
    }
    .btn-outline {
      width: 100%;
      min-height: 46px;
      background: #FFFFFF;
      color: var(--teal);
      border: 2px solid var(--teal);
      border-radius: 13px;
      padding: 8px 12px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-sub {
      width: 100%;
      min-height: 40px;
      background: var(--subtle-bg);
      color: var(--ink-sub);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 6px 10px;
      font-size: 15.5px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
    }

    /* 小屏手機微調確保 100% 零捲動同時維持大字 */
    @media (max-height: 730px) {
      .overlay-sheet {
        padding: 12px 14px 14px;
        gap: 7px;
        max-height: 64%;
      }
      .overlay-sheet.full-sheet {
        max-height: 90%;
      }
      .card-title {
        font-size: 20px;
      }
      .card-desc, .reply-box {
        font-size: 16.5px;
      }
      .opt-btn {
        min-height: 42px;
        font-size: 17px;
        padding: 6px 12px;
      }
      .grid-btn {
        min-height: 41px;
        font-size: 15.5px;
        padding: 5px 8px;
      }
      .btn-main {
        min-height: 46px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <main class="stage-916">

    <!-- Layer 0：底層 9:16 全屏影片 -->
    <div class="video-layer" id="videoLayer">
      <video id="duncanVideo" playsinline webkit-playsinline preload="auto"></video>
      <button type="button" class="tap-play-pill" id="tapPlayBtn" onclick="replayVideo()">▶ 點擊播放影片</button>
    </div>

    <!-- Layer 1 Top：極簡頂部控制列 -->
    <header class="hud-top">
      <div class="hud-row">
        <div class="hud-left">
          <button type="button" class="hud-btn" id="backBtn" onclick="stepBack()">← 返回</button>
          <button type="button" class="hud-btn" id="replayHudBtn" onclick="replayVideo()">▶ 重播</button>
        </div>
        <div class="hud-right">
          <button type="button" class="hud-btn" id="ccBtn" onclick="toggleSubtitle()">字幕</button>
          <select class="hud-btn hud-select" id="quickJumpSel" onchange="jumpStep(this.value)" title="跳頁預覽">
            <option value="welcome">入口頁</option>
            <option value="q1">Q1 起夜次數</option>
            <option value="q2">Q2 醒來先後</option>
            <option value="q3">Q3 每次尿量</option>
            <option value="q4">Q4 睡前習慣</option>
            <option value="q5">Q5 身體訊號</option>
            <option value="q6">Q6 安全確認</option>
            <option value="preview6">6題預覽</option>
            <option value="q7">Q7 長期西藥</option>
            <option value="q8">Q8 改善目標</option>
            <option value="review">答案確定頁</option>
            <option value="checkout">解鎖報告</option>
            <option value="report1">報告1：成因比例</option>
            <option value="report2">報告2：日常建議</option>
            <option value="hmcs_intro">HMCS 簡介</option>
            <option value="hmcs_s1">HMCS 步驟1</option>
            <option value="hmcs_s2">HMCS 步驟2</option>
            <option value="hmcs_s3">HMCS 步驟3</option>
            <option value="hmcs_s4">HMCS 步驟4</option>
            <option value="hmcs_s5">HMCS 步驟5</option>
            <option value="booking">預約門市</option>
            <option value="products">產品購物頁</option>
            <option value="group">健康群組頁</option>
          </select>
        </div>
      </div>
      <div class="prog-track">
        <div class="prog-fill" id="progFill"></div>
      </div>
    </header>

    <!-- 隱藏式字幕框 -->
    <div class="cc-float" id="ccBox"></div>

    <!-- Layer 1 Bottom：上層問題與按鈕浮動大字卡 -->
    <section class="overlay-sheet" id="overlaySheet">
      <span class="sheet-step-tag" id="stepTag">夜尿源頭檢測</span>
      <div class="sheet-body" id="sheetBody"></div>
      <div class="sheet-footer" id="sheetFooter"></div>
    </section>

  </main>

  <script>
    const MEDIA_ABS  = "https://health-decoder.com/demo/nocturia-video/media/";
    const MEDIA_REL1 = "./media/";
    const MEDIA_REL2 = "../nocturia-video/media/";

    const CLIPS = {
      "01-welcome":      { file: "01-welcome.mp4",      script: "你好，我係 Duncan。夜晚成日起身去廁所，最緊要搵出搞亂睡眠嘅真正源頭。" },
      "02-frequency":    { file: "02-frequency.mp4",    script: "平時一晚，你大概起身去幾多次廁所？" },
      "03-waking":       { file: "03-waking.mp4",       script: "你通常係尿急憋醒先去廁所，定係人醒咗先順便去？" },
      "04-volume":       { file: "04-volume.mp4",       script: "夜晚每次去廁所，同日頭平時一次比較大概幾多？" },
      "05-drinks":       { file: "05-drinks.mp4",       script: "瞓前兩三個鐘，你有冇以下習慣？可以多選。" },
      "06-other":        { file: "06-other.mp4",        script: "平時日頭或去廁所時，有冇以下身體訊號？可以多選。" },
      "07-safety":       { file: "07-safety.mp4",       script: "近期有冇血尿、排尿痛、發燒或者排唔出尿？" },

    videoEl.addEventListener("loadeddata", () => {
      if (window.state.hasPlayedOnce) tapPlayBtn.classList.add("hide");
    });

    function loadClipWithFallback(file, shouldPlay) {
      const candidates = [MEDIA_ABS + file, MEDIA_REL1 + file, MEDIA_REL2 + file];
      let idx = 0;
      function tryNext() {
        if (idx >= candidates.length) return;
        videoEl.src = candidates[idx++];
        videoEl.load();
        if (shouldPlay) {
          videoEl.muted = false;
          const p = videoEl.play();
          if (p && typeof p.then === "function") {
            p.then(() => {
              window.state.hasPlayedOnce = true;
              tapPlayBtn.classList.add("hide");
            }).catch(() => {
              if (!window.state.hasPlayedOnce) tapPlayBtn.classList.remove("hide");
            });
          }
        } else {
          videoEl.pause();
          tapPlayBtn.classList.add("hide");
        }
      }
      videoEl.onerror = () => {
        if (idx < candidates.length) tryNext();
      };
      tryNext();
    }

    function syncVideo(clipKey, customScript, isBlurredMode) {
      const clip = CLIPS[clipKey] || CLIPS["01-welcome"];
      document.getElementById("ccBox").textContent = customScript || clip.script;
      videoLayerEl.classList.toggle("blurred", !!isBlurredMode);
      document.getElementById("replayHudBtn").style.display = isBlurredMode ? "none" : "inline-flex";

      if (isBlurredMode) {
        videoEl.pause();
        tapPlayBtn.classList.add("hide");
        if (!videoEl.src) loadClipWithFallback(clip.file, false);
        return;
      }

      if (window.state.currentClipKey !== clipKey) {
        window.state.currentClipKey = clipKey;
        loadClipWithFallback(clip.file, true);
      } else {
        const p = videoEl.play();
        if (p && typeof p.then === "function") p.catch(() => {});
      }
    }

    window.replayVideo = function() {
      const clip = CLIPS[window.state.currentClipKey] || CLIPS["01-welcome"];
      videoLayerEl.classList.remove("blurred");
      if (!videoEl.src) {
        loadClipWithFallback(clip.file, true);
        return;
      }
      if (videoEl.readyState >= 1) {
        try { videoEl.currentTime = 0; } catch (e) {}
      }
      const p = videoEl.play();
      if (p && typeof p.then === "function") {
        p.then(() => {
          window.state.hasPlayedOnce = true;
          tapPlayBtn.classList.add("hide");
        }).catch(() => {});
      }
    };

    function evaluateCauses() {
      const st = window.state;
      let sc = { 1: 1, 2: 1, 3: 1, 4: 1, 5: 1 };
      if (st.answers.q1 === "2-3次" || st.answers.q1 === "4次或以上") sc[1] += 2;
      if (st.answers.q2 === "尿急憋醒") { sc[1] += 2; sc[2] += 1; }
      if (st.answers.q2 === "醒先順便去") sc[5] += 5;

      if (st.answers.q3 === "差唔多或較多" || st.answers.q3 === "大量清尿") sc[1] += 3;
      if (st.answers.q3 === "量少但好急") sc[2] += 4;

      (st.answers.q4 || []).forEach(x => {
        if (x === "已戒水仍起夜") { sc[1] += 3; sc[3] += 2; }
        if (x === "睇手機難入睡") sc[5] += 2;
      });

      (st.answers.q5 || []).forEach(x => {
        if (x === "傍晚腳腫襪印") sc[1] += 5;
        if (x === "雙腿無力久坐") sc[3] += 5;
        if (x === "尿流細要等" || x === "排唔清或尿急") sc[2] += 4;
        if (x === "口乾多飲胃脹") sc[4] += 5;
        if (x === "打鼻鼾淺眠") sc[5] += 4;
      });

      const meds = st.answers.q7 || [];
      const isWarfarin = meds.includes("薄血藥");
      if (meds.includes("降血壓藥") || meds.includes("去水丸/排糖藥")) sc[1] += 2;
      if (meds.includes("降血糖藥")) sc[4] += 2;
      if (meds.includes("降膽固醇藥")) sc[3] += 2;

      const total = Object.values(sc).reduce((a, b) => a + b, 0) || 1;
      let ratios = {};
      let acc = 0;
      for (let i = 1; i <= 4; i++) {
        ratios[i] = Math.round((sc[i] / total) * 100);
        acc += ratios[i];
      }
      ratios[5] = Math.max(0, 100 - acc);

      const priority = [1, 4, 2, 3, 5];
      const maxScore = Math.max(...Object.values(sc));
      const winnerId = priority.find(id => sc[id] === maxScore) || 1;

      // 嚴格按百分比由高至低排序 (主導成因置頂，其餘按比例高至低排)
      const sortedIds = [winnerId, ...[1,2,3,4,5].filter(x => x !== winnerId).sort((a, b) => ratios[b] - ratios[a])];

      return { winnerId, winner: CAUSES[winnerId], ratios, sortedIds, isWarfarin };
    }

        `;
        footer.innerHTML = `
          <a href="https://wa.me/85291234567?text=${waText}" target="_blank" rel="noopener" class="btn-main" style="text-decoration:none;">💬 打開 WhatsApp 即時確認 →</a>
          <button type="button" class="btn-sub" onclick="goStep('group')">順便加入免費健康群組 →</button>
        `;
        return;
      }

      // 12. 產品購物頁 (可點擊選購，絕無內部字眼)
      if (s === "products") {
        syncVideo("12-routes", null, true);
        tag.textContent = "居家調理購物頁";
        const safeSkus = win.skus.filter(k => !ev.isWarfarin || k.warfarinSafe).slice(0, 3);
        body.innerHTML = `
          <h2 class="card-title">【${win.name}】調理單品</h2>
          <div class="info-card-list">
            ${safeSkus.map(k => `
              <a href="${k.url}" target="_blank" rel="noopener" class="prod-card">
                <img src="${k.img}" alt="${k.name}" onerror="this.style.display='none'" />

        `;
        footer.innerHTML = `
          <button type="button" class="btn-main" onclick="goStep('hmcs_intro')">預約門市服務（享組合優惠）→</button>
          <button type="button" class="btn-sub" onclick="goStep('group')">想知最新健康資訊？去免費群組 →</button>
        `;
        return;
      }

      // 13. 最後一頁：健康交流群組頁
      if (s === "group") {
        syncVideo("01-welcome", null, true);
        tag.textContent = "免費健康社群";
        body.innerHTML = `
          <h2 class="card-title">加入群組接收最新健康資訊</h2>
          <p class="card-desc">歡迎免費加入 Duncan 養生交流群組，隨時接收最新健康解碼資訊：</p>
          <div class="opt-stack">
            <a href="https://chat.whatsapp.com/LPHAndy6hjH8gRLVzZacrw" target="_blank" rel="noopener" class="opt-btn" style="text-decoration:none; border-color:#10B981; background:#ECFDF5;">
              <span>💬 WhatsApp 養生專區</span>
              <span style="color:#047857; font-size:16px;">加入 →</span>
            </a>
            <a href="https://www.facebook.com/groups/duncanhealthylife" target="_blank" rel="noopener" class="opt-btn" style="text-decoration:none; border-color:#3B82F6; background:#EFF6FF;">
              <span>📘 Facebook 健康生活群組</span>
              <span style="color:#1D4ED8; font-size:16px;">加入 →</span>
            </a>
          </div>
        `;
        footer.innerHTML = `
          <button type="button" class="btn-sub" onclick="goStep('products')">← 返回產品頁</button>

    window.selectSingleOption = function(qid, val) {
      if (window.state.paidLocked) return;
      window.state.answers[qid] = val;
      window.state.showingFeedback = true;
      renderStage();
    };

    window.toggleMultiOption = function(qid, val, isNone) {
      if (window.state.paidLocked) return;
      let cur = [...(window.state.answers[qid] || [])];
      const q = QUESTIONS[qid];
      const noneVals = q.opts.filter(o => o.isNone).map(o => o.val);

      if (isNone) {
        cur = [val];
      } else {
        cur = cur.filter(v => !noneVals.includes(v));
        if (cur.includes(val)) {
          cur = cur.filter(v => v !== val);
        } else {
          cur.push(val);
        }
      }
      window.state.answers[qid] = cur;
      renderStage();
    };

    window.confirmMultiQuestion = function(qid) {
      const arr = window.state.answers[qid] || [];
      if (arr.length === 0) return;
      if (qid === "q6" && (arr.includes("血尿尿痛發燒") || arr.includes("想排但排唔到"))) {
        window.state.step = "safety_stop";
        window.state.showingFeedback = false;
        renderStage();
        return;
      }
      window.state.showingFeedback = true;
      renderStage();
    };

    window.reopenOptions = function() {
      window.state.showingFeedback = false;
      renderStage();
    };

    window.advanceFromQuestion = function(qid) {
      window.state.showingFeedback = false;
      if (window.state.editingFromReview) {
        window.state.editingFromReview = false;
        window.state.step = "review";
        renderStage();
        return;
      }
      const nextMap = {
        q1: "q2", q2: "q3", q3: "q4", q4: "q5", q5: "q6",
        q6: "preview6", q7: "q8", q8: "review"
      };
      window.state.step = nextMap[qid] || "review";
      renderStage();
    };

    window.editFromReview = function(qid) {
      if (window.state.paidLocked) return;
      window.state.editingFromReview = true;
      window.state.showingFeedback = false;
      window.state.step = qid;
      renderStage();
    };

    window.goStep = function(target) {
      window.state.showingFeedback = false;
      window.state.step = target;
      renderStage();
    };

    window.jumpStep = function(target) {
      const postPay = ["report1", "report2", "hmcs_intro", "hmcs_s1", "hmcs_s2", "hmcs_s3", "hmcs_s4", "hmcs_s5", "booking", "booking_done", "products", "group"];
      window.state.paidLocked = postPay.includes(target);
      window.state.showingFeedback = false;
      window.state.step = target;
      renderStage();
    };

    window.stepBack = function() {
      if (window.state.showingFeedback) {
        window.state.showingFeedback = false;
        renderStage();
        return;
      }
      const prevMap = {
        q1: "welcome", q2: "q1", q3: "q2", q4: "q3", q5: "q4", q6: "q5",
        safety_stop: "q6", preview6: "q6", q7: "preview6", q8: "q7",
        review: "q8", checkout: "review",
        report2: "report1", hmcs_intro: "report2",
        hmcs_s1: "hmcs_intro", hmcs_s2: "hmcs_s1", hmcs_s3: "hmcs_s2",
        hmcs_s4: "hmcs_s3", hmcs_s5: "hmcs_s4",
        booking: "hmcs_intro", booking_done: "booking",
        products: "hmcs_intro", group: "products"
      };
      const p = prevMap[window.state.step];
      if (p && !(window.state.paidLocked && ["review", "q8", "checkout"].includes(p))) {
        window.state.step = p;
        renderStage();
      }
    };

    window.processStripeUnlock = function() {
      const btn = document.getElementById("payBtn");
      if (btn) {
        btn.disabled = true;
        btn.textContent = "⏳ 結算中，正在開啟報告...";
      }
      setTimeout(() => {
        window.state.paidLocked = true;
        window.state.step = "report1";
        renderStage();
      }, 500);
    };

    renderStage();
  </script>
</body>
