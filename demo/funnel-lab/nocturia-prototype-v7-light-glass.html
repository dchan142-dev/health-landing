<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Health Decoder · 夜尿源頭解碼 (版本A：淺色半透明毛玻璃)</title>
  <style>
    /* =========================================================================
       雙主題變數：
       - theme-light：暖白半透明毛玻璃 (淺底深字，通透柔和)
       - theme-dark ：深海青黑半透明毛玻璃 (深底白字，與底層影片無縫融合)
       ========================================================================= */
    :root, body.theme-light {
      --panel-bg: rgba(255, 253, 249, 0.78);
      --panel-border: rgba(255, 255, 255, 0.85);
      --item-bg: rgba(255, 255, 255, 0.76);
      --item-hover: rgba(255, 255, 255, 0.92);
      --item-border: rgba(15, 92, 94, 0.24);
      --item-sel-bg: rgba(15, 92, 94, 0.16);
      --item-sel-border: #0F5C5E;
      --item-sel-text: #093F40;
      --muted-bg: rgba(241, 239, 234, 0.65);
      --ink-main: #0F172A;
      --ink-sub: #334155;
      --ink-muted: #64748B;
      --accent: #0F5C5E;
      --accent-bright: #0D9488;
      --cta-bg: #0F5C5E;
      --cta-text: #FFFFFF;
      --tag-bg: rgba(15, 92, 94, 0.14);
      --tag-text: #0F5C5E;
      --check-bg: rgba(255, 255, 255, 0.9);
      --check-border: #64748B;
      --check-sel-bg: #0F5C5E;
      --check-sel-tick: #FFFFFF;
      --warn-bg: rgba(254, 243, 199, 0.85);
      --warn-border: #F59E0B;
      --warn-text: #92400E;
      --video-blur-Filter: blur(22px) brightness(0.58);
    }

    body.theme-dark {
      --panel-bg: rgba(8, 28, 31, 0.68);
      --panel-border: rgba(153, 246, 228, 0.28);
      --item-bg: rgba(15, 48, 52, 0.64);
      --item-hover: rgba(20, 68, 73, 0.78);
      --item-border: rgba(255, 255, 255, 0.22);
      --item-sel-bg: rgba(20, 184, 166, 0.28);
      --item-sel-border: #2DD4BF;
      --item-sel-text: #CCFBF1;
      --muted-bg: rgba(15, 35, 38, 0.52);
      --ink-main: #F8FAFC;
      --ink-sub: #E2E8F0;
      --ink-muted: #94A3B8;
      --accent: #2DD4BF;
      --accent-bright: #5EEAD4;
      --cta-bg: #14B8A6;
      --cta-text: #042F2E;
      --tag-bg: rgba(45, 212, 191, 0.2);
      --tag-text: #5EEAD4;
      --check-bg: rgba(15, 35, 38, 0.8);
      --check-border: #94A3B8;
      --check-sel-bg: #2DD4BF;
      --check-sel-tick: #042F2E;
      --warn-bg: rgba(120, 53, 15, 0.65);
      --warn-border: #F59E0B;
      --warn-text: #FDE68A;
      --video-blur-Filter: blur(22px) brightness(0.42);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #051315;
      color: var(--ink-main);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    /* 固定 9:16 全屏舞台規格 */
    .stage-916 {
      position: relative;
      width: 100%;
      height: 100dvh;
      max-width: 460px;
      background: #081F22;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
    }
    @media (min-width: 520px) {
      .stage-916 {
        height: min(96dvh, 880px);
        border-radius: 28px;
        border: 2px solid rgba(255, 255, 255, 0.16);
      }
    }

    /* =========================================================================
       Layer 0：底層 9:16 全幅影片層 (播片時清晰全屏，作答時平滑漸變 Blur)
       ========================================================================= */
    .video-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: radial-gradient(circle at 50% 30%, #155255 0%, #06181A 85%);
      overflow: hidden;
    }
    .video-layer video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      filter: blur(0px) brightness(1);
      transform: scale(1);
      transition: filter 0.45s cubic-bezier(0.22, 1, 0.36, 1), transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .video-layer.blurred video {
      filter: var(--video-blur-Filter);
      transform: scale(1.06);
    }

    /* 頂部常駐極簡導航列 */
    .hud-top {
      position: relative;
      z-index: 20;
      padding: 10px 12px 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .hud-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .hud-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .hud-pill {
      background: rgba(8, 28, 31, 0.72);
      color: #F8FAFC;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .hud-pill.active {
      background: #14B8A6;
      color: #042F2E;
      border-color: #99F6E4;
    }
    .hud-select {
      max-width: 112px;
      padding: 4px 7px;
      font-size: 12px;
    }
    .prog-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      overflow: hidden;
    }
    .prog-fill {
      height: 100%;
      background: #2DD4BF;
      width: 8%;
      transition: width 0.35s ease;
    }

    /* 隱藏字幕框 (只喺開啟字幕且播片時顯示喺上方) */
    .cc-banner {
      position: relative;
      z-index: 20;
      margin: 2px 12px 0;
      background: rgba(6, 22, 24, 0.86);
      color: #FEF3C7;
      border: 1px solid rgba(153, 246, 228, 0.38);
      backdrop-filter: blur(8px);
      border-radius: 13px;
      padding: 8px 12px;
      font-size: 16.5px;
      font-weight: 700;
      line-height: 1.4;
      display: none;
    }
    .cc-banner.show {
      display: block;
    }

    /* =========================================================================
       階段 1（播片態）：全幅影片無遮擋，只喺底部放輕量「跳過影片 →」掣
       ========================================================================= */
    .video-only-controls {
      position: absolute;
      inset: 52px 0 0 0;
      z-index: 12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 18px 26px;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.35s ease;
    }
    .video-only-controls.hidden-phase {
      opacity: 0;
      pointer-events: none !important;
    }
    .tap-start-btn {
      margin-top: auto;
      margin-bottom: auto;
      pointer-events: auto;
      background: rgba(15, 92, 94, 0.88);
      color: #FFFFFF;
      border: 2px solid #99F6E4;
      border-radius: 999px;
      padding: 13px 24px;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
    }
    .tap-start-btn.hide {
      display: none !important;
    }
    .skip-video-bar {
      margin-top: auto;
      width: 100%;
      display: flex;
      justify-content: center;
      pointer-events: auto;
    }
    .skip-video-btn {
      width: 100%;
      max-width: 360px;
      min-height: 52px;
      background: rgba(8, 28, 31, 0.74);
      color: #FFFFFF;
      border: 1.5px solid rgba(153, 246, 228, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 999px;
      padding: 11px 22px;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* =========================================================================
       階段 2（作答／內容態）：固定全畫面構圖半透明面板 (統一尺寸，平滑漸變淡入)
       ========================================================================= */
    .glass-panel {
      position: absolute;
      top: 52px;
      bottom: 12px;
      left: 12px;
      right: 12px;
      z-index: 15;
      background: var(--panel-bg);
      border: 1.5px solid var(--panel-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 18px 16px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      opacity: 1;
      transform: translateY(0) scale(1);
      transition: opacity 0.42s cubic-bezier(0.22, 1, 0.36, 1), transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
    }
    .glass-panel.hidden-phase {
      opacity: 0;
      transform: translateY(14px) scale(0.985);
      pointer-events: none !important;
    }

    .panel-header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .step-badge {
      display: inline-flex;
      align-self: flex-start;
      background: var(--tag-bg);
      color: var(--tag-text);
      font-size: 14.5px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
    }
    .panel-title {
      font-size: 23px;
      font-weight: 800;
      line-height: 1.28;
      color: var(--ink-main);
      letter-spacing: -0.01em;
    }

    /* 面板中央內容區 (自適應垂直置中或展開，零溢出) */
    .panel-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 9px;
      overflow: hidden;
    }
    .panel-desc {
      font-size: 19.5px;
      font-weight: 700;
      line-height: 1.48;
      color: var(--ink-sub);
    }

    /* 單選大字按鈕列表 */
    .opt-stack {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .opt-btn {
      width: 100%;
      min-height: 52px;
      background: var(--item-bg);
      color: var(--ink-main);
      border: 2px solid var(--item-border);
      border-radius: 15px;
      padding: 10px 15px;
      font-size: 19.5px;
      font-weight: 800;
      line-height: 1.25;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: all 0.18s ease;
    }
    .opt-btn.selected {
      background: var(--item-sel-bg);
      border-color: var(--item-sel-border);
      color: var(--item-sel-text);
    }
    .opt-btn.muted-opt {
      background: var(--muted-bg);
      border-style: dashed;
    }

    /* 多選雙欄大字網格 */
    .grid-2col {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 9px;
    }
    .grid-btn {
      min-height: 52px;
      background: var(--item-bg);
      color: var(--ink-main);
      border: 2px solid var(--item-border);
      border-radius: 14px;
      padding: 9px 11px;
      font-size: 17.5px;
      font-weight: 800;
      line-height: 1.24;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      transition: all 0.18s ease;
    }
    .grid-btn.selected {
      background: var(--item-sel-bg);
      border-color: var(--item-sel-border);
      color: var(--item-sel-text);
    }
    .grid-btn.muted-opt {
      background: var(--muted-bg);
      border-style: dashed;
    }

    .check-box {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      border: 2px solid var(--check-border);
      background: var(--check-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 900;
      color: transparent;
      flex-shrink: 0;
    }
    .selected .check-box {
      background: var(--check-sel-bg);
      border-color: var(--check-sel-bg);
      color: var(--check-sel-tick);
    }

    /* 全屏答案覆核頁 2欄網格 (用盡全屏高度，大字清晰) */
    .review-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
    }
    .review-cell {
      background: var(--item-bg);
      border: 2px solid var(--item-border);
      border-radius: 13px;
      padding: 9px 11px;
      text-align: left;
      cursor: pointer;
      min-width: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .review-cell-top {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .review-cell-top span {
      color: var(--accent);
      font-weight: 800;
    }
    .review-cell-val {
      font-size: 16.5px;
      font-weight: 800;
      color: var(--ink-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 成因比例橫條 */
    .ratio-stack {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .ratio-card {
      background: var(--item-bg);
      border: 1.5px solid var(--item-border);
      border-radius: 13px;
      padding: 8px 12px;
    }
    .ratio-card.top-winner {
      background: var(--item-sel-bg);
      border: 2px solid var(--item-sel-border);
    }
    .ratio-head {
      display: flex;
      justify-content: space-between;
      font-size: 16.5px;
      font-weight: 800;
      color: var(--ink-main);
      margin-bottom: 4px;
    }
    .ratio-track {
      height: 8px;
      background: rgba(148, 163, 184, 0.3);
      border-radius: 999px;
      overflow: hidden;
    }
    .ratio-fill {
      height: 100%;
      border-radius: 999px;
    }

    /* 3 欄按鈕網格 (年齡／門市／時段) */
    .grid-3col {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .slot-btn {
      min-height: 48px;
      background: var(--item-bg);
      color: var(--ink-main);
      border: 2px solid var(--item-border);
      border-radius: 13px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      padding: 8px 6px;
    }
    .slot-btn.selected {
      background: var(--item-sel-bg);
      border-color: var(--item-sel-border);
      color: var(--item-sel-text);
    }

    .info-box {
      background: var(--item-bg);
      border: 2px solid var(--item-border);
      border-radius: 15px;
      padding: 12px 14px;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.44;
      color: var(--ink-main);
    }

    .warn-box {
      background: var(--warn-bg);
      border: 1.5px solid var(--warn-border);
      color: var(--warn-text);
      border-radius: 13px;
      padding: 9px 12px;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.36;
    }

    .inp-field {
      width: 100%;
      padding: 12px 14px;
      font-size: 18.5px;
      font-weight: 700;
      border: 2px solid var(--item-border);
      border-radius: 13px;
      background: var(--item-bg);
      color: var(--ink-main);
    }

    /* 面板底部固定按鈕區 (送出鍵 ＋ 重溫影片鍵) */
    .panel-footer {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn-primary {
      width: 100%;
      min-height: 54px;
      background: var(--cta-bg);
      color: var(--cta-text);
      border: none;
      border-radius: 15px;
      padding: 11px 16px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      text-decoration: none;
    }
    .btn-primary:disabled {
      background: rgba(148, 163, 184, 0.45);
      color: rgba(255, 255, 255, 0.65);
      box-shadow: none;
      cursor: not-allowed;
    }
    .btn-secondary {
      width: 100%;
      min-height: 44px;
      background: var(--muted-bg);
      color: var(--ink-sub);
      border: 1.5px solid var(--item-border);
      border-radius: 13px;
      padding: 8px 12px;
      font-size: 16.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }
    .footer-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    @media (max-height: 720px) {
      .glass-panel {
        padding: 14px 14px 12px;
        gap: 7px;
      }
      .panel-title {
        font-size: 20.5px;
      }
      .opt-btn {
        min-height: 45px;
        font-size: 18px;
        padding: 7px 13px;
      }
      .grid-btn {
        min-height: 45px;
        font-size: 16px;
        padding: 7px 9px;
      }
      .review-cell {
        padding: 6px 9px;
      }
      .review-cell-val {
        font-size: 15px;
      }
      .btn-primary {
        min-height: 48px;
        font-size: 18.5px;
      }
      .btn-secondary {
        min-height: 40px;
        font-size: 15.5px;
      }
    }
  </style>
</head>
<body class="theme-light">

  <main class="stage-916">

    <!-- Layer 0：底層全幅 9:16 影片層 -->
    <div class="video-layer" id="videoLayer">
      <video id="duncanVideo" playsinline webkit-playsinline preload="auto"></video>
    </div>

    <!-- 頂部導航列 -->
    <header class="hud-top">
      <div class="hud-row">
        <div class="hud-group">
          <button type="button" class="hud-pill" id="backBtn" onclick="stepBack()">← 返回</button>
          <button type="button" class="hud-pill" id="themeBtn" onclick="toggleTheme()">切換：深色半透明</button>
        </div>
        <div class="hud-group">
          <button type="button" class="hud-pill" id="ccBtn" onclick="toggleSubtitle()">字幕</button>
          <select class="hud-pill hud-select" id="quickJumpSel" onchange="jumpStep(this.value)" title="跳頁預覽">
            <option value="welcome">入口頁</option>
            <option value="q1">Q1 起夜次數</option>
            <option value="q2">Q2 醒來先後</option>
            <option value="q3">Q3 每次尿量</option>
            <option value="q4">Q4 睡前習慣</option>
            <option value="q5">Q5 身體訊號</option>
            <option value="q6">Q6 安全確認</option>
            <option value="q7">Q7 長期西藥</option>
            <option value="q8">Q8 改善目標</option>
            <option value="q9">Q9 性別年齡</option>
            <option value="review">答案覆核頁</option>
            <option value="checkout">解鎖報告</option>
            <option value="report1">報告1：成因比例</option>
            <option value="report2">報告2：日常建議</option>
            <option value="hmcs_intro">HMCS 簡介</option>
            <option value="hmcs_s1">HMCS 步驟1</option>
            <option value="hmcs_s2">HMCS 步驟2</option>
            <option value="hmcs_s3">HMCS 步驟3</option>
            <option value="hmcs_s4">HMCS 步驟4</option>
            <option value="hmcs_s5">HMCS 步驟5</option>
            <option value="booking">預約門市</option>
            <option value="eshop">Eshop 專頁</option>
            <option value="group">健康群組頁</option>
          </select>
        </div>
      </div>
      <div class="prog-track">
        <div class="prog-fill" id="progFill"></div>
      </div>
    </header>

    <!-- 隱藏式字幕浮層 -->
    <div class="cc-banner" id="ccBox"></div>

    <!-- 階段 1：全幅影片播放層控制 (播片時完全唔顯示問題同選項，只設跳過鍵) -->
    <section class="video-only-controls" id="videoControls">
      <button type="button" class="tap-start-btn hide" id="tapPlayBtn" onclick="manualPlayVideo()">▶ 點擊播放影片</button>
      <div class="skip-video-bar">

    function loadClipFile(clipKey, autoPlay) {
      const clip = CLIPS[clipKey] || CLIPS["01-welcome"];
      document.getElementById("ccBox").textContent = clip.script;

      const candidates = [MEDIA_ABS + clip.file, MEDIA_REL1 + clip.file, MEDIA_REL2 + clip.file];
      let idx = 0;

      function tryNext() {
        if (idx >= candidates.length) return;
        videoEl.src = candidates[idx++];
        videoEl.load();
        if (autoPlay) {
          videoEl.muted = false;
          const p = videoEl.play();
          if (p && typeof p.then === "function") {
            p.then(() => {
              tapPlayBtn.classList.add("hide");
            }).catch(() => {
              tapPlayBtn.classList.remove("hide");
            });
          }
        } else {
          videoEl.pause();
          tapPlayBtn.classList.add("hide");
        }
      }

      videoEl.onerror = () => {
        if (idx < candidates.length) tryNext();
      };

      if (window.state.currentClipKey !== clipKey) {
        window.state.currentClipKey = clipKey;
        tryNext();
      } else {
        if (autoPlay) {
          if (videoEl.readyState >= 1) {
            try { videoEl.currentTime = 0; } catch (e) {}
          }
          const p = videoEl.play();
          if (p && typeof p.then === "function") {
            p.then(() => tapPlayBtn.classList.add("hide")).catch(() => tapPlayBtn.classList.remove("hide"));
          }
        } else {
          videoEl.pause();
          tapPlayBtn.classList.add("hide");
        }
      }
    }

      let sc = { 1: 2, 2: 1, 3: 1, 4: 1, 5: 1 };
      if (st.answers.q1 === "2 至 3 次" || st.answers.q1 === "4 次或以上") sc[1] += 2;
      if (st.answers.q2 === "尿急憋醒先去") { sc[1] += 2; sc[2] += 1; }
      if (st.answers.q2 === "醒咗先順便去") sc[5] += 5;

      if (st.answers.q3 === "同日頭差唔多／較多" || st.answers.q3 === "單次極多，清澈如水") sc[1] += 3;
      if (st.answers.q3 === "明顯少好多（量少但急）") sc[2] += 4;

      (st.answers.q4 || []).forEach(x => {
        if (x === "已戒水仍起夜") { sc[1] += 3; sc[3] += 2; }
        if (x === "睇手機難入睡") sc[5] += 2;
      });

      (st.answers.q5 || []).forEach(x => {
        if (x === "傍晚鞋緊／襪印") sc[1] += 5;
        if (x === "雙腿無力／久坐") sc[3] += 5;
        if (x === "排尿要等／尿流細" || x === "排唔清／日頭尿急") sc[2] += 4;
        if (x === "口乾多飲／易胃脹") sc[4] += 5;
        if (x === "打鼻鼾／淺眠易醒") sc[5] += 4;
      });

      const meds = st.answers.q7 || [];
      if (meds.includes("降血壓藥") || meds.includes("去水丸／排糖藥")) sc[1] += 2;
      if (meds.includes("降血糖藥")) sc[4] += 2;
      if (meds.includes("降膽固醇藥")) sc[3] += 2;

      const total = Object.values(sc).reduce((a, b) => a + b, 0) || 1;
      let ratios = {};
      let acc = 0;
      for (let i = 1; i <= 4; i++) {
        ratios[i] = Math.round((sc[i] / total) * 100);
        acc += ratios[i];
      }
      ratios[5] = Math.max(0, 100 - acc);

      const priority = [1, 4, 2, 3, 5];
      const maxScore = Math.max(...Object.values(sc));
      const winnerId = priority.find(id => sc[id] === maxScore) || 1;
      const sortedIds = [winnerId, ...[1,2,3,4,5].filter(x => x !== winnerId).sort((a, b) => ratios[b] - ratios[a])];

      return { winnerId, winner: CAUSES[winnerId], ratios, sortedIds };
    }

            </a>
          </div>
        `;
        footer.innerHTML = `
          <div class="footer-row-2">
            <button type="button" class="btn-secondary" onclick="goStep('booking', 'panel')">← 回 HMCS 預約頁</button>
            <button type="button" class="btn-secondary" onclick="goStep('eshop', 'panel')">← 回 Eshop 頁</button>
          </div>
        `;
        return;
      }
    };

    // 揀單選答案：只打勾，絕不跳頁
    window.pickSingle = function(qid, val) {
      if (window.state.paidLocked) return;
      window.state.answers[qid] = val;
      renderStage();
    };

    // 揀多選答案：支援互斥，只打勾，絕不跳頁
    window.pickMulti = function(qid, val, isNone) {
      if (window.state.paidLocked) return;
      let cur = [...(window.state.answers[qid] || [])];
      const q = QUESTIONS[qid];
      const noneVals = q.opts.filter(o => o.isNone).map(o => o.val);

      if (isNone) {
        cur = [val];
      } else {
        cur = cur.filter(v => !noneVals.includes(v));
        if (cur.includes(val)) {
          cur = cur.filter(v => v !== val);
        } else {
          cur.push(val);
        }
      }
      window.state.answers[qid] = cur;
      renderStage();
    };

    // 按「確認送出 →」先跳去下一題 (如由覆核頁進入修改，則直接返回已更新嘅覆核頁)
    window.submitQuestion = function(qid) {
      if (window.state.editingFromReview) {
        window.state.editingFromReview = false;
        goStep("review", "panel");
        return;
      }
      if (qid === "q2" && window.state.answers.q2 === "醒咗先順便去") {
        goStep("sleep_clip", "video");
        return;
      }
      if (qid === "q6") {
        const arr = window.state.answers.q6 || [];
        if (arr.includes("血尿／尿痛／發燒") || arr.includes("想排但排唔出")) {
          goStep("safety_stop", "video");
          return;
        }
      }
      const nextMap = {
        q1: "q2", q2: "q3", q3: "q4", q4: "q5", q5: "q6",
        q6: "q7", q7: "q8", q8: "q9"
      };
      const nxt = nextMap[qid] || "review";
      goStep(nxt, nxt === "q9" ? "panel" : "video");
    };

    window.submitQ9 = function() {
      if (window.state.editingFromReview) {
        window.state.editingFromReview = false;
        goStep("review", "panel");
        return;
      }
      // 答完所有問題 -> 進入操作提示影片頁 (08-preview.mp4)，播完自動出全屏答案覆核頁
      goStep("review", "video");
    };

    // 於覆核頁點擊某題 -> 直接打開該題嘅選答案面板，修改後返同一個覆核頁
    window.editFromReview = function(qid) {
      if (window.state.paidLocked) return;
      window.state.editingFromReview = true;
      goStep(qid, "panel");
    };

    window.jumpStep = function(target) {
      const postPay = ["report1", "report2", "hmcs_intro", "hmcs_s1", "hmcs_s2", "hmcs_s3", "hmcs_s4", "hmcs_s5", "booking", "booking_done", "eshop", "group"];
      window.state.paidLocked = postPay.includes(target);
      window.state.editingFromReview = false;
      // 預覽跳頁直接打開面板方便檢視（亦可隨時撳重溫影片）
      goStep(target, target === "welcome" ? "video" : "panel");
    };

    window.stepBack = function() {
      if (window.state.editingFromReview) {
        window.state.editingFromReview = false;
        goStep("review", "panel");
        return;
      }
      const prevMap = {
        q1: "welcome", q2: "q1", sleep_clip: "q2", q3: "q2", q4: "q3",
        q5: "q4", q6: "q5", safety_stop: "q6", q7: "q6", q8: "q7",
        q9: "q8", review: "q9", checkout: "review",
        report2: "report1", hmcs_intro: "report2",
        hmcs_s1: "hmcs_intro", hmcs_s2: "hmcs_s1", hmcs_s3: "hmcs_s2",
        hmcs_s4: "hmcs_s3", hmcs_s5: "hmcs_s4",
        booking: "hmcs_intro", booking_done: "booking",
        eshop: "hmcs_s5", group: "eshop"
      };
      const p = prevMap[window.state.step];
      if (p && !(window.state.paidLocked && ["review", "q9", "checkout"].includes(p))) {
        goStep(p, "panel");
      }
    };

    window.processStripeUnlock = function() {
      const btn = document.getElementById("payBtn");
      if (btn) {
        btn.disabled = true;
        btn.textContent = "⏳ 結算中，正在開啟報告...";
      }
      setTimeout(() => {
        window.state.paidLocked = true;
        goStep("report1", "video");
      }, 500);
    };

    renderStage();
  </script>
</body>
</html>
