</style></head><body><header><strong>HEALTH DECODER</strong><span>夜尿影音實驗<br>不收費・不傳送資料</span></header><main><section class="presenter" aria-label="Duncan 預錄短片"><div class="badge">Duncan · 預錄引導</div><div class="poster" id="poster"><div class="orb">☾</div><h2 id="clipTitle"></h2><p class="hint">由你嘅一晚開始，<br>一步一步睇清楚。</p><p class="placeholder">影片位置 · 等待 Duncan 拍攝</p></div><video id="video" playsinline controls preload="none"></video><div class="controls"><button id="play">▶ 播放短片</button><button id="transcript">睇文字稿</button></div></section><section class="content"><div class="step"><span id="phase"></span><div class="dots" id="dots"></div></div><div id="screen"></div><details id="caption"><summary>本段參考文案（可隨時讀）</summary><p id="script"></p></details><p id="status" role="status" aria-live="polite"></p></section></main><details class="tools"><summary>實驗工具 · 裝入短片／直接睇示範案例</summary><p>選一批已拍短片，按拍攝稿檔名自動配對。只在此分頁使用，不會傳送；重新整理後需重載。已整合到網站的影片則不需要此工具。</p><label>裝入 01-welcome.mp4 等短片<input id="files" type="file" accept="video/*" multiple></label><p id="loaded" role="status">尚未裝入本人短片</p><button data-act="sample">載入假設案例 → 預覽</button><button data-act="restart">重新開始</button><p><a href="https://drive.google.com/file/d/1lZU82-vFUqjF0ciokqV97cF4EcQxx49u/view">拍攝稿與框架</a> · 付款、商店及預約均為示範；價錢待定。</p></details><script>
const clips={"01-welcome": {"title": "由你嘅一晚開始", "seconds": 16.25, "script": "你好，我係 Duncan。夜晚成日起身，最攰可能係瞓唔返。我用六個簡單問題，同你睇下邊啲線索值得留意。唔使識醫學，揀最接近你嘅答案就得。", "placement": "入口；開始按鈕一直可撳，唔需要等影片播完。", "file": "01-welcome.mp4", "id": "01-welcome", "bytes": 1459178, "url": "media/01-welcome.mp4", "poster": "media/01-welcome.jpg"}, "02-frequency": {"title": "一晚起身幾次？", "seconds": 11.88, "script": "先諗返平時一晚，你大概起身去幾多次廁所？唔使計得好準，揀最接近嘅就得。", "placement": "第1題；回答後出現相應安慰與下一步。", "file": "02-frequency.mp4", "id": "02-frequency", "bytes": 794833, "url": "media/02-frequency.mp4", "poster": "media/02-frequency.jpg"}, "03-waking": {"title": "邊個感覺行先？", "seconds": 11.96, "script": "呢條好重要：你係尿急先醒，定係醒咗之後，順便去廁所？兩種情況都可能有，唔肯定都可以。", "placement": "第2題；「醒先」分支顯示睡眠線索，不套用飲水案例。", "file": "03-waking.mp4", "id": "03-waking", "bytes": 1066294, "url": "media/03-waking.mp4", "poster": "media/03-waking.jpg"}, "04-volume": {"title": "每次係多定少？", "seconds": 14.42, "script": "夜晚每次去廁所，同日頭一次比較，大概差唔多，定係明顯少啲？未量過唔緊要，呢度先講你嘅感覺。", "placement": "第3題；用三個逐步亮起的線索點顯示已有資料。", "file": "04-volume.mp4", "id": "04-volume", "bytes": 1200800, "url": "media/04-volume.mp4", "poster": "media/04-volume.jpg"}, "05-drinks": {"title": "瞓前飲啲乜？", "seconds": 16.42, "script": "瞓前兩三個鐘，你通常飲啲乜？水、湯、茶，定係冇特別飲？呢度冇啱錯，我哋係睇時間同習慣。", "placement": "第4題；答案與之前線索一同保存，不單憑這题判因。", "file": "05-drinks.mp4", "id": "05-drinks", "bytes": 1490518, "url": "media/05-drinks.mp4", "poster": "media/05-drinks.jpg"}, "06-other": {"title": "仲有冇其他線索？", "seconds": 16.92, "script": "仲有冇腳腫、打鼻鼾、食利尿藥，或者排尿唔順？揀最接近嘅。呢啲資料會影響方向，冇留意過就揀唔肯定。", "placement": "第5題；未知不自動當沒有，藥物不建議自行改。", "file": "06-other.mp4", "id": "06-other", "bytes": 1725588, "url": "media/06-other.mp4", "poster": "media/06-other.jpg"}, "07-safety": {"title": "最後確認有冇新不適", "seconds": 15.54, "script": "最後確認一下：最近有冇血尿、尿痛、發燒，或者想去但排唔到？有嘅話，要先搵醫護，唔好等份報告。", "placement": "第6題；有警號免費顯示求醫提醒並停止解鎖銷售。", "file": "07-safety.mp4", "id": "07-safety", "bytes": 1565955, "url": "media/07-safety.mp4", "poster": "media/07-safety.jpg"}, "08-preview": {"title": "線索開始連得起來", "seconds": 28.5, "script": "你揀咗尿意先醒、每次尿量唔少，仲有瞓前飲得集中。呢幾條線索連埋，飲水時間值得先了解。完整解讀會講點解、仲有咩未能排除，同你可以點揀下一步。呢個係方向，唔係確診。", "placement": "只限明示假設案例符合的答案；其他組合不播放。付款前顯示實際短解讀及完整版新增內容。", "file": "08-preview.mp4", "id": "08-preview", "bytes": 2657172, "url": "media/08-preview.mp4", "poster": "media/08-preview.jpg"}, "09-hna": {"title": "只補你嘅需要", "seconds": 16.92, "script": "頭先嘅答案已經帶過嚟，唔使重填。再揀你最想了解啲乜，同希望自己先睇，定係想了解有人協助。", "placement": "逐項HNA示意在付款前，正式字段及位置未定。", "file": "09-hna.mp4", "id": "09-hna", "bytes": 1231463, "url": "media/09-hna.mp4", "poster": "media/09-hna.jpg"}, "10-report-why": {"title": "點解先睇飲水時間", "seconds": 27.04, "script": "我哋先睇飲水時間，係因為你提到瞓前飲得集中，同夜晚每次尿量唔少。晚間飲水可能增加夜晚要排嘅尿。不過，尿量未量過，睡眠、藥物同其他健康因素，仲未能排除。", "placement": "模擬付款後報告第一章；顯示答案→關聯→尚未確定三層圖。", "file": "10-report-why.mp4", "id": "10-report-why", "bytes": 2056247, "url": "media/10-report-why.mp4", "poster": "media/10-report-why.jpg"}, "11-report-next": {"title": "你可以點樣揀下一步", "seconds": 23.25, "script": "呢個方向唔係叫你全日少飲水。如果冇醫護特別指示，可以先考慮將飲水分散到日間，避免瞓前一次飲好多。唔好令自己缺水，亦唔好自行改藥。持續困擾，就要搵醫護進一步了解。", "placement": "報告第二章；重點是解釋選擇及限制，不售賣功課包。", "file": "11-report-next.mp4", "id": "11-report-next", "bytes": 2292305, "url": "media/11-report-next.mp4", "poster": "media/11-report-next.jpg"}, "12-routes": {"title": "下一步由你揀", "seconds": 14.42, "script": "你可以自己睇產品資料，按需要決定；如果想有人同你梳理更完整嘅需要，就先了解 HMCS。唔使而家承諾買嘢。", "placement": "報告後兩條路：商店示意、HMCS介紹。產品不聲稱治療夜尿。", "file": "12-routes.mp4", "id": "12-routes", "bytes": 1327834, "url": "media/12-routes.mp4", "poster": "media/12-routes.jpg"}, "13-hmcs": {"title": "HMCS 會點樣幫你", "seconds": 22.92, "script": "HMCS 會先確認你嘅需要。合適嘅話，再安排線下數據評估、詳細報告解讀，同你一齊討論方案同費用。你認同安排先開始。頭先填過嘅資料會沿用，唔使由頭講。", "placement": "介紹後才問有無意願了解按需要報價的服務，再入預約意向。不是付費報告已含陪跑。", "file": "13-hmcs.mp4", "id": "13-hmcs", "bytes": 2163568, "url": "media/13-hmcs.mp4", "poster": "media/13-hmcs.jpg"}, "14-booking": {"title": "先確認，再見面", "seconds": 15.96, "script": "如果你想進一步了解，留低方便聯絡嘅方式同時段。我哋會先確認需要、服務同費用，再一齊落實見面，唔係撳完就當約好咗。", "placement": "示範只填測試資料；提交不傳送，終點待確認。", "file": "14-booking.mp4", "id": "14-booking", "bytes": 1275412, "url": "media/14-booking.mp4", "poster": "media/14-booking.jpg"}, "15-sleep-reply": {"title": "選拍：先醒再去", "seconds": 13.63, "script": "你係先醒咗，再順便去廁所。呢個先後好有意思，可能要一齊了解睡眠，唔好一開始就只怪膀胱。", "placement": "可選分支回應；第2題選「醒先」播放，否則只顯示文字。", "file": "15-sleep-reply.mp4", "id": "15-sleep-reply", "bytes": 1329814, "url": "media/15-sleep-reply.mp4", "poster": "media/15-sleep-reply.jpg"}, "16-safety-reply": {"title": "選拍：先處理不適", "seconds": 15.96, "script": "呢個提醒唔需要付費。有新血尿、尿痛或者發燒，請盡快求醫。如果想排但排唔到，請即時求醫，唔好等報告。", "placement": "可選安全分支；文字提醒始終提供，不依賴影片。", "file": "16-safety-reply.mp4", "id": "16-safety-reply", "bytes": 1739984, "url": "media/16-safety-reply.mp4", "poster": "media/16-safety-reply.jpg"}};
const questions=[
{title:'通常一晚起身去幾多次廁所？',lead:'唔使計得好準，揀最接近你平時嘅情況。',options:['一次','兩至三次','四次或以上','唔肯定'],reply:['一次都可能打斷休息。下一步睇下，你係點樣醒過嚟。','一晚醒幾次，最辛苦可能係瞓返唔容易。次數係第一條線索，仲未代表原因。','頻密起身值得了解。我哋會一齊睇其他線索；持續影響生活亦宜求醫評估。','唔肯定都可以。唔需要估個答案，我哋先睇你記得嘅感覺。'],tag:'夜間次數'},
{title:'你係尿急先醒，定醒咗先去廁所？',lead:'諗返最近一晚，邊個感覺行先？',options:['尿急叫醒我','先醒咗，順便去','兩樣都有','唔肯定'],reply:['收到，係尿意先出現。下一題睇每次大概有幾多尿。','呢個先後好重要：有時係睡眠先中斷，再順便去廁所，唔一定全由膀胱引起。','兩種情況可以一齊出現，唔需要硬揀一個原因。','冇問題，呢條暫時留白，唔會當成已知。'],tag:'醒來先後'},
{title:'夜晚每次排尿，大概係幾多？',lead:'同你日頭平時一次比較就得。',options:['差唔多，或者較多','明顯少好多','每次都唔同','唔肯定'],reply:['夜晚每次都唔少，我哋會留意夜間尿量同飲水時間，但單靠感覺未能確定。','少量但有尿意，同大量排尿係唔同線索，之後嘅解讀需要分開。','我哋記低有變化，唔會將所有夜晚當一樣。','未量過好正常，呢度先唔落結論。'],tag:'排尿感覺'},
{title:'瞓前兩三個鐘，你通常飲啲乜？',lead:'冇啱錯，呢條只係幫你睇時間同習慣。',options:['飲好多水或湯','茶、咖啡或酒','少量水，冇特別飲品','唔固定 / 唔肯定'],reply:['呢條值得連埋前面睇：夜晚飲得集中，加上每次尿量唔少，飲水時間可能有關，但唔等於已找到唯一原因。','飲品種類同時間可能影響尿意或睡眠，仲要配合其他回答理解。','咁我哋唔應該隨便將原因歸咎於飲水太多。','習慣唔固定，暫時未足夠判斷關聯。'],tag:'晚間飲水'},
{title:'日頭有冇其他情況一齊出現？',lead:'揀最值得留意嘅一項；正式版本可再補充。',options:['腳腫、打鼻鼾或食利尿藥','尿流弱 / 排唔清 / 尿急','冇留意到以上情況','唔肯定'],reply:['呢啲資料會改變解讀方向，唔可以只當飲水時間問題；藥物唔好自行停或改。','排尿情況亦要納入考慮，持續出現宜由醫生評估，唔靠自測確診。','收到，冇觀察到唔等於排除，先按目前資料整理。','我哋會保留未知，唔會用預設答案補上。'],tag:'其他線索'},
{title:'最後，有冇新出現嘅不適？',lead:'呢條幫你決定係繼續了解，定先搵醫生。',options:['冇以下不適','血尿 / 尿痛 / 發燒','想排但排唔到，或明顯唔舒服','唔肯定'],reply:['已完成六條初步問題。下一步睇你目前嘅線索同完整版會解答乜。','呢啲情況唔適合只靠網上解讀，應盡快求醫；求醫提醒唔需要付費。','如果排唔到尿或明顯不適，應即時求醫，唔好等完成報告或 HMCS。','如果懷疑有新不適，先聯絡醫護了解，唔好用自測取代評估。'],tag:'安全確認'}
];

const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(t,a,cls='primary')=>`<button class="${cls}" data-act="${a}">${t}</button>`;
const choose=options=>`<div class="options">${options.map((t,i)=>`<button class="option ${chosen===i?'selected':''}" data-choice="${i}" aria-pressed="${chosen===i}">${t}<span>${chosen===i?'✓':'→'}</span></button>`).join('')}</div>`;
const caseOK=()=>answers.length===6&&answers[1]===0&&answers[2]===0&&answers[3]===0&&answers[4]===2&&answers[5]===0;
const chips=()=>`<div class="clues">${answers.map((a,i)=>`<span>${esc(questions[i].options[a])}</span>`).join('')}</div>`;
function setClip(id){const v=$('video'),src=uploads[id]||clips[id].url;clip=id;$('clipTitle').textContent=clips[id].title;$('script').textContent=clips[id].script;$('caption').open=false;
if(v.dataset.clip===id && v.getAttribute('src')===src)return;
v.pause();v.removeAttribute('src');v.load();v.dataset.clip=id;$('play').textContent='▶ 播放短片';
if(src){v.src=src;v.poster=clips[id].poster||'';v.style.display='block';$('poster').style.display='none';$('status').textContent='Duncan 預錄短片 · 按答案自動分流';if(guided)playClip(false);}
else{v.style.display='none';$('poster').style.display='flex';$('status').textContent='此段未有影片，可睇文案。';}}
async function playClip(restart=true){const v=$('video');if(!v.getAttribute('src')){$('caption').open=true;return;}guided=true;if(restart)v.currentTime=0;try{await v.play();$('play').textContent='↺ 重播短片';}catch{$('status').textContent='手機未自動播放，請撳播放；亦可睇文案。';}}
function go(s){stage=s;chosen=null;render()}
function render(){let h='',id='01-welcome',phase='由你嘅一晚開始';
if(stage==='welcome'){h=`<h1>夜晚又要起身？<br>我哋一齊睇下線索。</h1><p class="sub">六個簡單問題。<br>唔使識醫學，唔使一次填晒。</p>${button('開始，睇下我嘅情況 →','start')}<p class="fine">先免費了解，完整版有解鎖階段。今次只係實驗，唔會收錢。</p>`;}
if(stage==='quiz'){id=keys[q];phase=`了解你嘅一晚 · ${q+1} / 6`;const item=questions[q];h=`<h1>${item.title}</h1><p class="sub">${item.lead}</p>${chosen===null?choose(item.options):`<div class="reply" role="status"><small>你揀咗：${item.options[chosen]}</small><p>${item.reply[chosen]}</p>${button(q===5?'睇我嘅線索 →':'繼續睇下一條線索 →','next')}</div>${button('改返呢個答案','change','secondary')}`}<div class="clues">${answers.slice(0,q).map((a,i)=>`<span>✓ ${questions[i].tag}</span>`).join('')}</div>${q?button('← 上一題','prev','back'):''}`;if(q===1&&chosen===1)id='15-sleep-reply';if(q===5&&(chosen===1||chosen===2))id='16-safety-reply';}
if(stage==='preview'){phase='六題已完成 · 你嘅線索';const safety=answers[5]===1||answers[5]===2;
if(safety){id='16-safety-reply';h=`<h1>先照顧你嘅不適。</h1><p>新血尿、尿痛或發燒，請盡快求醫。想排但排唔到，請即時求醫。</p><div class="card">呢個提醒免費提供，唔需要解鎖報告或等 HMCS。</div>${button('重新體驗','restart','secondary')}`;}
else if(!caseOK()){id='03-waking';h=`<h1>唔會將你嘅情況，<br>硬套落同一個答案。</h1>${chips()}<p>你嘅回答有另一組線索；今次實驗未建立呢個完整解讀分支。</p>${button('改用明示假設案例睇完整體驗','sample')}<p class="fine">下一頁會換成「尿意先醒、每次唔少、晚間飲得集中」示範，唔係你個人嘅結論。</p>`;}
else{id='08-preview';h=`<h1>你嘅線索，<br>開始連得起來。</h1><div class="diagram"><div>尿意<br>先醒</div><b>＋</b><div>每次<br>唔少</div><b>＋</b><div>晚間飲得<br>集中</div></div><p>「飲水時間」值得先了解。<br>但未能當成唯一成因。</p><div class="card"><h2>完整版會多啲乜？</h2><p>點解呢個組合有關？<br>仲有邊啲因素未排除？<br>你可以點揀下一步，原因係乜？</p></div>${button('我想睇完整解讀 →','hna')}<p class="fine">自動解讀，不包括 Duncan 人工評估。六題不等於診斷；價格待定。</p>`;}}
if(stage==='hna'){id='09-hna';phase=`補你嘅需要 · ${hi+1} / 3`;const titles=['你最想先了解乜？','你希望點樣繼續？','我可以點稱呼你？'];h=`<h1>${titles[hi]}</h1><p class="sub">夜尿答案已沿用，唔使重填。</p>`;if(hi<2){h+=choose(hi===0?['了解夜尿線索同下一步','睡眠同整體健康需要','先了解，未決定做服務']:['我想先自己睇解讀','想了解顧問協助，但未承諾']);}else{h+=`<label class="field" for="name">示範稱呼（選填）</label><input id="name" maxlength="30" placeholder="例如：陳先生；請用測試資料" value="${esc(hna.name||'')}">${button('睇清楚交付，再解鎖 →','checkout')}`;}h+=`<p class="fine">HNA 示意，正式字段未定。資料只在分頁內，唔會傳送。</p>`;}
if(stage==='checkout'){id='08-preview';phase='解鎖示意 · 不收費';h=`<h1>睇清楚先解鎖。</h1><div class="card"><h2>夜尿個人解讀</h2><p>線索點樣連起來<br>白話原理解說<br>未知因素及下一步選擇</p><p class="fine">自動交付，毋須等人工回覆。人工服務另於 HMCS 確認。</p></div><p>價格：<strong>待定</strong></p>${button('模擬付款成功 →','pay')}${button('取消，返去預覽','cancel','secondary')}<p class="fine">沒有接信用卡或其他收款。只示範付款後画面。</p>`;}
if(stage==='report'){phase=`假設案例解讀 · ${chapter+1} / 2`;if(chapter===0){id='10-report-why';h=`<h1>點解先睇<br>飲水嘅時間？</h1><p class="fine">${esc(hna.name||'示範客人')} · 模擬解鎖 · 非診斷</p><div class="diagram"><div>你嘅<br>三條線索</div><b>→</b><div>晚間飲水<br>可能有關</div></div><p>瞓前集中飲水，可能增加夜間要排出嘅尿。</p><div class="card"><h2>仲未知道嘅部分</h2><p>尿量未量過。睡眠、藥物、膀胱及其他健康因素仍可能有關。</p></div>${button('咁我可以點樣揀下一步？ →','chapter')}`;}else{id='11-report-next';h=`<h1>先睇時間，<br>唔係全日少飲水。</h1><div class="card"><p>冇醫護特別指示下，可考慮把飲水分散到日間，避免瞓前集中大量飲水。</p></div><p>唔好令自己缺水，亦唔好自行改藥。持續困擾需要醫護評估。</p><p class="sub">你想先了解：${esc(hna.goal||'夜尿線索')}</p>${button('睇兩條繼續嘅路 →','routes')}${button('← 睇返原理解說','reportback','back')}<p class="fine source">參考 <a href="https://oxfordhealth.nhs.uk/ababs/advice/understanding-nocturia/" target="_blank" rel="noopener">Oxford Health NHS</a>。題目與正式解讀仍需審核。</p>`;}}
if(stage==='routes'){id='12-routes';phase='下一步 · 由你揀';h=`<h1>自己先揀，<br>定想有人一齊睇？</h1>${button('去 Duncan 商店，睇產品資料 →','shop')}${button('了解 HMCS 點樣幫我 →','hmcs','secondary')}<p class="fine">毋須而家承諾買嘢；保健品不代表能處理夜尿成因。</p>${button('返去睇解讀','reportback','back')}`;}
if(stage==='shop'){id='12-routes';phase='自助商店 · 接續示意';h=`<h1>先了解產品，<br>再按需要決定。</h1><div class="card"><h2>Duncan 商店位置</h2><p>正式會接真實產品資料、Cosway 價錢同成交流程。</p><p class="fine">商店網址未確認，今次未提供商品或付款。自測不會判定你必需某種保健品。</p></div>${button('返回兩條選擇','routes','secondary')}`;}
if(stage==='hmcs'){id='13-hmcs';phase='HMCS · 先了解，後決定';h=`<h1>有人同你梳理，<br>唔使自己估。</h1><div class="card"><p>確認需要 → 合適才安排線下評估 → 詳細報告解讀 → 一齊討論方案。</p><p class="fine">服務及費用按需要商議，認同安排後才開始。不是診斷服務。</p></div><p>你願意了解需要報價嘅服務，先確認係咪適合你？</p>${button('願意，先確認需要 →','booking')}${button('我先唔約，睇返解讀','reportback','secondary')}`;}
if(stage==='booking'){id='14-booking';phase='預約意向 · 不傳送';h=`<h1>先確認，再見面。</h1><p class="sub">已有夜尿答案同 HNA 會沿用。</p><label class="field" for="contact">測試聯絡資料</label><input id="contact" placeholder="例如 demo（勿填真實電話）"><label class="field" for="time">方便嘅時段</label><select id="time"><option>平日早上</option><option>平日下午</option><option>星期六</option><option>需要商量</option></select><label class="tick field"><input id="consent" type="checkbox"><span>我明白需先商議服務及費用，再落實見面。</span></label><p class="error" id="error" role="alert"></p>${button('模擬提交意向','submit')}${button('返回 HMCS 介紹','hmcs','back')}`;}
if(stage==='done'){id='14-booking';phase='實驗路徑完成';h=`<h1>你已睇完整條路。</h1><p>正式下一步會由 Duncan 確認需要與適合程度，再商量見面。</p><div class="card">今次沒有扣款或送出預約，亦沒有通知 Duncan。</div>${button('返去報告','reportback')}${button('重新體驗','restart','secondary')}`;}
$('phase').textContent=phase;$('dots').innerHTML=Array.from({length:6},(_,i)=>`<i class="${i<(stage==='welcome'?0:stage==='quiz'?q+(chosen!==null?1:0):6)?'on':''}"></i>`).join('');$('screen').innerHTML=h;setClip(id);}
document.addEventListener('click',e=>{const c=e.target.closest('[data-choice]');if(c){chosen=+c.dataset.choice;if(stage==='quiz'){answers=answers.slice(0,q);answers[q]=chosen;render();}else if(stage==='hna'){const opts=hi===0?['了解夜尿線索同下一步','睡眠同整體健康需要','先了解，未決定做服務']:['我想先自己睇解讀','想了解顧問協助，但未承諾'];hna[hi===0?'goal':'pace']=opts[chosen];hi++;chosen=null;render();}return;}const b=e.target.closest('[data-act]');if(!b)return;switch(b.dataset.act){case'start':guided=true;answers=[];q=0;paid=false;hna={};go('quiz');break;case'next':if(q===5)go('preview');else{q++;go('quiz')}break;case'prev':q--;answers=answers.slice(0,q);paid=false;go('quiz');break;case'change':answers=answers.slice(0,q);go('quiz');break;case'sample':answers=[1,0,0,0,2,0];hna={};paid=false;go('preview');break;case'hna':hi=0;go('hna');break;case'checkout':hna.name=$('name').value;go('checkout');break;case'pay':if(!caseOK())return;paid=true;chapter=0;go('report');break;case'cancel':go('preview');break;case'chapter':chapter=1;go('report');break;case'reportback':if(!paid){go('preview');break}chapter=0;go('report');break;case'routes':case'shop':case'hmcs':case'booking':if(paid)go(b.dataset.act);break;case'submit':if(!$('contact').value.trim()||!$('consent').checked){$('error').textContent='請填測試資料並確認安排。';return;}go('done');break;case'restart':guided=false;hna={};answers=[];paid=false;q=0;go('welcome');break;}});
$('play').onclick=()=>playClip(true);
$('video').onerror=()=>{$('status').textContent='影片未能播放；文字稿可繼續使用。';$('caption').open=true;};
$('transcript').onclick=()=>{$('caption').open=!$('caption').open;};
$('files').onchange=e=>{let count=0;for(const file of e.target.files){const key=file.name.replace(/\.[^.]+$/,'');if(clips[key]){if(uploads[key])URL.revokeObjectURL(uploads[key]);uploads[key]=URL.createObjectURL(file);count++;}}$('loaded').textContent=`已配對 ${Object.keys(uploads).length} 條短片；本次成功配對 ${count} 條。`;setClip(clip);};
window.addEventListener('beforeunload',()=>Object.values(uploads).forEach(u=>URL.revokeObjectURL(u)));
render();
</script></body></html>
