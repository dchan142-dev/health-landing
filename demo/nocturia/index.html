<header><strong>Health Decoder <span>健康解碼</span></strong><span>體驗示範 · 假設案例 · 不收費、不傳送資料</span></header>
<div class="layout"><aside><h2>由好奇，到知道下一步</h2><nav id="nav"></nav><p class="small">示範一條完整路徑。<br>正式題目、價錢及服務內容待定。</p></aside><main><div class="top"><span class="pill" id="phase"></span><button class="voice" id="sound" aria-pressed="false">開啟示範語音</button></div><div class="track"><div id="progress"></div></div><section id="screen" aria-live="polite"></section><div class="status" id="audioStatus"></div><details class="journey-note"><summary>看這一步的設計與實作方式</summary><p id="note"></p></details></main></div>
<script>
const questions=[
{title:'通常一晚起身去幾多次廁所？',lead:'唔使計得好準，揀最接近你平時嘅情況。',options:['一次','兩至三次','四次或以上','唔肯定'],reply:['一次都可能打斷休息。下一步睇下，你係點樣醒過嚟。','一晚醒幾次，最辛苦可能係瞓返唔容易。次數係第一條線索，仲未代表原因。','頻密起身值得了解。我哋會一齊睇其他線索；持續影響生活亦宜求醫評估。','唔肯定都可以。唔需要估個答案，我哋先睇你記得嘅感覺。'],tag:'夜間次數'},
{title:'你係尿急先醒，定醒咗先去廁所？',lead:'諗返最近一晚，邊個感覺行先？',options:['尿急叫醒我','先醒咗，順便去','兩樣都有','唔肯定'],reply:['收到，係尿意先出現。下一題睇每次大概有幾多尿。','呢個先後好重要：有時係睡眠先中斷，再順便去廁所，唔一定全由膀胱引起。','兩種情況可以一齊出現，唔需要硬揀一個原因。','冇問題，呢條暫時留白，唔會當成已知。'],tag:'醒來先後'},
{title:'夜晚每次排尿，大概係幾多？',lead:'同你日頭平時一次比較就得。',options:['差唔多，或者較多','明顯少好多','每次都唔同','唔肯定'],reply:['夜晚每次都唔少，我哋會留意夜間尿量同飲水時間，但單靠感覺未能確定。','少量但有尿意，同大量排尿係唔同線索，之後嘅解讀需要分開。','我哋記低有變化，唔會將所有夜晚當一樣。','未量過好正常，呢度先唔落結論。'],tag:'排尿感覺'},
{title:'瞓前兩三個鐘，你通常飲啲乜？',lead:'冇啱錯，呢條只係幫你睇時間同習慣。',options:['飲好多水或湯','茶、咖啡或酒','少量水，冇特別飲品','唔固定 / 唔肯定'],reply:['呢條值得連埋前面睇：夜晚飲得集中，加上每次尿量唔少，飲水時間可能有關，但唔等於已找到唯一原因。','飲品種類同時間可能影響尿意或睡眠，仲要配合其他回答理解。','咁我哋唔應該隨便將原因歸咎於飲水太多。','習慣唔固定，暫時未足夠判斷關聯。'],tag:'晚間飲水'},
{title:'日頭有冇其他情況一齊出現？',lead:'揀最值得留意嘅一項；正式版本可再補充。',options:['腳腫、打鼻鼾或食利尿藥','尿流弱 / 排唔清 / 尿急','冇留意到以上情況','唔肯定'],reply:['呢啲資料會改變解讀方向，唔可以只當飲水時間問題；藥物唔好自行停或改。','排尿情況亦要納入考慮，持續出現宜由醫生評估，唔靠自測確診。','收到，冇觀察到唔等於排除，先按目前資料整理。','我哋會保留未知，唔會用預設答案補上。'],tag:'其他線索'},
{title:'最後，有冇新出現嘅不適？',lead:'呢條幫你決定係繼續了解，定先搵醫生。',options:['冇以下不適','血尿 / 尿痛 / 發燒','想排但排唔到，或明顯唔舒服','唔肯定'],reply:['已完成六條初步問題。下一步睇你目前嘅線索同完整版會解答乜。','呢啲情況唔適合只靠網上解讀，應盡快求醫；求醫提醒唔需要付費。','如果排唔到尿或明顯不適，應即時求醫，唔好等完成報告或 HMCS。','如果懷疑有新不適，先聯絡醫護了解，唔好用自測取代評估。'],tag:'安全確認'}
];
const labels=['簡短入口','逐題互動','個人預覽','HNA 補充','模擬付款','完整解讀','兩條路徑'];let stage=0,q=0,answers=[],selected=null,sound=false,paid=false,hna={},route='';const $=id=>document.getElementById(id);const btn=(text,act,cls='primary')=>`<button class="${cls}" data-action="${act}">${text}</button>`;const host=text=>`<div class="host"><div class="avatar">D</div><div><label>Duncan 引導文案 · 預錄位置示意</label><p>${text}</p></div><button class="voice" data-action="read">聽解說</button></div>`;
function speak(text){if(!('speechSynthesis'in window)){$('audioStatus').textContent='此裝置未支援示範朗讀；解說文字已顯示。';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-HK';u.rate=.88;const voices=speechSynthesis.getVoices();const v=voices.find(v=>/zh[-_]HK|yue/i.test(v.lang));if(v)u.voice=v;$('audioStatus').textContent=v?'系統廣東話示範朗讀（不是 Duncan 本人錄音）':'系統示範朗讀；廣東話聲線視裝置支援';u.onerror=()=>{$('audioStatus').textContent='朗讀未能播放，請閱讀解說。'};speechSynthesis.speak(u)}
function eligible(){return answers.length===6&&answers[1]===0&&answers[2]===0&&answers[3]===0&&answers[4]===2&&answers[5]===0}function safety(){return answers[5]===1||answers[5]===2}function summary(){return answers.map((a,i)=>`<span>${questions[i].tag}：${questions[i].options[a]}</span>`).join('')}
function go(s){stage=s;selected=null;render()}
function render(){if('speechSynthesis'in window)speechSynthesis.cancel();$('audioStatus').textContent='';$('phase').textContent=labels[Math.min(stage,6)];$('progress').style.width=((stage===1?(q+1)/6*25:stage*14)+8)+'%';$('nav').innerHTML=labels.map((x,i)=>`<button data-stage="${i}" class="${stage===i?'active':''}" ${i>1&&answers.length<6?'disabled':''} ${i>=5&&!paid?'disabled':''}>${i+1} · ${x}</button>`).join('');let html='',note='';
if(stage===0){html=`<div class="night"><div class="moon">☾</div><div class="eyebrow" style="color:#d5e3d5">夜尿 · 從你嘅一晚開始</div><h1>又要起身？<br>先睇清楚，係乜嘢叫醒你。</h1><p>六個簡單問題，<br>一步一步，幫你整理線索。</p><div class="timeline"><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div></div>${host('唔使識醫學，亦唔使一次填晒。我哋由你平時點樣醒開始。')}${btn('開始了解我嘅夜晚 →','start')}<p class="small">先免費了解線索。完整個人解讀設有付費階段；此版本只示範，不收費。</p>${btn('直接體驗假設案例','sample','secondary')}`;note='入口立即進入一題一屏；夜間色調建立情境。按下播放才發聲。正式用 Duncan 短片或錄音，此版本使用裝置朗讀；沒有生成或冒充本人聲音。';}
if(stage===1){const item=questions[q];html=`<div class="eyebrow">了解你嘅夜晚 · ${q+1} / 6</div><h1>${item.title}</h1>${host(item.lead)}<div>${item.options.map((x,i)=>`<button class="choice ${selected===i?'selected':''}" data-answer="${i}" aria-pressed="${selected===i}"><b>${x}</b><span>${selected===i?'✓':'→'}</span></button>`).join('')}</div>${selected!==null?`<div class="feedback"><p>${item.reply[selected]}</p>${btn(q===5?'睇我嘅個人預覽 →':'繼續，睇下一條線索 →','next')}</div>`:''}<div class="clues">${answers.slice(0,q).map((a,i)=>`<span>✓ ${questions[i].tag}</span>`).join('')}</div>${q?btn('← 返回上一題','prev','back'):''}`;note='點選後即時顯示相應解說、選取狀態及新增線索；停留讓客人消化，再自行繼續。聲音開啟時讀出回應。沒有模擬分析百分比或假裝 AI 診斷。';}
if(stage===2){let title=eligible()?'你嘅線索，指向「晚間飲水時間」值得先了解。':'你嘅情況，暫時未能用一個方向解釋。';html=`<div class="eyebrow">初步線索已整理 · 免費預覽</div><h1>${safety()?'你嘅不適，應先由醫護評估。':title}</h1><div class="clues">${summary()}</div>${host(safety()?'呢個提醒唔需要付費。先處理不適，比繼續問卷重要。':eligible()?'你話尿意先叫醒你，每次尿量唔少，而且瞓前飲得集中。呢幾條線索連埋睇，比單睇起身次數更有意思。':'你嘅回答唔完全符合呢次示範嘅假設案例。我哋唔會硬套一個成因。')}<div class="preview"><h2>${safety()?'先做嘅事':'完整版會幫你解答'}</h2>${safety()?'<p>新血尿、尿痛或發燒應盡快求醫；排唔到尿或明顯不適應即時求醫。</p>':`<p>① 點解呢幾個答案要連埋睇？</p><p>② 邊啲方向值得優先處理，邊啲仲未能排除？</p><p>③ 你可以點樣揀下一步，先唔使盲目試？</p><div class="reveal"><p>例如：飲水時間可能有關，但唔代表要你全日少飲水。完整版會解釋兩者分別。</p></div>`}</div>${eligible()?btn('睇解鎖內容，補充我嘅需要 →','hna'):''}${btn('用假設案例睇完整體驗','samplepreview','secondary')}<p class="small">自動解讀，不包括 Duncan 人工評估。六題未能確定病因。報告價格未定。</p>`;note='按回答生成有關聯的預覽；非示範組合不硬套結果。安全提醒免費。原型只包含一個完整假設案例，其餘情況需後續建立題庫和解讀。';}
if(stage===3){html=`<div class="eyebrow">HNA · 移到報告之前</div><h1>唔使重填。<br>再了解你想改善啲乜。</h1>${host('頭先嘅夜尿答案已經帶過嚟。呢度補充你嘅需要，報告同之後 HMCS 都沿用。')}<div class="clues">${summary()}</div><label class="field" for="goal">你最想先得到乜？</label><select id="goal"><option>了解夜尿線索，知道下一步</option><option>有人幫我梳理睡眠同健康需要</option><option>先了解，未決定做服務</option></select><label class="field" for="pace">你希望用邊種方式了解？</label><select id="pace"><option>先自己睇解讀，再決定</option><option>想了解顧問協助，但未承諾</option></select><label class="field" for="name">稱呼（示範用）</label><input id="name" value="陳先生" autocomplete="off"><p class="small">HNA 此次只用三項示意補充，並非完整定稿。正式聯絡資料收集及同意安排待定；請勿輸入真實私隱資料。</p>${btn('睇清楚交付，再去解鎖 →','checkout')}`;note='沿用六題資料，不再重填。此次假設 HNA 在付款前，符合「出最終報告前完成」要求；正式位置和完整字段仍待定。只存在此頁記憶中，不上傳或儲存。';}
if(stage===4){html=`<div class="eyebrow">付款示意 · 不收費</div><h1>買嘅係解讀，<br>唔係一份要你做嘅功課。</h1><div class="panel"><h2>夜尿個人解讀</h2><p>回答線索 → 原理解說 → 優先方向 → 下一步選擇</p><p class="small">付款成功後自動顯示。你毋須等 Duncan 逐份回覆；人工協助另於 HMCS 確認。</p></div><p>價格：<strong>待定</strong></p>${btn('模擬付款成功 · 解鎖示範報告','pay')}${btn('模擬取消付款','cancel','secondary')}<p class="small">此按鈕沒有接 Stripe，不會扣款。正式付款方式另定，與 Cosway 買貨付款分開。</p>`;note='模擬付款成功和取消。正式需後端驗證付款及報告權限，不可單靠成功跳轉頁。此處不收信用卡資料，也沒有真正權限保護。';}
if(stage===5){html=`<div class="eyebrow">已模擬解鎖 · 假設案例報告</div><h1>先睇時間，<br>唔好急住怪自己嘅膀胱。</h1><p class="small">${escapeText(hna.name||'示範客人')} · 自動生成示意 · 不是診斷</p>${host('呢份解讀會先講我哋知道乜，再講未知道乜。你唔需要睇完就買嘢。')}<div class="clues">${summary()}</div><div class="panel"><div class="number">01 · 線索點樣連起來</div><h2>尿意先醒 + 每次唔少 + 晚間飲得集中</h2><p>呢個組合令「飲水嘅時間分布」值得先了解。臨睡前集中飲水，可能增加夜間要排出嘅尿量。</p></div><div class="panel"><div class="number">02 · 解讀有幾確定？</div><h2>有關聯，未能證明係唯一成因。</h2><p>尿量未量度；睡眠、藥物、膀胱及其他健康因素仍可能有關。冇留意到其他情況，唔等於已排除。</p></div><div class="panel"><div class="number">03 · 對你有乜用？</div><h2>先調整時間，唔係全日少飲水。</h2><p>如果冇醫護指定飲水限制，可先考慮將大部分飲水分散到日間，避免瞓前集中大量飲水。唔好為減夜尿令自己缺水，亦唔好自行改利尿藥。</p><p>如果持續困擾，或出現排尿異常，就需要醫護進一步了解；六題報告唔能代替檢查。</p></div><div class="panel"><div class="number">04 · 按你嘅需要</div><h2>${escapeText(hna.goal||'了解夜尿線索，知道下一步')}</h2><p>你可以先自己了解選項；如果想有人梳理更完整嘅需要，再了解 HMCS。兩條路都由你決定。</p></div><p class="source">解讀參考：<a href="https://oxfordhealth.nhs.uk/ababs/advice/understanding-nocturia/" target="_blank" rel="noopener">Oxford Health NHS 夜尿說明</a>。原型文案與正式問卷仍需審核。</p>${btn('睇我可以點樣繼續 →','routes')}`;note='完整呈現一個假設方向：證據鏈、白話機制、未知部分及具體選擇。正式需建立八份題庫與對應解讀；沒有疾病機率，也沒有推薦某保健品治療夜尿。';}
if(stage===6&&!route){html=`<div class="eyebrow">睇完解讀 · 由你揀下一步</div><h1>你想自己揀，<br>定想有人幫你睇清楚？</h1>${host('唔需要而家承諾一套方案。先睇清楚兩條路，揀適合你嘅方式。')}<div class="grid"><div class="panel"><div class="number">自己了解選購</div><h2>去 Duncan 商店</h2><p>睇產品資料，按自己需要決定。</p>${btn('睇商店示範 →','shop')}</div><div class="panel"><div class="number">先確認需要，再見面</div><h2>了解 HMCS</h2><p>已有報告同 HNA 會沿用，唔使由頭講。</p>${btn('睇 Duncan 點樣幫我 →','hmcs')}</div></div>`;note='兩條分流不強迫購買；報告付款和產品成交分開。HMCS 較早介紹，但仍保留申請及見面前對齊。';}
if(route==='shop'){html=`<div class="eyebrow">Duncan 商店 · 接續畫面示範</div><h1>先了解產品，<br>唔使為夜尿盲目買。</h1>${host('自測唔會直接判定你需要邊隻保健品。你可以先睇成分、用途同注意事項。')}<div class="panel"><h2>產品資料位置</h2><p>正式商店將顯示真實產品、Cosway 平台價格、用法及注意事項。</p><p class="small">現時未提供已確認商店網址，所以沒有虛構商品或付款入口。使用藥物或有健康問題，選購前宜向醫護了解適合程度。</p></div>${btn('返回兩條選擇','routeback','secondary')}`;note='此處是商城接續示意，不是假商店。正式需接 Duncan 商店及 Cosway 成交流程，不能套報告 Stripe 收款。';}
if(route==='hmcs'){html=`<div class="eyebrow">HMCS · 先了解，後決定</div><h1>有人同你一齊睇，<br>唔使自己估下一步。</h1><div class="video"><p>Duncan 短片位置 · 未有本人素材</p><button data-action="hmcsread">▶ 聽 HMCS 示範解說</button></div><div class="panel"><h2>見面會做乜？</h2><p>先確認需要 → 合適才約線下評估 → 報告解讀 → 一齊討論方案。</p><p>計劃可討論 30 / 90 天，按需要報價。服務、跟進及保健品內容，要你認同並確認後才開始。</p></div><p>唔使再填整份 HNA。你嘅夜尿答案同目標已帶過嚟。</p><p class="small">這是健康管理服務，非疾病診斷。提交意向不等於已獲確認預約或承諾購買。</p>${btn('我想先確認係咪適合 →','booking')}${btn('返回兩條選擇','routeback','secondary')}`;note='沿用現有 HMCS「HNA → 線下評估 → 報告解讀 → 方案共識」關係，使用此次確認的30/90天作討論選項，沒有固定價或保證成效。';}
if(route==='booking'){html=`<div class="eyebrow">HMCS · 預約意向示範</div><h1>先確認需要，<br>再約一個雙方適合嘅時間。</h1><div class="panel"><h2>已有資料，毋須重填</h2><p>${escapeText(hna.name||'陳先生')} · ${escapeText(hna.goal||'了解夜尿線索')}</p></div><label class="field" for="contact">聯絡方式（示範，不傳送）</label><input id="contact" placeholder="請用測試資料，例如 demo"><label class="field" for="time">較方便嘅時段</label><select id="time"><option>平日早上</option><option>平日下午</option><option>星期六</option><option>需要再商量</option></select><label class="tick"><input id="consent" type="checkbox"><span>我明白會先確認適合程度、服務及費用，再落實見面。</span></label><p id="validation" class="error" role="alert"></p>${btn('模擬提交預約意向','submit')}${btn('返回服務介紹','hmcs','secondary')}`;note='示範先確認理解，再提交意向。正式需確認聯絡方式、私隱同意、服務地點及真實可用時段；不會自動把每個人判定合適或已約好。';}
if(route==='done'){html=`<div class="seal">✓</div><div class="eyebrow">示範路徑完成</div><h1>意向已在示範中確認。<br>下一步，先對齊再見面。</h1><p>正式流程：Duncan 確認需要與適合程度，再與你商量時段及服務安排。</p><div class="panel"><h2>沒有送出真實預約</h2><p>所有示範資料只在當前頁面；重新整理便清除。沒有扣款，亦沒有通知 Duncan。</p></div>${btn('返回完整解讀','report','secondary')}${btn('重新體驗','restart','secondary')}`;note='到此結束線上漏斗；之後的報告討論、方案報價與共識在線下。這次沒有對外提交任何客戶資料。';}
$('screen').innerHTML=html;if(stage===5){$('screen').querySelectorAll('.panel').forEach((panel,i)=>{const heading=panel.querySelector('h2');const content=[...panel.querySelectorAll('p')].map(p=>p.outerHTML).join('');panel.innerHTML='<details '+(i===0?'open':'')+'><summary>'+heading.outerHTML+'</summary>'+content+'</details>';});}$('note').textContent=note;if(sound){let t=$('screen').querySelector('.host p');if(t)speak(t.textContent)}}
function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.addEventListener('click',e=>{const a=e.target.closest('[data-answer]');if(a){selected=+a.dataset.answer;answers=answers.slice(0,q);answers[q]=selected;render();if(sound)speak(questions[q].reply[selected]);return}const n=e.target.closest('[data-stage]');if(n){route='';go(+n.dataset.stage);return}const b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'start':q=0;answers=[];go(1);break;case'sample':answers=[1,0,0,0,2,0];go(2);break;case'samplepreview':answers=[1,0,0,0,2,0];go(2);break;case'next':if(q===5)go(2);else{q++;go(1)}break;case'prev':q--;answers=answers.slice(0,q);go(1);break;case'hna':go(3);break;case'checkout':hna={name:$('name').value,goal:$('goal').value,pace:$('pace').value};go(4);break;case'pay':if(!eligible()){go(2);break}paid=true;go(5);break;case'cancel':go(2);$('audioStatus').textContent='已模擬取消；未付款、未解鎖。';break;case'routes':route='';go(6);break;case'shop':case'hmcs':case'booking':route=b.dataset.action;go(6);break;case'routeback':route='';go(6);break;case'submit':if(!$('contact').value.trim()||!$('consent').checked){$('validation').textContent='請填測試聯絡資料，並確認已了解預約安排。';break}route='done';go(6);break;case'report':route='';go(5);break;case'restart':route='';paid=false;answers=[];hna={};q=0;go(0);break;case'read':speak($('screen').querySelector('.host p').textContent);break;case'hmcsread':speak('如果你想有人協助，我哋先了解你嘅需要同意願。確認適合之後，再安排線下評估，解讀報告，同你一齊討論方案同費用。你認同咗先開始，唔需要而家承諾購買。');break}});$('sound').onclick=()=>{sound=!sound;$('sound').setAttribute('aria-pressed',sound);$('sound').textContent=sound?'示範語音已開啟':'開啟示範語音';if(sound)speak('呢個係系統示範朗讀，唔係 Duncan 本人錄音。');else if('speechSynthesis'in window)speechSynthesis.cancel()};render();
</script></html>
