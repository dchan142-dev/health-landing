<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Health Decoder｜夜尿小測試・暖心樣本</title>
<style>
  :root {
    --bg: #fff4ec;
    --card: #fffdfb;
    --ink: #3f2a26;
    --muted: #7a5b52;
    --line: #f0d2c4;
    --accent: #9a3b2f;
    --accent-soft: #f8e4dc;
    --choice: #fff;
    --ok: #2f6b4f;
    --warn-bg: #9f1239;
    --paper: #fff6d8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "WenQuanYi Micro Hei", sans-serif;
    font-size: 22px;
    line-height: 1.45;
  }
  body { padding: 14px 14px 40px; }
  .wrap { max-width: 480px; margin: 0 auto; }
  .top-badge {
    display: inline-block;
    background: #f6c7a8;
    color: #5c2a22;
    font-size: 16px;
    font-weight: 800;
    padding: 8px 12px;
    border-radius: 999px;
    margin: 4px 0 12px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 22px 16px 20px;
    box-shadow: 0 10px 28px rgba(154, 59, 47, 0.08);
  }
  h1 { font-size: 34px; line-height: 1.25; margin: 0 0 10px; }
  h2 { font-size: 24px; margin: 0 0 10px; }
  .sub { color: var(--muted); font-size: 20px; margin: 0 0 16px; }
  .step-label { font-size: 16px; font-weight: 800; color: var(--accent); margin: 8px 0 14px; }
  .progress { height: 12px; background: #f3ddd3; border-radius: 999px; overflow: hidden; }
  .progress > span { display: block; height: 100%; background: linear-gradient(90deg, #e7a08a, var(--accent)); }
  .safety-note, .fine, .price-note, .pay-hint, .unlock-lead, .blurb {
    font-size: 20px;
  }
  .safety-note {
    background: #fff1f2;
    border: 2px solid #fda4af;
    border-radius: 16px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .choices { display: flex; flex-direction: column; gap: 12px; }
  button.choice, button.primary, button.ghost, button.slot-btn {
    width: 100%;
    font: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button.choice {
    min-height: 76px;
    padding: 16px 14px;
    border-radius: 20px;
    border: 3px solid #efd0c3;
    background: var(--choice);
    color: var(--ink);
    font-size: 24px;
    font-weight: 800;
  }
  button.choice.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.choice.danger-opt { border-color: #e11d48; background: #fff1f2; }
  button.choice.danger-opt.selected { background: var(--warn-bg); border-color: var(--warn-bg); color: #fff; }
  button.primary {
    margin-top: 14px;
    min-height: 76px;
    border: none;
    border-radius: 20px;
    background: var(--accent);
    color: #fff;
    font-size: 24px;
    font-weight: 900;
  }
  button.primary.pay { background: #2f6b4f; }
  button.ghost {
    margin-top: 10px;
    min-height: 56px;
    border-radius: 16px;
    border: 2px solid var(--line);
    background: transparent;
    color: var(--muted);
    font-size: 18px;
    font-weight: 700;
  }
  .slot { margin-top: 16px; }
  .slot-kicker { margin: 0 0 8px; font-size: 15px; font-weight: 800; color: #9a5b28; }
  button.slot-btn {
    min-height: 68px;
    border-radius: 18px;
    border: 3px dashed #e0a15a;
    background: var(--paper);
    color: #6b3a12;
    font-size: 20px;
    font-weight: 900;
  }
  .slot-script {
    margin-top: 10px;
    background: var(--paper);
    border-radius: 16px;
    padding: 14px;
  }
  .draft-tag { margin: 0 0 6px; font-size: 14px; font-weight: 800; color: #9a3412; }
  .script-text { margin: 0; font-size: 22px; }
  .flag-box {
    background: var(--warn-bg);
    color: #fff;
    border-radius: 18px;
    padding: 16px;
    margin: 8px 0 4px;
    scroll-margin-top: 12px;
  }
  .flag-box strong { display: block; font-size: 26px; margin-bottom: 6px; }
  .flag-box p { margin: 0; font-size: 20px; }
  .slot { scroll-margin-top: 12px; }
  .result-label { font-size: 30px; font-weight: 900; color: var(--ok); margin: 8px 0; }
  .blurb { margin: 0 0 8px; }
  .tease, .unlock {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 2px solid var(--line);
  }
  .tease ol { margin: 0; padding-left: 1.2em; }
  .tease li { margin: 0 0 12px; }
  .tease li span { display: block; font-size: 18px; color: var(--muted); font-weight: 500; }
  .mask {
    margin-top: 4px;
    color: transparent !important;
    text-shadow: 0 0 8px #b08980;
    user-select: none;
  }
  .price { text-align: center; font-size: 36px; font-weight: 900; margin: 8px 0 0; }
  .price-note, .unlock-lead, .fine { color: var(--muted); }
  form label { display: block; font-size: 18px; font-weight: 800; margin-top: 12px; }
  form input {
    width: 100%;
    margin-top: 6px;
    min-height: 60px;
    border-radius: 16px;
    border: 2px solid var(--line);
    padding: 12px 14px;
    font: inherit;
    font-size: 22px;
    background: #fff;
  }
  .pay-hint {
    margin: 12px 0 0;
    padding: 14px;
    border-radius: 16px;
    background: #fff7ed;
    border: 2px solid #fdba74;
    font-weight: 800;
  }
  .fine { font-size: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-badge">樣本頁・暖心版・短片講稿・未上線</div>
  <div id="app"></div>
  <p class="fine" style="text-align:center;margin-top:16px;">只供個人參考，唔係醫生診斷或處方。有不適請睇醫生。</p>
</div>
<script src="/nocturia-samples/quiz-data.js"></script>
<script src="/nocturia-samples/quiz-engine.js"></script>
<script>
NocturiaSample.start({
  formatLabel: "短片",
  buttonLabel: "▶ Duncan 會講（短片・文字稿）",
  welcomeTitle: "夜晚要起身去廁所？",
  welcomeSub: "我同你慢慢問六條。字大，揀最似嗰句就得。",
  resultTitle: "大致係咁，完整報告仲有",
  scripts: {
    "welcome": "你好，我係 Duncan。夜晚成日要起身去廁所，第二朝會好攰，我明白。而家只係六條好短嘅問題，你揀最似自己嗰句就得。答完我先同你講，份報告大概會見到啲咩。唔使急。",
    "q1.once": "一次都已經會打斷個覺。我聽到喇，我哋繼續。",
    "q1.few": "兩三次，好多人都係咁。你唔係一個人，我哋再問落去。",
    "q1.many": "起咁多次，真係辛苦。你肯講出嚟已經好好，我哋慢慢睇。",
    "q1.unsure": "唔記得都唔緊要。你覺得大概係點就得，我哋繼續。",
    "q2.lots": "尿多又急，我記住咗。呢點對之後份報告好有用。",
    "q2.little": "尿少但好急，我都記住。呢種感覺真係煩。",
    "q2.wait": "要等一陣先出到，我聽到。唔使驚，我哋只係想了解多啲。",
    "q2.incidental": "唔係好急，醒咗先去，都好常見。我哋繼續。",
    "q3.edema": "傍晚腳腫、鞋緊，我記住。瞓低之後，有時會想去多幾次。",
    "q3.weak": "行得少、腳軟，我聽到。呢樣我會放落報告度。",
    "q3.both": "兩樣都有少少，好正常。我一齊記住。",
    "q3.none": "腳方面暫時冇特別，都好。我哋睇下一條。",
    "q4.slow": "出尿要等、線幼，我記住咗。",
    "q4.residual": "尿完覺得未清，我聽到。",
    "q4.urge": "急到忍唔住，真係唔好受。我記住。",
    "q4.ok": "小便算順，都好。再問兩條就差唔多。",
    "q5.thirst": "日頭口乾、飲得多，晚上都可能起多啲。我記住。",
    "q5.sleep": "瞓得淺、易醒，醒咗先去廁所，都好常見。",
    "q5.both": "兩樣都有少少，我一齊記住。",
    "q5.none": "呢兩樣暫時唔似。好，我哋去最後一條安全題。",
    "q6.leg": "一隻腳突然腫痛、行唔到，呢個要認真。請你盡快去睇醫生或者急症。網上問答唔可以代替醫生。如果你仍想睇份參考，可以繼續，但請你第一時間求醫。",
    "q6.blood": "冇尿、尿有血、或者發燒，請你唔好淨係靠網上。請盡快睇醫生或急症。你仍然可以繼續呢份參考，但求醫先。",
    "q6.chest": "胸口痛、好難呼吸、或者半邊身冇力，請即刻去急症。呢度唔可以幫到你判斷。如果你之後先繼續睇參考，都請你而家先求醫。",
    "q6.none": "好，暫時冇呢啲要即刻睇醫生嘅情況。我哋可以睇下你嘅方向。",
    "anticipation": "六條都答完，辛苦晒。以你啱啱講嘅，你比較似「{{方向}}」呢個方向。完整報告會用大字講三樣：可能係點、點解會咁、而家生活上可以試吓啲咩。而家你只係見到個大概。解鎖之後先睇到成份。記住，呢份只係參考，唔係醫生話你有病。"
  }
});
</script>
</body>
</html>
