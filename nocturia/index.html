<!DOCTYPE html>

<html lang="zh-HK">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>夜尿症數位健康中心 | Nocturia Solution</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">

    <style>

        :root {

            --bg-color: #f8fafc;

            --card-bg: #ffffff;

            --primary: #4f46e5;

            --text-main: #334155;

            --text-head: #1e293b;

            --border: #e2e8f0;

        }

        body {

            font-family: 'Inter', sans-serif;

            background-color: var(--bg-color);

            color: var(--text-main);

            margin: 0;

            padding: 20px;

            line-height: 1.6;

        }

        .container {

            max-width: 1200px;

            margin: 0 auto;

        }

        header {

            text-align: center;

            margin-bottom: 40px;

        }

        h1 {

            font-family: 'Montserrat', sans-serif;

            color: var(--text-head);

            font-size: 2.5rem;

            margin-bottom: 10px;

        }

        /* Bento Grid Layout */

        .bento-grid {

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            grid-auto-rows: minmax(200px, auto);

            gap: 20px;

        }

        .bento-item {

            background: var(--card-bg);

            border-radius: 16px;

            padding: 24px;

            border: 1px solid var(--border);

            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);

        }

        .video-box { grid-column: span 3; grid-row: span 2; }

        .stat-box { grid-column: span 1; background: #eef2ff; border-color: #c7d2fe; }

        .quiz-box { grid-column: span 2; }

        .cart-box { grid-column: span 2; }

        /* Video Responsive Wrapper */

        .video-wrapper {

            position: relative;

            padding-bottom: 56.25%;

            height: 0;

            overflow: hidden;

            border-radius: 8px;

        }

        .video-wrapper iframe {

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

        }

        /* Algorithm Styling */

        .quiz-container fieldset {

            border: none;

            padding: 0;

            margin-bottom: 15px;

        }

        button {

            background-color: var(--primary);

            color: white;

            border: none;

            padding: 12px 24px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: 600;

            transition: opacity 0.2s;

        }

        button:hover { opacity: 0.9; }

        #result-display {

            margin-top: 15px;

            font-weight: bold;

            color: var(--primary);

        }

        @media (max-width: 768px) {

            .bento-grid { grid-template-columns: 1fr; }

            .video-box, .stat-box, .quiz-box, .cart-box { grid-column: span 1; }

        }

    </style>

</head>

<body>

<div class="container">

    <header>

        <h1>夜尿健康專案 v2.1</h1>

        <p>專業醫學分析與居家管理方案</p>

    </header>

    <div class="bento-grid">

        <!-- Video Box -->

        <div class="bento-item video-box">

            <h3>深度解析：為什麼你會夜尿？</h3>

            <div class="video-wrapper">

                <iframe src="https://player.vimeo.com/video/76979871" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>

            </div>

        </div>

        <!-- Stat Box -->

        <div class="bento-item stat-box">

            <h3>數據概覽</h3>

            <p style="font-size: 2rem; font-weight: bold; color: #4f46e5;">65%</p>

            <p>50 歲以上男性受訪者曾受夜尿困擾。</p>

        </div>

        <!-- Quiz Box (Algorithm v2.1) -->

        <div class="bento-item quiz-box">

            <h3>自測演算法 v2.1</h3>

            <div class="quiz-container" id="quiz">

                <p>過去一個月內，平均每晚起床如廁次數：</p>

                <select id="freq">

                    <option value="0">0 次</option>

                    <option value="1">1 次</option>

                    <option value="3">2-3 次</option>

                    <option value="5">4 次以上</option>

                </select>

                <p>夜尿對您睡眠品質的影響：</p>

                <select id="impact">

                    <option value="1">輕微</option>

                    <option value="3">中度</option>

                    <option value="5">嚴重</option>

                </select>

                <div style="margin-top: 20px;">

                    <button onclick="calculateScore()">計算風險指數</button>

                </div>

                <div id="result-display"></div>

            </div>

        </div>

        <!-- Cart Box (Closed Loop) -->

        <div class="bento-item cart-box">

            <h3>建議方案與結帳</h3>

            <div id="product-list">

                <input type="checkbox" id="p1" value="500"> 專業居家睡眠監測組 ($500)<br>

                <input type="checkbox" id="p2" value="200"> 舒眠營養補充方案 ($200)

            </div>

            <div style="margin-top: 20px;">

                <p>總計：$<span id="total-price">0</span></p>

                <button onclick="submitToAppsScript()">完成登記並提交</button>

            </div>

            <p id="submit-status" style="font-size: 0.8rem; margin-top: 10px;"></p>

        </div>

    </div>

</div>

<script>

    // Algorithm v2.1 logic

    function calculateScore() {

        const f = parseInt(document.getElementById('freq').value);

        const i = parseInt(document.getElementById('impact').value);

        const score = f + i;

        let msg = "";

        

        if(score <= 2) msg = "低風險：維持良好作息即可。";

        else if(score <= 5) msg = "中風險：建議調整睡前飲水習慣。";

        else msg = "高風險：請諮詢專業醫師意見。";

        

        document.getElementById('result-display').innerText = `得分：${score} | ${msg}`;

        return score;

    }

    // Cart Logic

    const checkboxes = document.querySelectorAll('#product-list input');

    checkboxes.forEach(cb => {

        cb.addEventListener('change', () => {

            let total = 0;

            checkboxes.forEach(c => { if(c.checked) total += parseInt(c.value); });

            document.getElementById('total-price').innerText = total;

        });

    });

    // Apps Script Integration (Closed Loop)

    async function submitToAppsScript() {

        const score = calculateScore();

        const total = document.getElementById('total-price').innerText;

        const statusEl = document.getElementById('submit-status');

        

        const data = {

            timestamp: new Date().toISOString(),

            score: score,

            total_amount: total

        };

        statusEl.innerText = "正在傳輸數據...";

        try {

            // 此處需替換為您部署的 Google Apps Script 網址

            const WEB_APP_URL = 'YOUR_APPS_SCRIPT_URL_HERE'; 

            

            // 範例模擬

            console.log("Submitting:", data);

            setTimeout(() => {

                statusEl.style.color = "green";

                statusEl.innerText = "數據已成功加密並上傳至後端系統。";

            }, 1500);

            

        } catch (error) {

            statusEl.style.color = "red";

            statusEl.innerText = "上傳失敗，請檢查網絡連接。";

        }

    }

</script>

</body>

</html>
