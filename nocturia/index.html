<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Health Decoder｜夜尿專題 · 從源頭除錯</title>
  <style>
    /* ==========================================================================
       Health-Decoder.com 全站統一設計規範 (Design System v5.0 - Bento Grid)
       標準：WCAG 2.1 AA 無障礙規範 | 2026 DTC Bento Grid 模組化佈局
       ========================================================================== */
    :root {
      --color-primary: #0F172A;
      --color-primary-dark: #020617;
      --color-primary-light: #F1F5F9;
      --color-accent: #0D9488;
      --color-accent-hover: #0F766E;
      --color-accent-light: #CCFBF1;
      --color-accent-text: #115E59;
      
      --color-wa: #25D366;
      --color-wa-hover: #1EBE5D;
      
      --color-danger: #EF4444;
      --color-danger-bg: #FEF2F2;
      --color-warning: #F59E0B;
      --color-warning-bg: #FFFBEB;
      
      --color-text-main: #1E293B;
      --color-text-muted: #475569;
      --color-text-sub: #64748B;
      
      --color-bg: #F8FAFC;
      --color-surface: #FFFFFF;
      --color-border: #E2E8F0;
      
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.06);
      --shadow-lg: 0 12px 30px rgba(15, 23, 42, 0.09);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-stack);
      font-size: 19px;
      line-height: 1.75;
      color: var(--color-text-main);
      background-color: var(--color-bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding-bottom: 80px;
    }

    /* === 導航列 (封閉式零外跳) === */
    .navbar {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
    }
    .nav-container {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
    }
    .nav-brand {
      font-size: 20px;
      font-weight: 800;
      color: var(--color-primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* === 主版面容器 === */
    .container {
      width: 100%;
      max-width: 980px;
      margin: 24px auto;
      padding: 0 20px;
    }
    .section-card {
      background: var(--color-surface);
      border-radius: var(--radius-xl);
      padding: 36px 32px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--color-border);
      margin-bottom: 36px;
    }

    /* === 排版階梯 === */
    h1 { font-size: 32px; line-height: 1.35; font-weight: 800; color: var(--color-primary); margin-bottom: 16px; }
    h2 { font-size: 24px; line-height: 1.4; font-weight: 800; color: var(--color-primary); margin: 0 0 16px 0; display: flex; align-items: center; gap: 10px; }
    h3 { font-size: 20px; line-height: 1.45; font-weight: 700; color: var(--color-primary); margin-bottom: 10px; }
    p { margin-bottom: 12px; color: var(--color-text-muted); font-size: 17px; }

    /* === 按鈕系統 === */
    .btn-primary {
      display: inline-block;
      width: 100%;
      background: var(--color-primary);
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 700;
      padding: 16px 28px;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }
    .btn-primary:hover { background: var(--color-primary-dark); transform: translateY(-1px); }
    .btn-accent {
      display: inline-block;
      width: 100%;
      background: var(--color-accent);
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 700;
      padding: 16px 28px;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }
    .btn-accent:hover { background: var(--color-accent-hover); }
    .btn-outline {
      display: inline-block;
      background: transparent;
      border: 1.5px solid var(--color-primary);
      color: var(--color-primary);
      font-size: 16px;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: var(--radius-md);
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-outline:hover { background: var(--color-primary-light); }

    /* === Block B 題庫排版 (100% v5 視覺設計) === */
    .user-info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (max-width: 640px) {
      .user-info-grid { grid-template-columns: 1fr; }
    }
    .input-field {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-md);
      font-size: 16px;
      font-family: inherit;
      color: var(--color-text-main);
      background-color: var(--color-surface);
      transition: border-color 0.2s ease;
    }
    .input-field:focus { outline: none; border-color: var(--color-accent); }
    .quiz-group {
      background: var(--color-bg);
      border-radius: var(--radius-lg);
      padding: 24px 20px;
      margin-bottom: 24px;
      border: 1px solid var(--color-border);
    }
    .quiz-group-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 12px;
    }
    .quiz-num {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--color-accent);
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      flex-shrink: 0;
    }
    .quiz-title { font-size: 18px; font-weight: 700; color: var(--color-primary); }
    .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .option-label {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-md);
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 52px;
      line-height: 1.5;
    }
    .option-label:hover { border-color: var(--color-accent); background: var(--color-accent-light); }
    .option-label input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--color-accent); flex-shrink: 0; }
    .none-opt { background: #F1F5F9; border-style: dashed; }

    /* === 響應式 Vimeo 播放容器 === */
    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: var(--radius-lg);
      margin-bottom: 20px;
      background: #000;
    }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

    /* === v6 專屬高質感微調 === */
    .hero-trust-box {
      background: var(--color-surface);
      border-left: 4px solid var(--color-accent);
      border-top: 1px solid var(--color-border);
      border-right: 1px solid var(--color-border);
      border-bottom: 1px solid var(--color-border);
      border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
      padding: 18px 20px;
      margin: 20px auto 0 auto;
      max-width: 620px;
      text-align: left;
    }
    .hero-trust-name { font-size: 18px; font-weight: 800; color: var(--color-primary); }
    .hero-trust-tag { font-size: 15px; font-weight: 700; color: var(--color-accent-text); margin-top: 2px; }
    .hero-trust-desc { font-size: 15px; color: var(--color-text-muted); margin-top: 4px; line-height: 1.6; }
    .hero-trust-url { font-size: 13px; color: var(--color-text-sub); margin-top: 4px; font-weight: 500; }

    /* Block G 兩行流與雙按鍵 */
    .product-two-row {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }
    .p-row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 12px; }
    .p-name-text { font-size: 17px; font-weight: 800; color: var(--color-primary); flex: 1; }
    .p-row-bottom { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .p-benefit-text { font-size: 14.5px; color: var(--color-text-muted); flex: 1; line-height: 1.5; }
    .btn-detail {
      background: var(--color-primary);
      color: #FFF;
      padding: 7px 14px;
      font-size: 14px;
      font-weight: 700;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s ease;
    }
    .btn-detail:hover { background: var(--color-primary-dark); }
    .btn-more {
      background: var(--color-accent-light);
      color: var(--color-accent-text);
      border: 1px solid var(--color-accent);
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 700;
      border-radius: var(--radius-sm);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .btn-more:hover { background: var(--color-accent); color: #FFF; }

    /* Block H 單行與雙行選購 */
    .h-single-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
    }
    .h-bundle-card {
      background: var(--color-surface);
      border: 2px solid var(--color-accent);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-md);
    }
    .qty-control { display: flex; align-items: center; gap: 8px; }
    .qty-btn {
      width: 32px;
      height: 32px;
      border: 1px solid var(--color-border);
      background: var(--color-bg);
      border-radius: var(--radius-sm);
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }
    .qty-val { font-size: 16px; font-weight: 800; width: 24px; text-align: center; }

    /* 購物車結算 */
    .summary-box { background: var(--color-bg); border-radius: var(--radius-lg); padding: 18px 20px; margin-bottom: 24px; border: 1px solid var(--color-border); }
    .summary-line { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 6px; }
    .summary-total { font-size: 18px; font-weight: 900; color: var(--color-primary); border-top: 1px solid var(--color-border); padding-top: 10px; margin-top: 10px; }

    /* Modal 深色背景 + 獨立純白圖框 */
    .modal-dark-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.75);
      backdrop-filter: blur(4px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-dark-container {
      background: #111827;
      color: #E2E8F0;
      width: 100%;
      max-width: 580px;
      max-height: 85vh;
      border-radius: var(--radius-xl);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #374151;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .modal-sticky-header {
      position: sticky;
      top: 0;
      background: #111827;
      padding: 16px 20px;
      border-bottom: 1px solid #374151;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .modal-header-title { font-size: 18px; font-weight: 800; color: #FFFFFF; }
    .modal-btn-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #1F2937;
      color: #9CA3AF;
      border: none;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .modal-btn-close:hover { background: #374151; color: #FFF; }
    .modal-scroll-body {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 20px;
      font-size: 15px;
      line-height: 1.7;
      color: #CBD5E1;
    }
    .modal-white-image-box {
      width: 240px;
      height: 240px;
      margin: 0 auto 18px auto;
      border-radius: 16px;
      background: #FFFFFF;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .modal-white-image-box img { width: 100%; height: 100%; object-fit: contain; }
    .gallery-thumbs { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
    .gallery-thumb-btn {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      background: #FFFFFF;
      padding: 4px;
      border: 1.5px solid #4B5563;
      cursor: pointer;
    }
    .gallery-thumb-btn img { width: 100%; height: 100%; object-fit: contain; }
    .modal-bottom-bar { border-top: 1px solid #374151; padding: 14px 20px; background: #1F2937; text-align: center; }
    .modal-btn-full-close {
      width: 100%;
      background: #374151;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 700;
      padding: 10px 0;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .modal-btn-full-close:hover { background: #4B5563; }

    /* Block K 逐級向上平滑導航狀態機 */
    .elevator-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      background: var(--color-primary);
      color: #FFF;
      border-radius: 50%;
      border: none;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: var(--shadow-lg);
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }
    .elevator-btn:hover { transform: scale(1.08); background: var(--color-primary-dark); }
  </style>
</head>
<body>

  <!-- Nav Bar: 封閉式零外跳導航 (保留顯微鏡 Emoji 🔬 Health Decoder) -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">
        🔬 Health Decoder <span>健康解碼</span>
      </div>
    </div>
  </nav>

  <div class="container">

    <!-- Block A: 頂部 Hero 區 ✕ 極速自測引導 -->
    <section id="blockA" class="section-card" style="text-align: center;">
      <h1 style="font-size: 30px; font-weight: 900; line-height: 1.35; color: var(--color-primary); margin-bottom: 8px;">
        半夜頻繁起「身」，<br>成晚無覺好瞓？
      </h1>
      <div style="font-size: 20px; font-weight: 800; color: var(--color-accent); margin-bottom: 20px;">
        搞清楚源頭，先可以治本。
      </div>
      
      <div style="max-width: 480px; margin: 0 auto 20px auto;">
        <button type="button" class="btn-primary" onclick="scrollToId('blockB')">
          馬上開始初步自我診斷
        </button>
      </div>

      <!-- 信任卡片 (獨立逐行排版，徹底解決手機端折行溢出) -->
      <div class="hero-trust-box">
        <div class="hero-trust-name">Duncan Chan</div>
        <div class="hero-trust-tag">工程師邏輯 ✕ 代謝底層解碼</div>
        <div class="hero-trust-desc">拒將退化當宿命，從源頭除錯，守住不求人的自理底氣。</div>
        <div class="hero-trust-url">health-decoder.com</div>
      </div>
    </section>

    <!-- Block B: 六大純化維度初步自我診斷問卷 (MOD-NOCT-QUIZ 100% 正版題庫與 v5 視覺設計) -->
    <section id="blockB" class="section-card">
      <div style="margin-bottom: 24px; text-align: center;">
        <h2 style="justify-content: center; margin: 0; font-size: 24px;">📋 請完成以下問卷作初步自我診斷。</h2>
      </div>

      <!-- 個人資料輸入 -->
      <div class="user-info-grid">
        <div>
          <label style="font-size: 15px; font-weight: 700; display: block; margin-bottom: 6px; color: var(--color-text-main);">稱呼 *</label>
          <input type="text" id="quizUserName" class="input-field" placeholder="請輸入你的稱呼" required>
        </div>
        <div>
          <label style="font-size: 15px; font-weight: 700; display: block; margin-bottom: 6px; color: var(--color-text-main);">性別 *</label>
          <select id="quizGender" class="input-field">
            <option value="男">男</option>
            <option value="女">女</option>
          </select>
        </div>
        <div>
          <label style="font-size: 15px; font-weight: 700; display: block; margin-bottom: 6px; color: var(--color-text-main);">年齡區間 *</label>
          <select id="quizAge" class="input-field">
            <option value="45以下">45 歲以下</option>
            <option value="46–55">46–55 歲</option>
            <option value="56–65" selected>56–65 歲</option>
            <option value="65–75">65–75 歲</option>
            <option value="75以上">75 歲以上</option>
          </select>
        </div>
      </div>

      <!-- 6 大維度 (100% v5 視覺設計與題庫，無內部題號代號) -->
      <!-- 維度 1 -->
      <div class="quiz-group">
        <div class="quiz-group-header">
          <div class="quiz-num">1</div>
          <div>
            <div class="quiz-title">維度 1：出水量與起夜頻率【單選】</div>
          </div>
        </div>
        <div class="options-grid">
          <label class="option-label">
            <input type="radio" name="dim1" value="D1_A" checked>
            <span><strong>單次尿量充足（>250 mL）：</strong>每次排尿像裝滿大半杯，一晚起來 2 次以上。</span>
          </label>
          <label class="option-label">
            <input type="radio" name="dim1" value="D1_B">
            <span><strong>每次只有一點點（<150 mL）：</strong>每次尿量極少甚至幾滴，頻繁覺得急迫、憋不住。</span>
          </label>
          <label class="option-label">
            <input type="radio" name="dim1" value="D1_C">
            <span><strong>單次尿量極大且清澈如清水：</strong>感覺被滿滿尿意憋醒，每次排出大量清尿。</span>
          </label>
          <label class="option-label">
            <input type="radio" name="dim1" value="D1_D">
            <span><strong>醒來順便去尿：</strong>尿意並不強烈，被微小聲音驚醒後「順便」去排少許。</span>
          </label>
        </div>
      </div>

      <!-- 維度 2 -->
      <div class="quiz-group">
        <div class="quiz-group-header">
          <div class="quiz-num">2</div>
          <div>
            <div class="quiz-title">維度 2：排尿動作與出口阻抗【可多選】</div>
          </div>
        </div>
        <div class="options-grid">
          <label class="option-label">
            <input type="checkbox" name="dim2" value="D2_A" class="dim2-item">
            <span>站在馬桶前要等數秒才出尿，尿流變細、斷斷續續。</span>
          </label>
          <label class="option-label">
            <input type="checkbox" name="dim2" value="D2_B" class="dim2-item">
            <span>排完後總覺得膀胱底還有尿液殘留，感覺尿不乾淨。</span>
          </label>
          <label class="option-label">
            <input type="checkbox" name="dim2" value="D2_C" class="dim2-item">
            <span>突發強烈尿急感，完全忍不住，常需急奔廁所。</span>
          </label>
          <label class="option-label none-opt">
            <input type="checkbox" id="dim2_none" value="NONE" onchange="toggleDimNone('dim2')">
            <span style="font-weight: 700; color: var(--color-text-main);">🚫 以上皆無 / 排尿順暢無阻抗</span>
          </label>
        </div>
      </div>

      <!-- 維度 3 -->
      <div class="quiz-group">
        <div class="quiz-group-header">
          <div class="quiz-num">3</div>
          <div>
            <div class="quiz-title">維度 3：下肢流體與肌肉動力【可多選】</div>
          </div>
        </div>
