<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Health Decoder · 個人健康自測</title>
  <link rel="stylesheet" href="/reels-quiz/quiz.css" />
  <script type="module" src="/reels-quiz/quiz.mjs"></script>
</head>
<body class="theme-light">
  <main class="stage-916">
    <!-- Layer 0：底層全幅 9:16 影片（播片時全屏清晰；問題頁時自動全屏模糊並循環動態） -->
    <div class="video-layer" id="videoLayer">
      <video id="duncanVideo" playsinline webkit-playsinline preload="auto"></video>
    </div>
    <!-- 頂部極簡進度條（正式版隱藏測試選項；僅 ?dev=1 時顯示開發工具列） -->
    <header class="hud-top">
      <div class="hud-row">
        <div class="hud-group">
          <button type="button" class="hud-pill" id="themeBtn" data-click="toggleTheme">白底／深色</button>
          <label for="localVideoInput" class="hud-pill" title="選取電腦入面 16 條 MP4 實測">📂 MP4</label>
          <input type="file" id="localVideoInput" accept="video/*" multiple style="display:none" data-change="loadLocalVideos" data-pass="files" />
        </div>
        <div class="hud-group">
          <select class="hud-pill hud-select" aria-label="切換入口軸" id="axisJumpSel" data-change="switchAxis" data-pass="value" title="切換入口軸">
            <option value="metabolic">三高糖脂</option>
            <option value="mito">線粒體肌力</option>
            <option value="gut">心腸發炎</option>
            <option value="dual">雙軌用藥</option>
          </select>
          <select class="hud-pill hud-select" id="quickJumpSel" aria-label="跳頁預覽" data-change="jumpStep" data-pass="value" title="跳頁預覽">
            <option value="welcome">入口影片</option>
            <option value="q1">Q1</option>
            <option value="q2">Q2</option>
            <option value="q3">Q3</option>
            <option value="q4">Q4</option>
            <option value="q5">Q5</option>
            <option value="q6">Q6</option>
            <option value="safety_stop">紅旗攔截</option>
            <option value="q7">Q7</option>
            <option value="review">覆核答案</option>
            <option value="checkout">解鎖資料</option>
            <option value="report1">4軸報告</option>
            <option value="offline_flow">線下6步</option>
            <option value="booking">預約門市</option>
            <option value="booking_done">預約確認</option>
            <option value="post_whatsapp">發訊後選項</option>
          </select>
        </div>
      </div>
      <div class="prog-track" role="progressbar" aria-label="問卷進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="6">
        <div class="prog-fill" id="progFill"></div>
      </div>
    </header>
    <!-- 階段 1：播片態（畫面中央全淨空；Mute 鍵由客人自按；推進掣於影片最後 1 秒先浮現） -->
    <section class="video-only-controls" id="videoControls">
      <button type="button" class="start-play-btn hide" id="startPlayBtn" data-click="manualStartVideo" data-pass="event">▶ 開始播放</button>
      <p id="videoStatus" class="video-status" role="status" hidden></p>
      <div class="skip-video-bar">
        <button type="button" class="mute-video-btn" id="muteVideoBtn" data-click="toggleMuteVideo" data-pass="event">🔊 有聲</button>
        <button type="button" class="speed-video-btn" id="speedVideoBtn" data-click="cyclePlaybackRate" data-pass="event">語速：正常</button>
        <button type="button" class="replay-video-btn" data-click="replayCurrentVideo" data-pass="event">↺ 重播</button>
        <button type="button" class="skip-video-btn delayed-hide" id="skipVideoBtn" data-click="enterPanelPhase">開始進行自測 →</button>
      </div>
    </section>
    <!-- 階段 2：高透毛玻璃面板（背後為彩色動態模糊影片） -->
    <section class="glass-panel hidden-phase" id="glassPanel">
      <div class="panel-header">
        <span class="step-badge" id="stepBadge">問題 1 / 7</span>
        <h1 class="panel-title" id="panelTitle"></h1>
      </div>
      <div class="panel-body" id="panelBody"></div>
      <div class="panel-footer" id="panelFooter"></div>
    </section>
  </main>
</body>
</html>
