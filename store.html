<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>精準保養單品商店 | Health Decoder</title>
  <style>
    :root {
      --primary: #0F172A;
      --accent: #0D9488;
      --wa-green: #25D366;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --text: #1E293B;
      --text-muted: #64748B;
      --border: #E2E8F0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; line-height: 1.6; color: var(--text); background: var(--bg); padding-bottom: 110px; }
    .container { max-width: 740px; margin: 0 auto; padding: 20px; }
    h1 { font-size: 26px; color: var(--primary); margin-bottom: 8px; font-weight: 800; }
    .subtitle { font-size: 16px; color: var(--text-muted); margin-bottom: 20px; }
    
    .nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .nav-link { color: var(--accent); text-decoration: none; font-weight: 700; font-size: 16px; }

    .product-card { background: var(--surface); border: 2px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 14px; display: flex; gap: 14px; align-items: flex-start; }
    .product-card.selected { border-color: var(--accent); background: #F0FDFA; }
    .check-box { width: 22px; height: 22px; accent-color: var(--accent); margin-top: 4px; cursor: pointer; }
    .product-info { flex: 1; }
    .product-title { font-size: 19px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
    .product-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; }
    
    .pack-selector { display: flex; gap: 8px; flex-wrap: wrap; }
    .pack-btn { background: #F1F5F9; border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .pack-btn.active { background: #CCFBF1; border-color: var(--accent); color: #0F766E; }

    .floating-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #FFF; border-top: 1px solid var(--border); padding: 12px 20px; box-shadow: 0 -4px 16px rgba(0,0,0,0.06); z-index: 100; }
    .floating-inner { max-width: 740px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .btn-wa { background: var(--wa-green); color: #FFF; font-size: 17px; font-weight: 700; padding: 12px 20px; border-radius: 12px; border: none; cursor: pointer; text-decoration: none; }
  </style>
</head>
<body>

<div class="container">
  <div class="nav-bar">
    <a href="/" class="nav-link">← 返回首頁</a>
    <a href="/health-map.html" class="nav-link">1:1 Health Map</a>
  </div>

  <h1>🛒 精準保養單品商店</h1>
  <p class="subtitle">堅持「先需要，後補充；產品只是支持工具」原則。提供單品散買與多件補貨特惠，勾選後一鍵透過 WhatsApp 安排。</p>

  <!-- 單品 1: NMN -->
  <div class="product-card" id="card-nmn">
    <input type="checkbox" class="check-box" id="chk-nmn" onchange="handleCheck('nmn')">
    <div class="product-info">
      <div class="product-title">高純度 NMN 膠囊</div>
      <div class="product-desc">提升細胞 NAD+ 濃度，支援粒線體能量生成與夜間自噬修復。</div>
      <div class="pack-selector" id="pack-nmn">
        <button class="pack-btn active" onclick="setPack('nmn', 1, 980, '單瓶 (無折扣)')">1 瓶 (HK$ 980)</button>
        <button class="pack-btn" onclick="setPack('nmn', 3, 2500, '3 瓶特惠 (85折)')">3 瓶 (HK$ 2,500)</button>
        <button class="pack-btn" onclick="setPack('nmn', 6, 4410, '6 瓶特惠 (75折)')">6 瓶 (HK$ 4,410)</button>
      </div>
    </div>
  </div>

  <!-- 單品 2: CoQ10 -->
  <div class="product-card" id="card-coq10">
    <input type="checkbox" class="check-box" id="chk-coq10" onchange="handleCheck('coq10')">
    <div class="product-info">
      <div class="product-title">水溶性輔酶 CoQ10</div>
      <div class="product-desc">細胞粒線體電子傳遞核心輔酶，為心肌與肌肉細胞提供強效抗氧化。</div>
      <div class="pack-selector" id="pack-coq10">
        <button class="pack-btn active" onclick="setPack('coq10', 1, 380, '單瓶 (無折扣)')">1 瓶 (HK$ 380)</button>
        <button class="pack-btn" onclick="setPack('coq10', 3, 970, '3 瓶特惠 (85折)')">3 瓶 (HK$ 970)</button>
        <button class="pack-btn" onclick="setPack('coq10', 6, 1710, '6 瓶特惠 (75折)')">6 瓶 (HK$ 1,710)</button>
      </div>
    </div>
  </div>

  <!-- 單品 3: 水蛭素 -->
  <div class="product-card" id="card-hirudin">
    <input type="checkbox" class="check-box" id="chk-hirudin" onchange="handleCheck('hirudin')">
    <div class="product-info">
      <div class="product-title">天然水蛭素膠囊</div>
      <div class="product-desc">天然抗凝血酶物質，專門改善微血管流速，舒緩末梢麻痺與夜間抽筋。</div>
      <div class="pack-selector" id="pack-hirudin">
        <button class="pack-btn active" onclick="setPack('hirudin', 1, 680, '單盒 (無折扣)')">1 盒 (HK$ 680)</button>
        <button class="pack-btn" onclick="setPack('hirudin', 3, 1730, '3 盒特惠 (85折)')">3 盒 (HK$ 1,730)</button>
        <button class="pack-btn" onclick="setPack('hirudin', 6, 3060, '6 盒特惠 (75折)')">6 盒 (HK$ 3,060)</button>
      </div>
    </div>
  </div>

  <!-- 單品 4: 益生菌 -->
  <div class="product-card" id="card-probiotics">
    <input type="checkbox" class="check-box" id="chk-probiotics" onchange="handleCheck('probiotics')">
    <div class="product-info">
      <div class="product-title">IDCC 專利多菌株益生菌</div>
      <div class="product-desc">韓國專利雙層包埋，調節腸道屏障與短鏈脂肪酸生成，支援代謝平穩。</div>
      <div class="pack-selector" id="pack-probiotics">
        <button class="pack-btn active" onclick="setPack('probiotics', 1, 420, '單盒 (無折扣)')">1 盒 (HK$ 420)</button>
        <button class="pack-btn" onclick="setPack('probiotics', 3, 1130, '3 盒特惠 (9折)')">3 盒 (HK$ 1,130)</button>
        <button class="pack-btn" onclick="setPack('probiotics', 6, 2010, '6 盒特惠 (8折)')">6 盒 (HK$ 2,010)</button>
      </div>
    </div>
  </div>
</div>

<div class="floating-bar">
  <div class="floating-inner">
    <div>
      <div style="font-size: 14px; color: var(--text-muted);">已選 <span id="cart-count" style="font-weight:bold; color:var(--accent);">0</span> 項</div>
      <div style="font-size: 19px; font-weight: 800; color: var(--primary);" id="cart-total">HK$ 0</div>
    </div>
    <button class="btn-wa" onclick="checkoutWA()">WhatsApp 發送訂單明細 →</button>
  </div>
</div>

<script>
  const products = {
    nmn: { name: "高純度 NMN 膠囊", spec: "1 瓶 (HK$ 980)", price: 980 },
    coq10: { name: "水溶性輔酶 CoQ10", spec: "1 瓶 (HK$ 380)", price: 380 },
    hirudin: { name: "天然水蛭素膠囊", spec: "1 盒 (HK$ 680)", price: 680 },
    probiotics: { name: "IDCC 專利益生菌", spec: "1 盒 (HK$ 420)", price: 420 }
  };
  const cart = {};

  function setPack(id, qty, price, specText) {
    products[id].spec = `${qty}件裝 - ${specText}`;
    products[id].price = price;
    const box = document.getElementById(`pack-${id}`);
    box.querySelectorAll('.pack-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');

    if (document.getElementById(`chk-${id}`).checked) {
      cart[id] = { ...products[id] };
      updateUI();
    }
  }

  function handleCheck(id) {
    const chk = document.getElementById(`chk-${id}`);
    const card = document.getElementById(`card-${id}`);
    if (chk.checked) {
      cart[id] = { ...products[id] };
      card.classList.add('selected');
    } else {
      delete cart[id];
      card.classList.remove('selected');
    }
    updateUI();
  }

  function updateUI() {
    const keys = Object.keys(cart);
    document.getElementById('cart-count').innerText = keys.length;
    let sum = 0;
    keys.forEach(k => sum += cart[k].price);
    document.getElementById('cart-total').innerText = `HK$ ${sum.toLocaleString()}`;
  }

  function checkoutWA() {
    const keys = Object.keys(cart);
    if (keys.length === 0) { alert("請先勾選想訂購的單品！"); return; }
    let str = "";
    let total = 0;
    keys.forEach((k, idx) => {
      str += `${idx + 1}. ${cart[k].name}【${cart[k].spec}】— HK$ ${cart[k].price}\n`;
      total += cart[k].price;
    });
    const msg = `你好 Duncan，我在【health-decoder 商店】挑選了以下單品：\n\n${str}\n・預估總額：HK$ ${total.toLocaleString()}\n請教付款與送貨安排！`;
    window.open(`https://wa.me/85291234567?text=${encodeURIComponent(msg)}`, '_blank');
  }
</script>
</body>
</html>
